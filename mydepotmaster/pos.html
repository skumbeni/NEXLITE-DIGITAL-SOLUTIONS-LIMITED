// create-only, uploaded with the shifts), and the main app joins them to the log when it shows or exports it.

//   a cashier leave the till (who allowed it), a wrong manager PIN (what it was for), a pad that locked.
//   NOT written here: shift open / close (variance, forced), a discount given, a void, a refund. Their own records already say who, when,
//   why and who allowed it, and the main app reads the Audit lines straight from them, so the log cannot disagree with the ledger.

  const upd=()=>{

    {const ck=clockStop('Nothing was recorded.');if(ck){err.textContent=ck;return;}}
    const v=Shifts.varianceOf(sm,c);
    if(!confirm(v===0?'Close this shift? This cannot be undone.':'Close this shift with the cash '+(v<0?'short by ':'over by ')+money(Math.abs(v))+'? This cannot be undone.'))return;
    SHBUSY=true;go.disabled=true;go.textContent='Closing\u2026';
    let rec=null,failed='';
    try{
      rec=await withShiftLock(async()=>{

        const sales=(await LEDGER.load(ledgerArgs(rets))).list;   // everything on this phone, read fresh: another tab may have sold meanwhile
        const cur=await SHIFTLG.current(o.tillId);
        if(!cur||cur.open.shiftId!==o.shiftId){const x=new Error('closed');x.code='ALREADY_CLOSED';throw x;}
        return SHIFTLG.close(cur,sales,c,{username:String(USER.username),role:String(USER.role||'')},note.value.trim(),{out:Returns.cashOutOf(cur.open.shiftId,rets)});
      });
    }catch(e){
      console.warn('Shift not closed',e);
      if(e&&e.code==='ALREADY_CLOSED')failed='This shift was already closed (maybe on another tab).';
      else failed=(e&&e.code==='INVALID')?e.message+'. Nothing was recorded.':(SHIFT_MSG[e&&e.code]||'The shift could not be closed. Nothing was recorded. Try again.');
    }
    SHBUSY=false;
    await loadSold();await loadShift();notifyShift();paintShift();
    if(failed){
      if(SHBODY){

        else renderShift();                                                                                        // gone (closed on another tab): show what is true now
      }

  }

  setTimeout(()=>{try{cnt.focus();}catch{}},0);

// ── X AND Z REPORTS (till roadmap step 17) ─────────────────────────────────────
// X report: a reading of the shift that is open right now (sales, money by method, cash that should be in the drawer). It records
//   nothing and changes nothing, so it can be taken as often as wanted. The cashier gets it for their own shift; an admin or manager
//   can also take it for someone else's open shift on this till.
// Z report: the final figures of a CLOSED shift. They are the close record itself (shiftCloses/{id}), so the Z cannot differ from what was
//   counted and signed off, and it has no number of its own: the shift id is its number. Printed right after Close shift, and the last
//   one on this till can be reprinted from the Open shift screen (marked COPY).
// Both are worked out from the ledger on this phone each time (Shifts.report). If a Z is printed on a phone that has not downloaded
// every sale of that shift, the totals stay correct and the item list is left out rather than shown wrong.
// The report is built like the receipt and the void/refund slip (v0.3.106): same paper (logo, brand colour, print rules), symbol column, bold totals, "2x Name" items; it prints the same way: Print, then the browser's print
// dialog, which also gives \"Save as PDF\". The main app's day close-out (index.html) adds the day's Z over all tills.
let RPOVL=null,RPOPENER=null;
function lastClosedHere(){                          // this till's newest closed shift, or null
  const id=tillIdNow();if(!id)return null;
  const l=Shifts.shiftsOf(SHIFT_ALL).filter(x=>x.close&&x.open.tillId===id);
  return l.length?l[l.length-1]:null;
}
const fdt=ms=>{const d=new Date(ms);return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' \u00B7 '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});};
function reportEl(r,copy){
  // v0.3.106: built like the receipt and the void/refund slip: the same head, the number under the title, the till and dates as centred lines, the tag after them,
  // amounts with the symbol in its own column (pairRow), bold capitals for the totals, items as "2x Name", and the same kind of closing line as the slip.
  const Z=r.kind==='Z',paper=paperTop();
  paper.append(el('hr','dd'),el('div','ttl',Z?'Z report':'X report'),el('hr','dd'));
  paper.append(el('div','c mu','No. '+r.shiftId));
  paper.append(el('div','c mu','Till '+r.till+' \u00B7 Cashier: '+r.cashier));
  paper.append(el('div','c mu','Opened '+slipDt(r.openedAt)));
  paper.append(el('div','c mu',Z?'Closed '+slipDt(r.closedAt)+(r.forced?' by '+r.closedBy:''):'Taken '+slipDt(r.takenAt)));
  const tg=el('div','c');tg.append(el('span',Z?'tag paid':'tag',Z?'FINAL \u2014 SHIFT CLOSED':'READING ONLY \u2014 SHIFT STILL OPEN'));
  if(copy)tg.append(el('span','tag','COPY'));
  paper.append(tg);
  const cnt=(t,a,v,cls)=>{const x=el('tr',cls||''),c=el('td','r',v);x.append(el('td','',a),c);t.append(x);};   // a plain figure: a count or a word
  const mon=(t,a,n)=>pairRow(t,a,n);                                  // an amount: symbol in its own column, figure on the right (the receipt's item lines)
  const pay=(t,a,n)=>pairRow(t,a,n,'pm');                             // bold capitals (the receipt's payment lines)
  const tot=(t,a,n)=>{const x=el('tr','gt');x.append(el('td','',a),el('td','r',symTxt()+' '+num(n)));t.append(x);};   // the receipt's TOTAL AMOUNT line
  const block=(title,fill)=>{                                         // dashed line, heading, figures (fill gets the table and the block); kept whole on one page when printed
    paper.append(el('hr','dash'));
    const d=el('div','tail'),t=el('table');d.append(el('div','sec',title),t);fill(t,d);paper.append(d);
  };
  block('Sales',(t,d)=>{
    cnt(t,'Sales',String(r.saleCount));
    if(r.itemsComplete)cnt(t,'Items sold',fq(r.qtyTotal));
    tot(t,'Total sold',r.total);
    if(r.itemsComplete&&r.promoGiven>0)mon(t,'Offers applied ('+r.promoCount+')',r.promoGiven);
    if(r.itemsComplete&&r.discountGiven>0)mon(t,'Discounts given ('+r.discountCount+')',r.discountGiven);
    if(r.credit>0)mon(t,'Left unpaid (credit)',r.credit);
    if(r.itemsComplete&&(r.promoGiven>0||r.discountGiven>0))d.append(el('div','mu','Offers and discounts are already off the total.'));   // same words as the thermal report
  });
  if(r.firstReceipt)paper.append(el('div','mu','Receipts '+r.firstReceipt+(r.lastReceipt&&r.lastReceipt!==r.firstReceipt?' to '+r.lastReceipt:'')));
  if(r.rt&&r.rt.count){                                   // step 19: voids and refunds paid out in this shift
    block('Voids & refunds',t=>{
      if(r.rt.voids)cnt(t,'Voids',String(r.rt.voids));
      if(r.rt.refunds)cnt(t,'Refunds',String(r.rt.refunds));
      mon(t,'Value taken back',-r.rt.total);
      if(r.rt.credit>0)mon(t,'Taken off customers\u2019 balances',r.rt.credit);
      Shifts.METHODS.forEach(m=>{if(r.rt.byMethod[m]>0)mon(t,'Handed back \u2014 '+METHODS[m].label,r.rt.byMethod[m]);});
      tot(t,'Net sales (after returns)',r.netTotal);
    });
  }
  block('Money collected',t=>{
    let coll=0;
    Shifts.METHODS.forEach(m=>{coll+=Math.round((Number(r.byMethod[m])||0)*100);if(m==='cash'||r.byMethod[m]>0)pay(t,METHODS[m].label,r.byMethod[m]);});
    tot(t,'Total collected',coll/100);
  });
  block('Cash drawer',t=>{
    mon(t,'Float (cash at the start)',r.float);
    mon(t,'+ Cash sales',r.cashSales);
    if(r.cashOut>0)mon(t,'\u2212 Cash paid back (voids & refunds)',r.cashOut);
    tot(t,'Cash expected',r.expectedCash);
    if(Z){
      pay(t,'Cash counted',r.countedCash);
      if(r.variance===0)cnt(t,'Balanced','\u2014','pm');else pay(t,r.variance<0?'SHORT':'OVER',Math.abs(r.variance));
    }else cnt(t,'Cash counted','not counted yet');
  });
  if(r.note)paper.append(el('div','mu','Note: '+r.note));
  paper.append(el('hr','dash'),el('div','sec','Items sold'));
  if(!r.itemsComplete)paper.append(el('div','mu','Item list left out: this phone does not hold every sale of this shift yet. The totals above are correct.'));
  else if(!r.items.length)paper.append(el('div','mu','No items sold.'));
  else{
    const it=el('table'),MAXI=60;
    r.items.slice(0,MAXI).forEach(i=>{const tb=el('tbody');pairRow(tb,lineLbl(i),i.total);it.append(tb);});   // one tbody per item so a page break never splits a name from its figure
    paper.append(it);
    if(r.items.length>MAXI)paper.append(el('div','mu','\u2026and '+(r.items.length-MAXI)+' smaller items. The totals above include them.'));
  }
  paper.append(el('hr','dash'));
  const tail=el('div','tail');
  if(Z){const sg=el('div','sig');sg.append(el('span','','Cashier'),el('span','','Checked by'));tail.append(sg);}
  tail.append(el('div','thx',Z?'Keep this report':'Reading only'),el('div','ft',Z?'Final figures of shift '+r.shiftId+'.':'X report \u00B7 nothing was closed or changed.'));
  const svg=bcSvg(r.shiftId);                                  // v0.3.107: a Code 128 barcode of the shift number, like the receipt's of its number (left out if it cannot be drawn)
  if(svg){const bc=el('div','bc');bc.innerHTML=svg;tail.append(el('hr','dash'),bc);}
  paper.append(tail);
  return paper;
}
function showReport(r,copy){

function printReport(r,copy){                         // the page title is the file name when the cashier picks \"Save as PDF\"
  const pf=prefs();                                    // step 35: on a thermal printer (RawBT or Bluetooth) the report prints as text, no dialog
  if(isThermal(pf)){try{thermal(escposReport(r,!!copy,pf),pf,false);}catch(e){console.warn(e);say('Could not build the report for the printer.','bad');}return;}
  const t=document.title;

}
// The same thermal layout as escposReceipt / escposReturn (they share escposKit above), for an X or Z report: the figures of reportEl() above, as text.
function escposReport(r,copy,pf){
  const k=escposKit(pf),di=DATA.depotInfo||{},Z=r.kind==='Z';
  const sec=s=>{k.bd(1);k.ln(s);k.bd(0);};

  const bold=(a,n)=>{k.bd(1);k.lr(String(a).toUpperCase(),k.col(n));k.bd(0);};   // bold capitals: the receipt's TOTAL AMOUNT and payment lines
  k.bd(1);k.hi(k.sz?k.SC:1);k.ctr(di.name||'Shop Inventory & Sales Manager');k.hi(k.SC);k.bd(0);
  if(di.district)k.ctr(di.district);
  if(di.contactPhone)k.ctr('Tel: '+di.contactPhone);
  k.dd();k.ttl(Z?'Z REPORT':'X REPORT');k.dd();
  k.ctr('No. '+r.shiftId);k.ctr('Till '+r.till);k.ctr('Cashier: '+r.cashier);
  k.ctr('Opened '+slipDt(r.openedAt));
  k.ctr(Z?'Closed '+slipDt(r.closedAt)+(r.forced?' by '+r.closedBy:''):'Taken '+slipDt(r.takenAt));
  k.ctr(Z?'** FINAL - SHIFT CLOSED **':'** READING ONLY - SHIFT STILL OPEN **');
  if(copy)k.ctr('[COPY]');
  k.ln('');
  k.dash();sec('SALES');
  k.lr('Sales',String(r.saleCount));
  if(r.itemsComplete)k.lr('Items sold',fq(r.qtyTotal));
  bold('Total sold',r.total);
  if(r.itemsComplete&&r.promoGiven>0)mon('Offers given ('+r.promoCount+')',r.promoGiven);
  if(r.itemsComplete&&r.discountGiven>0)mon('Discounts given ('+r.discountCount+')',r.discountGiven);
  if(r.itemsComplete&&(r.promoGiven>0||r.discountGiven>0))k.wrap('Offers and discounts are already off the total.').forEach(s=>k.ln(s));
  if(r.credit>0)mon('Left unpaid (credit)',r.credit);
  if(r.firstReceipt)k.wrap('Receipts '+r.firstReceipt+(r.lastReceipt&&r.lastReceipt!==r.firstReceipt?' to '+r.lastReceipt:'')).forEach(s=>k.ln(s));
  if(r.rt&&r.rt.count){                                   // step 19: voids and refunds paid out in this shift
    k.dash();sec('VOIDS & REFUNDS');
    if(r.rt.voids)k.lr('Voids',String(r.rt.voids));
    if(r.rt.refunds)k.lr('Refunds',String(r.rt.refunds));
    mon('Value taken back',-r.rt.total);
    if(r.rt.credit>0)mon('Off customers\u2019 balances',r.rt.credit);
    Shifts.METHODS.forEach(m=>{if(r.rt.byMethod[m]>0)mon('Handed back - '+METHODS[m].label,r.rt.byMethod[m]);});
    bold('Net sales (after returns)',r.netTotal);
  }
  k.dash();sec('MONEY COLLECTED');
  let coll=0;
  Shifts.METHODS.forEach(m=>{coll+=Math.round((Number(r.byMethod[m])||0)*100);if(m==='cash'||r.byMethod[m]>0)bold(METHODS[m].label,r.byMethod[m]);});
  bold('Total collected',coll/100);
  k.dash();sec('CASH DRAWER');
  mon('Float (start)',r.float);
  mon('+ Cash sales',r.cashSales);

// ── VOIDS AND REFUNDS (till roadmap step 19) ──────────────────────────────────────────────────────────────────
// A sale is never edited or deleted. Taking something back writes a NEW record that points at the sale (returns.js; uploaded to
// depots/<depot>/returns/<id> like sales, create-only):
//   VOID    the whole sale, only in the shift it was taken in; the money goes back the way it came (cash as cash, MTN as MTN).
//   REFUND  some or all of the lines, any time. The customer's unpaid balance is cleared first; only the rest is money handed back, by any
//           method, never more than was paid. Damaged goods are not put back in stock (untick "Put the goods back in stock").
// Always a reason, and someone with authority: an Admin or Manager login allows it itself, anyone else needs a manager PIN (the pad of
// step 15, the approver is recorded). Cash handed back comes out of THIS shift's drawer (expected cash drops by it), so it needs the
// cashier's own open shift. It is booked on the day and in the shift it is MADE: a closed shift or day is never changed. It works offline:
// the record is saved on the phone first, the receipt shows only after that, and it uploads when there is signal. The number comes from
// the till's receipt counter (K7F2-R000125), so two tills can never collide. Two offline tills can still return the same item at the
// same moment; the app cannot stop that, it can only find it afterwards (Returns.overReturned).
const RT_MSG={
  STORAGE:'This phone could not save it (storage full or blocked). Nothing was recorded. Free some space and try again.',
  NO_DEPOT:'This till does not know its depot yet. Open the main app online once, then try again.',

function retFindList(q){

async function doReturn(approvedBy,refunds,P){

    reason:RT.reason,note:RT.note.trim(),

  const ck=clockStop('Nothing was recorded.');if(ck)return {err:ck};
  const id=tillIdNow(),cur=id?await SHIFTLG.current(id):null;
  if(!cur)return {err:'No shift is open on this till. Open a shift, then try again. Nothing was recorded.'};
  if(!sameUser(cur.open.cashier,USER&&USER.username))return {err:'The shift open on this till is '+cur.open.cashier+'\u2019s. It must be closed before anything can be taken back. Nothing was recorded.'};
  let r;
  try{r=await NUM.next();}
  catch(e){
    console.warn('Return number failed',e);
    return {err:(NUM_MSG[e&&e.code]||'Could not take a number. Nothing was recorded. Try again.').replace('The sale was not completed.','Nothing was recorded.').replace('the sale was not completed','nothing was recorded')};
  }

  }
}

// ── LIVE-CART AUTOSAVE ───────────────────────────────────────────────────────
// Held baskets only protect a sale the cashier parks, or leaves through logout / idle timeout. An OPEN cart used to
// live in memory alone, so a reload (including the update reload), a killed browser or a dead battery lost it. Now every
// cart change writes the cart to localStorage (one draft per till tab, per depot), and the draft is deleted the moment
// the cart is empty again (held, cleared, or, later, paid).
//   • Reloaded tab: the tab keeps its id in sessionStorage, so it finds its own draft and puts it straight back in the
//     cart (re-priced, see repriceLines). A different cashier's draft goes to Held instead of into this cashier's cart.
//   • Tab that died (browser killed, phone restarted): its draft is moved to the Held list, marked "recovered", by
//     whichever till tab opens next. Whether a tab is still alive is read from the Web Locks API: every till tab holds a
//     lock named after its id for as long as it is open. Without Web Locks a draft is only adopted after HELD_OLD_MS of
//     silence, so a tab that is merely in the background is never robbed of its cart.
// Nothing here records a sale; a draft is just a cart that survived.
const DRAFT_PFX='mdm_pos_draft_v1:',TAB_KEY='mdm_pos_tab',LOCK_PFX='mdm_pos_tab:';
let TAB='';
const draftKey=(tab)=>DRAFT_PFX+((DATA&&DATA.installId)||'local')+':'+tab;
function saveDraft(){
  if(!TAB)return;                                   // before boot has claimed a tab id
  try{
    if(!CART.length){localStorage.removeItem(draftKey(TAB));return;}
    localStorage.setItem(draftKey(TAB),JSON.stringify({v:1,tab:TAB,at:Date.now(),by:USER?String(USER.username):'',disc:DISC?1:0,lv:LV?1:0,
      lines:CART.map(cartShape)}));
  }catch{}                                          // storage full or blocked: the cart still works, it just is not saved
}
// Pick this tab's id and take its lock. A duplicated browser tab copies sessionStorage, so if another tab already holds
// the lock for the id we were given, we take a new one rather than share a draft with it.
async function claimTab(){
  const mk=()=>'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  let id=null;try{id=sessionStorage.getItem(TAB_KEY);}catch{}
  if(!id)id=mk();
  if(navigator.locks&&navigator.locks.request){
    for(let i=0;i<3;i++){
      let got=false;
      try{got=await new Promise(res=>{
        navigator.locks.request(LOCK_PFX+id,{ifAvailable:true},lock=>{
          if(!lock){res(false);return;}
          res(true);return new Promise(()=>{});     // never settles: the lock is held until this page closes
        }).catch(()=>res(true));
      });}catch{got=true;}
      if(got)break;
      id=mk();
    }
  }
  try{sessionStorage.setItem(TAB_KEY,id);}catch{}
  return id;
}
async function liveTabLocks(){
  try{
    if(!(navigator.locks&&navigator.locks.query))return null;
    return new Set(((await navigator.locks.query()).held||[]).map(l=>l.name));
  }catch{return null;}                              // unknown: the caller falls back to the age rule
}
// Called at boot (before the sell screen is built; boot=true) and whenever the till comes back to the front.
// Returns {restored,adopted} so the caller can say what happened.
async function recoverDrafts(boot){
  const out={restored:0,adopted:0,notes:[]};
  const pre=draftKey(''),mine=draftKey(TAB);
  const keys=[];
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(pre))keys.push(k);}}catch{return out;}
  if(!keys.length)return out;
  const live=await liveTabLocks();
  const held=readHeld(),have=new Set(held.map(h=>h.id)),adopt=[],spent=[];
  const me=USER?String(USER.username).toLowerCase():'';
  for(const k of keys){
    let d=null;try{d=JSON.parse(localStorage.getItem(k)||'null');}catch{}
    const lines=d&&Array.isArray(d.lines)?d.lines.filter(heldLineOk):[];
    if(!lines.length){if(k!==mine)try{localStorage.removeItem(k);}catch{}continue;}   // empty or unreadable: nothing to keep
    if(k===mine){
      if(!boot)continue;                                                              // our own live draft
      if(!CART.length&&String(d.by||'').toLowerCase()===me){
        const r=repriceLines(lines);CART=r.lines;out.restored=r.lines.length;out.notes=priceNotes(r,'saved');
        if(d.disc)out.notes.push(DISC_LOST);
        if(d.lv)out.notes.push(LEVEL_LOST);continue;
      }
      // someone else's cart, or this tab already has items: park it below
    }else{
      const dead=live?!live.has(LOCK_PFX+d.tab):Date.now()-(Number(d.at)||0)>HELD_OLD_MS;
      if(!dead)continue;                                                              // another tab is still using it
    }
    if(d.disc&&!out.notes.includes(DISC_LOST))out.notes.push(DISC_LOST);
    if(d.lv&&!out.notes.includes(LEVEL_LOST))out.notes.push(LEVEL_LOST);
    adopt.push({id:'r_'+String(d.tab)+'_'+String(d.at),at:Number(d.at)||Date.now(),by:String(d.by||''),rec:true,
      lines:lines.map(cartShape),key:k});
  }
  // Move them into Held. A fixed id (tab + last change) means a pass that is interrupted before the draft is deleted
  // cannot create the basket twice. If Held is full the draft simply stays where it is and is tried again next time.
  let changed=false;
  for(const a of adopt){
    const {key,...h}=a;
    if(have.has(h.id)){spent.push(key);continue;}
    if(held.length>=HELD_MAX)break;
    held.push(h);have.add(h.id);spent.push(key);out.adopted++;changed=true;
  }
  if(changed&&!writeHeld(held)){out.adopted=0;return out;}   // could not save the list: keep every draft
  spent.forEach(k=>{try{localStorage.removeItem(k);}catch{}});
  return out;
}
function draftNotice(r){
  const m=[];
  if(r.restored)m.push('Your open sale was restored');
  if(r.adopted)m.push(r.adopted+(r.adopted===1?' unsaved sale was':' unsaved sales were')+' recovered into Held');
  m.push(...r.notes);
  return m;
}

// ── CAMERA SCANNER (roadmap step 12) ─────────────────────────────────────────
// The phone camera plus the browser's own BarcodeDetector (Chrome and Samsung Internet on Android, installed PWA included).
// No library, nothing to download, works offline. Safari (iPhone) and desktop Chrome on Windows/Linux have no BarcodeDetector of their own:
// there barcode.js (v0.3.78) installs a fallback that reads EAN-13, EAN-8, UPC-A and Code 128 (not QR, Code 39, ITF or UPC-E), so the camera
// button shows there too. It is slower and less forgiving than the native reader; a USB/Bluetooth scanner or typing works as before.
// The camera stays open so a whole basket is scanned in one go. Every read goes through resolveCode(), the same exact
// barcode/SKU rule as the scan box, so a camera read can never add an item the scan box would refuse. Only a barcode near the
// middle of the picture counts, and if two different ones are there nothing is added. A code that stays in view is added once;
// take it out of view to add it again. The camera is switched off on Done, Escape, when the app goes to the background and
// when the page closes.
const CAM_FORMATS=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code'];
const CAM_CHECKED=['ean_13','ean_8','upc_a','upc_e','code_128'];   // have a check digit: one frame is enough. The rest must be read twice in a row.
let CAMOVL=null,CAM=null;
const camOk=()=>!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&'BarcodeDetector' in window);
function camStatus(me,text,cls){if(CAM!==me)return;me.st.textContent=text;me.st.className='sst'+(cls?' '+cls:'');}
function camSum(me){if(CAM!==me)return;if(me.pick){me.sum.textContent='Waiting for the till\u2019s QR code';return;}if(me.qr){me.sum.textContent='Waiting for the scanner phone\u2019s QR code';return;}if(me.relay){const L=me.link;me.sum.textContent='Sent '+me.sent+' \u00B7 till '+me.relay+' \u00B7 '+(L&&L.open?'WiFi link':'internet');return;}me.sum.textContent=CART.length?CART.length+(CART.length===1?' item':' items')+' \u00B7 '+money(cartTotal()):'Cart is empty';}
function camFlash(me,cls){if(CAM!==me)return;me.aim.className='aim '+cls;clearTimeout(me.flashT);me.flashT=setTimeout(()=>{if(CAM===me)me.aim.className='aim';},700);}
function camBeep(me,ok){
  try{navigator.vibrate&&navigator.vibrate(ok?40:[80,60,80]);}catch{}
  const c=me.ac;if(!c)return;
  try{
    if(c.state==='suspended')c.resume();
    const o=c.createOscillator(),g=c.createGain(),t=c.currentTime;
    o.frequency.value=ok?1100:220;g.gain.value=.12;o.connect(g);g.connect(c.destination);
    o.start(t);o.stop(t+(ok?.09:.22));
  }catch{}
}
function camFail(me,text){camStatus(me,text,'bad');camFlash(me,'bad');}
async function startCam(relayTo,qrPair,pickTill){
  if(CAMOVL)return;
  if(!camOk()){say('Camera scanning is not available on this browser. Use a scanner or type the code.','bad',5000);return;}
  const ovl=el('div','sovl','',{role:'dialog','aria-modal':'true','aria-label':'Camera barcode scanner'});
  const video=el('video','','',{playsinline:'',autoplay:'','aria-hidden':'true'});video.muted=true;
  const head=el('div','sh');head.append(el('b','',relayTo?'Send scans to till '+relayTo:qrPair?'Link a phone by QR':pickTill?'Scan the till\u2019s QR code':'Scan barcodes'));
  const aim=el('div','aim');
  const st=el('div','sst','Starting camera\u2026',{role:'status','aria-live':'polite'});
  const sum=el('div','ssum');
  const torch=el('button','','Torch',{type:'button'});torch.hidden=true;
  const done=el('button','pri','Done',{type:'button'});
  const row=el('div','sbtn');row.append(torch,done);
  if(relayTo&&qrOk()){const qb=el('button','','Pair by QR',{type:'button'});row.insertBefore(qb,done);qb.onclick=()=>qrOffer(CAM);}
  const foot=el('div','sf');foot.append(st,sum,row);
  ovl.append(video,head,aim,foot);document.body.append(ovl);
  const me=CAM={video,aim,st,sum,stream:null,det:null,timer:0,flashT:0,ac:null,lastCode:'',seenAt:0,pend:'',pendN:0,multi:false,errs:0,relay:relayTo||null,qr:!!qrPair,pick:!!pickTill,sent:0,busy:false};
  CAMOVL=ovl;done.onclick=stopCam;camSum(me);
  if(relayTo){me.linkT=setInterval(()=>linkWatch(me),4000);linkOpen(me);}   // scanner phone: try the WiFi link in the background
  try{const AC=window.AudioContext||window.webkitAudioContext;if(AC)me.ac=new AC();}catch{}   // made inside the tap, so the beep is allowed
  let det,qrRead=false;
  try{
    const sup=await BarcodeDetector.getSupportedFormats();
    const f=CAM_FORMATS.filter(x=>sup.includes(x));
    if(!f.length)throw new Error('no formats');
    qrRead=f.includes('qr_code');
    det=new BarcodeDetector({formats:f});
  }catch{if(CAM===me)camFail(me,'Camera scanning is not supported on this device. Use a scanner or type the code.');return;}
  if(CAM!==me)return;
  if((me.pick||me.qr)&&!qrRead){camFail(me,me.pick?'This phone cannot read QR codes. Type the till code instead.':'This browser cannot read QR codes, so it cannot pair by QR. Tap Done, then use Show till QR for a phone.');return;}
  let stream;
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});
  }catch(e){
    const n=e&&e.name;
    camFail(me,n==='NotAllowedError'||n==='SecurityError'?'The camera is blocked. Allow the camera for this app in the phone\u2019s site settings, then try again.'
      :n==='NotFoundError'||n==='OverconstrainedError'?'No camera found on this device.'
      :n==='NotReadableError'?'The camera is being used by another app. Close it and try again.':'Could not start the camera.');
    return;
  }
  if(CAM!==me){stream.getTracks().forEach(t=>{try{t.stop();}catch{}});return;}   // Done was tapped while the camera was starting
  me.stream=stream;me.det=det;
  const track=stream.getVideoTracks()[0],caps=(track&&track.getCapabilities&&track.getCapabilities())||{};
  if(caps.focusMode&&caps.focusMode.includes('continuous'))track.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{});
  if(caps.torch){
    let on=false;torch.hidden=false;
    torch.onclick=async()=>{try{await track.applyConstraints({advanced:[{torch:!on}]});on=!on;torch.classList.toggle('on',on);}catch{}};
  }
  video.srcObject=stream;
  try{await video.play();}catch{}
  camStatus(me,me.qr?'Point the camera at the QR code on the scanner phone.':me.pick?'Point the camera at the QR code on the till.':'Aim at one barcode. Keep scanning, tap Done when finished.','');
  camTick(me);
}
async function camTick(me){
  if(CAM!==me)return;
  let found=[];
  try{
    if(me.video.readyState>=2&&me.video.videoWidth)found=await me.det.detect(me.video);
    me.errs=0;
  }catch{
    if(++me.errs>=25){camFail(me,'The scanner stopped working. Tap Done and try again.');return;}
  }
  if(CAM!==me)return;
  camRead(me,found);
  me.timer=setTimeout(()=>camTick(me),120);
}
function camRead(me,found){
  const v=me.video,W=v.videoWidth,H=v.videoHeight,now=Date.now();
  const seen=new Map();                                  // code -> format, only barcodes near the middle of the picture
  found.forEach(r=>{
    const val=String(r.rawValue||'').trim();if(!val)return;
    const b=r.boundingBox;
    if(b&&W&&H){const cx=b.x+b.width/2,cy=b.y+b.height/2;if(cx<W*.1||cx>W*.9||cy<H*.25||cy>H*.75)return;}
    seen.set(val,r.format);
  });
  if(!seen.size){
    me.pend='';me.pendN=0;
    if(me.multi){me.multi=false;camStatus(me,'Aim at one barcode.','');}
    if(me.lastCode&&now-me.seenAt>700)me.lastCode='';     // the code left the picture: it can be added again
    return;
  }
  if(seen.size>1){me.multi=true;me.pend='';me.pendN=0;camStatus(me,'Several barcodes in view. Aim at one.','warn');return;}
  me.multi=false;
  const [val,fmt]=[...seen][0];
  if(val===me.lastCode){me.seenAt=now;return;}           // still holding the same item up: added once
  if(!CAM_CHECKED.includes(fmt)){
    if(me.pend!==val){me.pend=val;me.pendN=1;return;}
    if(++me.pendN<2)return;
  }
  me.pend='';me.pendN=0;me.lastCode=val;me.seenAt=now;
  camAccept(me,val);
}
function camAccept(me,val){
  if(me.pick){const c=qrTillCode(val);if(!c){camBeep(me,false);camStatus(me,'That is not a till code from this app. On the till tap \uD83D\uDCF2, then Show till QR for a phone.','warn');return;}camBeep(me,true);try{localStorage.setItem(scnTarget(),c);}catch{}stopCam();openScn();return;}
  if(me.relay){if(val.indexOf(QR_TAG)===0){qrAnswered(me,val);return;}if(me.busy){me.lastCode='';return;}idleReset();relaySend(me,val);return;}
  if(me.qr){qrOffered(me,val);return;}   // scanner phone: send it to the till instead of adding it here
  if(RCV){                                               // v0.3.101: Receive stock is open: the camera adds to the delivery, never to a sale
    idleReset();const g=rcvAddCode(val,true);
    if(g.err){camBeep(me,false);camStatus(me,g.err,'bad');camFlash(me,'bad');return;}
    camBeep(me,true);camStatus(me,'\u2713 '+g.label,'ok');camFlash(me,'ok');rcvMsg('\u2713 '+g.label);rcvPaint();return;
  }
  idleReset();                                           // scanning counts as activity: no idle logout in the middle of a basket
  const r=resolveCode(val,{camera:true});
  if(r.err){camBeep(me,false);camStatus(me,r.err,'bad');camFlash(me,'bad');return;}
  const it=r.hit,ru=r.unit&&!r.unit.isBase?r.unit:null;addItem(it,1,ru);camBeep(me,true);
  const l=CART.find(x=>lineKey(x)===it.id+(ru?'|'+ru.name.toUpperCase():'')),over=!!l&&inCartBase(it.id)>it.ok;
  camStatus(me,'\u2713 '+it.name+(ru?' ('+ru.name+')':'')+(l&&l.qty>1?' \u00D7'+fq(l.qty):'')+(over?(it.xp&&it.xp.expired>0?' \u00B7 EXPIRED stock: cannot be sold':(it.ok>0?' \u00B7 only '+fq(it.ok)+' in stock':' \u00B7 none in stock')):''),over?'warn':'ok');
  camFlash(me,over?'warn':'ok');camSum(me);
}
function stopCam(){
  const me=CAM;CAM=null;
  if(me){
    if(me.relay)linkClose(me,true);clearTimeout(me.timer);clearTimeout(me.flashT);
    try{me.video.pause();me.video.srcObject=null;}catch{}
    if(me.stream)me.stream.getTracks().forEach(t=>{try{t.stop();}catch{}});
    if(me.ac){try{me.ac.close();}catch{}}
  }
  if(CAMOVL){CAMOVL.remove();CAMOVL=null;if(!COARSE)focusSearch();}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopCam();});   // release the camera when the app goes to the background
addEventListener('pagehide',stopCam);

// ── PHONE SCANNER (step 36) ──────────────────────────────────────────────────
// A second phone scans with its camera and sends every barcode through the database (depots/<depot>/scans/<till code>/<id>) to a till.
// The receiving till polls its own node about once a second, ONLY while "Start receiving" is on. It takes a scan by deleting it first, so a
// scan is added at most once, then adds it through resolveCode() like the scan box. Scans that arrive while the till is paying, locked or in
// another screen are dropped after 15 s (never added to the next sale). Needs internet on both phones, unless they are linked over WiFi (step 37 below); no new field on any sale record.
const SCN_RE=/^[A-HJ-KM-NP-Z2-9]{4}$/;
let RECV=null,SCNOVL=null,SCNBTN=null;
const scnPath=code=>'depots/'+POS.depotKey()+'/scans/'+code;
const scnId=()=>Date.now().toString(36).padStart(9,'0')+Math.random().toString(36).slice(2,5).padEnd(3,'0');   // sorts by time
const scnTarget=()=>'mdm_scan_to:'+(POS.depotKey()||'local');
const recvBusy=()=>!!(LOCKOVL||PAYOVL||CAMOVL||PINOVL||RTOVL||SHOVL||SETOVL||RPOVL||ROVL||HOVL||DOVL||LOVL||MOVL||HELPOVL||ASKOVL);
function recvPaint(){if(SCNBTN){SCNBTN.classList.toggle('on',!!RECV);SCNBTN.setAttribute('aria-pressed',RECV?'true':'false');}}

// ── WiFi link (step 37) ──────────────────────────────────────────────────────
// While the internet works, the two phones pair through the same scans node (a record with code '@offer' for the till, answered by an
// '@answer' record in the scanner phone's own node), then open a direct WebRTC channel over the shop router. From then on scans, acks and
// pings go phone to phone: no internet, and the answer (item name or error) comes back at once. If the link drops, scans go through the
// internet as before with the SAME id, so the till never adds one twice. No STUN server: both phones must be on the same router, and
// guest WiFi often blocks that. Pairing needs the internet; an open link does not.
const RTC_CFG={iceServers:[]};
const rtcOk=()=>typeof RTCPeerConnection==='function';
const sdpEnc=d=>btoa(JSON.stringify({type:d.type,sdp:d.sdp})),sdpDec=s=>JSON.parse(atob(s));
const scnWait=ms=>new Promise(r=>setTimeout(r,ms));
const scnBy=()=>String(USER&&USER.username||'').slice(0,80);
const rememberId=(me,id)=>{me.done.add(id);if(me.done.size>300)me.done.delete(me.done.values().next().value);};
function iceDone(pc){return new Promise(r=>{if(pc.iceGatheringState==='complete')return r();const f=()=>{if(pc.iceGatheringState==='complete'){pc.removeEventListener('icegatheringstatechange',f);r();}};pc.addEventListener('icegatheringstatechange',f);setTimeout(r,3500);});}

// ── the scanner phone: opens the link, sends over it, falls back to the internet ──
function linkClose(me,final){
  if(final)clearInterval(me.linkT);
  const L=me.link;me.link=null;
  if(L){L.open=false;try{L.pc.close();}catch{}L.acks.forEach(f=>f(null));L.acks.clear();}
}
function linkNew(me){                                                                     // one WebRTC channel to the till (the internet pairing and the QR pairing both use it)
  const pc=new RTCPeerConnection(RTC_CFG),dc=pc.createDataChannel('scan');
  const L=me.link={pc,dc,open:false,acks:new Map(),pong:Date.now()};
  dc.onopen=()=>{L.open=true;L.pong=Date.now();me.linkFails=0;me.qrUntil=0;qrPanelClose();if(CAM===me){camStatus(me,'WiFi link ready. Scans no longer need the internet.','ok');camSum(me);}};
  dc.onclose=()=>{if(L.open){L.open=false;if(CAM===me)camSum(me);}};
  dc.onmessage=e=>{
    let m;try{m=JSON.parse(e.data);}catch{return;}
    if(m.k==='pong')L.pong=Date.now();
    else if(m.k==='ack'){const f=L.acks.get(m.id);if(f){L.acks.delete(m.id);f(m);}}
  };
  return L;
}
async function linkOpen(me){
  const own=NUM.peek()||{};
  if(!rtcOk()||!own.registered||me.linkBusy||CAM!==me||Date.now()<(me.qrUntil||0))return;   // not while a QR pairing is under way
  me.linkBusy=true;me.linkTry=Date.now();
  let L=null;
  try{
    linkClose(me);
    L=linkNew(me);const pc=L.pc;
    await pc.setLocalDescription(await pc.createOffer());await iceDone(pc);
    if(me.link!==L){me.linkBusy=false;return;}                                            // replaced meanwhile (QR pairing started)
    await CLOUD.put(scnPath(me.relay)+'/'+scnId(),{code:'@offer',sdp:sdpEnc(pc.localDescription),at:{'.sv':'timestamp'},by:scnBy(),from:own.code});
    for(let t0=Date.now();CAM===me&&me.link===L&&!L.open&&Date.now()-t0<12000;){          // the answer comes back to this phone's own node
      await scnWait(700);
      if(pc.remoteDescription)continue;
      const d=await CLOUD.get(scnPath(own.code));
      for(const id of Object.keys(d||{}).sort()){
        const s=d[id];if(!s||s.code!=='@answer')continue;
        await CLOUD.put(scnPath(own.code)+'/'+id,null);
        if(typeof s.sdp==='string'&&me.link===L)await pc.setRemoteDescription(sdpDec(s.sdp));
        break;
      }
    }
    if(me.link===L&&!L.open){
      me.linkFails=(me.linkFails||0)+1;
      if(me.linkFails===1&&CAM===me)camStatus(me,'No WiFi link. Are both phones on the same router (not guest WiFi)? Using the internet. Or tap Pair by QR.','warn');
      linkClose(me);
    }
  }catch(e){if(me.link===L)linkClose(me);}
  me.linkBusy=false;
}
function linkWatch(me){                                                                   // every 4 s while the camera is open
  if(CAM!==me)return;
  const L=me.link;
  if(L&&L.open){
    if(Date.now()-L.pong>10000){linkClose(me);camSum(me);}                                // no answer to the pings: treat it as dead
    else{try{L.dc.send('{"k":"ping"}');}catch{}}
  }
  if(!(me.link&&me.link.open)&&!me.linkBusy&&navigator.onLine&&Date.now()-(me.linkTry||0)>Math.min(120000,15000*(1+(me.linkFails||0))))linkOpen(me);
}
async function relaySend(me,val){
  const r=resolveCode(val,{camera:true});                  // same check as the till; a code this phone already knows is no good is not sent
  if(r.err){camBeep(me,false);camStatus(me,r.err,'bad');camFlash(me,'bad');return;}
  const id=scnId(),L=me.link;
  me.busy=true;
  if(L&&L.open){                                           // 1. the WiFi link: the till answers at once
    const a=await new Promise(res=>{
      const t=setTimeout(()=>{L.acks.delete(id);res(null);},1500);
      L.acks.set(id,m=>{clearTimeout(t);res(m);});
      try{L.dc.send(JSON.stringify({k:'scan',id,code:val}));}catch{clearTimeout(t);L.acks.delete(id);res(null);}
    });
    if(a){
      me.busy=false;if(CAM!==me)return;
      if(a.ok){me.sent++;camBeep(me,true);camStatus(me,'\u2713 '+(a.name||r.hit.name),'ok');camFlash(me,'ok');}
      else{camBeep(me,false);camStatus(me,a.err||'The till did not take it.','bad');camFlash(me,'bad');}
      camSum(me);return;
    }
  }                                                        // no answer in 1.5 s: the internet, with the same id (the till ignores a repeat)
  const path=scnPath(me.relay)+'/'+id,from=(NUM.peek()||{}).code||'';
  try{
    const rec={code:val,at:{'.sv':'timestamp'},by:scnBy()};
    if(from)rec.from=from;
    await CLOUD.put(path,rec);
  }catch(e){
    me.busy=false;camBeep(me,false);
    const c=e&&e.code;
    camFail(me,c==='NETWORK'||c==='NO_AUTH'?'No connection and no WiFi link. That scan was not sent. Tap Pair by QR to link the phones.':c==='HTTP_401'?'The database does not allow phone scans yet: the rules have not been updated.':'Could not send ('+(c||'error')+').');
    return;
  }
  me.busy=false;if(CAM!==me)return;
  me.sent++;camBeep(me,true);camStatus(me,'\u2713 Sent: '+r.hit.name,'ok');camFlash(me,'ok');camSum(me);
  setTimeout(async()=>{                                    // still there after 4 s: the till did not take it. Remove it so it cannot land later.
    try{
      if(await CLOUD.get(path)==null)return;
      await CLOUD.put(path,null);
      if(CAM===me){me.sent=Math.max(0,me.sent-1);camBeep(me,false);camStatus(me,'Till '+me.relay+' did not take it. On that till tap \uD83D\uDCF2 and Start receiving, and close other screens.','warn');camFlash(me,'warn');camSum(me);}
    }catch{}
  },4000);
}

// ── the receiving till ──
function rtcStop(me){const R=me.rtc;me.rtc=null;if(R){R.open=false;try{R.pc.close();}catch{}}}
function rtcNew(me){                                                                      // the till's end of a link (the internet pairing and the QR pairing both use it)
  rtcStop(me);
  const pc=new RTCPeerConnection(RTC_CFG),R=me.rtc={pc,open:false,pong:Date.now()};
  const down=()=>{if(R.open){R.open=false;if(RECV===me&&me.rtc===R)say('Phone link lost. Scans go through the internet.','warn',6000);}};
  pc.onconnectionstatechange=()=>{if(/failed|closed|disconnected/.test(pc.connectionState))down();};
  pc.ondatachannel=ev=>{
    const dc=ev.channel;
    dc.onopen=()=>{R.open=true;R.pong=Date.now();qrPanelClose();if(RECV===me)say('Phone linked over WiFi. Scans no longer need the internet.','ok',5000);};
    dc.onclose=down;dc.onmessage=e=>rtcMsg(me,R,dc,e);
  };
  return R;
}
async function rtcAccept(me,rec){
  if(!rtcOk()||typeof rec.sdp!=='string'||!SCN_RE.test(String(rec.from||'')))return;
  let R=null;
  try{
    R=rtcNew(me);const pc=R.pc;
    await pc.setRemoteDescription(sdpDec(rec.sdp));
    await pc.setLocalDescription(await pc.createAnswer());await iceDone(pc);
    if(me.rtc!==R)return;
    await CLOUD.put(scnPath(rec.from)+'/'+scnId(),{code:'@answer',sdp:sdpEnc(pc.localDescription),at:{'.sv':'timestamp'},by:scnBy(),from:me.code});
  }catch(e){if(R&&me.rtc===R)rtcStop(me);}
}
function rtcMsg(me,R,dc,e){
  let m;try{m=JSON.parse(e.data);}catch{return;}
  R.pong=Date.now();
  if(m.k==='ping'){try{dc.send('{"k":"pong"}');}catch{}return;}
  if(m.k!=='scan'||typeof m.code!=='string'||typeof m.id!=='string'||RECV!==me)return;
  let a;
  if(me.done.has(m.id))a={ok:true};                                                       // a repeat of one already added: say yes, add nothing
  else if(recvBusy())a={ok:false,err:'The till is busy. Close the screen that is open.'};  // not remembered: the scanner may scan it again
  else{rememberId(me,m.id);a=recvAdd(me,m.code);}
  try{dc.send(JSON.stringify({k:'ack',id:m.id,ok:a.ok,name:a.name,err:a.err}));}catch{}
}
async function startRecv(){
  if(RECV)return;
  const t=NUM.peek();
  if(!(t&&t.registered)||!POS.depotKey()){say('Set this till up online first (it needs its till code).','bad',5000);return;}
  const me=RECV={code:t.code,timer:0,errs:0,seen:new Map(),done:new Set(),rtc:null,wl:null,ac:null};
  try{const AC=window.AudioContext||window.webkitAudioContext;if(AC)me.ac=new AC();}catch{}   // made inside the tap, so the beep is allowed
  recvPaint();
  try{await CLOUD.put(scnPath(me.code),null);}                                                  // old scans must never land in a new sale
  catch(e){
    const c=e&&e.code;
    if(c==='NETWORK'||c==='NO_AUTH'){me.fresh=true;say('No internet. A phone can still be linked by QR (tap \uD83D\uDCF2, then Pair a phone by QR).','warn',6000);}   // offline: start anyway; the first poll that works clears what is old
    else{if(RECV===me){stopRecv();say(c==='HTTP_401'?'The database does not allow phone scans yet: the rules have not been updated.':'Could not start the phone scanner ('+(c||'error')+').','bad',7000);}return;}
  }
  if(RECV!==me)return;
  try{if(navigator.wakeLock)me.wl=await navigator.wakeLock.request('screen');}catch{}           // keep the screen on while receiving, or the link drops when the till sleeps
  if(RECV!==me){if(me.wl)try{me.wl.release();}catch{}return;}
  if(!me.fresh)say('Phone scanner on. Scans from your other phone are added here.','ok',4000);
  recvTick(me);
}
function stopRecv(){
  const me=RECV;RECV=null;
  if(me){clearTimeout(me.timer);rtcStop(me);if(me.wl){try{me.wl.release();}catch{}}if(me.ac){try{me.ac.close();}catch{}}}
  recvPaint();
}
async function recvTick(me){
  if(RECV!==me||me.run)return;
  if(!USER){stopRecv();return;}
  me.run=true;
  const linked=!!(me.rtc&&me.rtc.open);
  let delay=linked?2000:900;                                                              // an open link carries the scans: the internet is only the back-up
  if(linked&&Date.now()-me.rtc.pong>15000){me.rtc.open=false;say('Phone link lost. Scans go through the internet.','warn',6000);delay=900;}
  try{
    if(!document.hidden&&navigator.onLine){
      let d=await CLOUD.get(scnPath(me.code));
      if(RECV!==me)return;
      if(me.fresh){me.fresh=false;for(const id of Object.keys(d&&typeof d==='object'?d:{}))await CLOUD.put(scnPath(me.code)+'/'+id,null);d=null;}   // started offline: whatever is there now is old
      const now=performance.now(),ids=d&&typeof d==='object'?Object.keys(d).sort():[];
      let dropped=0;
      me.seen.forEach((v,k)=>{if(!ids.includes(k))me.seen.delete(k);});
      for(const id of ids){
        if(RECV!==me)return;
        const s=d[id],c=s&&typeof s.code==='string'?s.code:'';
        if(!me.seen.has(id))me.seen.set(id,now);
        const old=now-me.seen.get(id)>15000;
        if(c==='@offer'||c==='@answer'){                    // pairing messages are not barcodes; an offer is answered even while the till is busy
          await CLOUD.put(scnPath(me.code)+'/'+id,null);me.seen.delete(id);
          if(c==='@offer'&&!old)rtcAccept(me,s);
          continue;
        }
        if(me.done.has(id)){await CLOUD.put(scnPath(me.code)+'/'+id,null);me.seen.delete(id);continue;}   // already added over the WiFi link
        if(!old&&recvBusy())continue;                       // paying, locked...: wait a little, not for long
        await CLOUD.put(scnPath(me.code)+'/'+id,null);      // take it first: a scan is added at most once
        me.seen.delete(id);
        if(old){dropped++;continue;}
        rememberId(me,id);
        if(c)recvAdd(me,c);
      }
      if(dropped)say(dropped+(dropped===1?' scan':' scans')+' from the phone not added: the till was busy. Scan again.','warn',7000);
      me.errs=0;
    }
  }catch(e){
    const c=e&&e.code;
    if(c==='HTTP_401'||c==='HTTP_403'){stopRecv();say('Phone scanner stopped: the database does not allow it.','bad',7000);return;}
    me.errs++;
    if(!linked&&me.errs===3)say('Phone scanner: no connection, still trying\u2026','warn',5000);
    delay=linked?2000:Math.min(10000,1500*me.errs);
  }
  me.run=false;
  if(RECV===me)me.timer=setTimeout(()=>recvTick(me),delay);
}
function recvAdd(me,val){                                                                 // returns what the scanner phone is told
  idleReset();
  if(RCV){                                                                                // v0.3.101: Receive stock is open: the phone's scan joins the delivery
    const g=rcvAddCode(String(val).trim(),true);
    if(g.err){camBeep(me,false);rcvMsg('Phone: '+g.err,true);return{ok:false,err:g.err};}
    camBeep(me,true);rcvMsg('\u2713 Phone: '+g.label);rcvPaint();return{ok:true,name:g.label};
  }
  const r=resolveCode(String(val).trim(),{camera:true});
  if(r.err){camBeep(me,false);say('Phone: '+r.err,'bad',r.ms||5000);return{ok:false,err:r.err};}
  const ru=r.unit&&!r.unit.isBase?r.unit:null,name=r.hit.name+(ru?' ('+ru.name+')':'');
  addItem(r.hit,1,ru);camBeep(me,true);
  say('\u2713 Phone: '+name,'ok',2500);
  return{ok:true,name};
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden||!RECV)return;
  if(!RECV.run){clearTimeout(RECV.timer);recvTick(RECV);}
  const me=RECV;                                                                          // the phone releases the screen lock when the page is hidden: take it again
  if(navigator.wakeLock&&(!me.wl||me.wl.released))navigator.wakeLock.request('screen').then(w=>{if(RECV===me)me.wl=w;else w.release();}).catch(()=>{});
});
addEventListener('pagehide',()=>stopRecv());

// ── QR pairing (step 38): no internet at all ─────────────────────────────────
// For the first link, or a re-link when the internet is down. The scanner phone shows a QR with its connection details, the till scans it
// and shows a QR with its own, the scanner phone scans that. Nothing goes through the database. The QR carries only what WebRTC needs
// (ICE user/password, the security fingerprint, up to 3 local addresses: about 200 characters); the other phone rebuilds the rest.
const QR_TAG='MDM1:',PRIV_RE=/^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/;
const qrOk=()=>typeof qrcode==='function'&&rtcOk()&&camOk();
const qrTillCode=t=>{const m=/^MDM1:t\|([A-HJ-KM-NP-Z2-9]{4})$/.exec(typeof t==='string'?t:'');return m?m[1]:null;};   // a till shows only its own 4-character code, which is not a secret; anything else is refused
function qrPack(desc){
  const sdp=desc&&desc.sdp||'',g=re=>(sdp.match(re)||[])[1];
  const u=g(/a=ice-ufrag:(\S+)/),p=g(/a=ice-pwd:(\S+)/),f=g(/a=fingerprint:sha-256 ([0-9A-Fa-f:]+)/),c=[];
  if(!u||!p||!f||(desc.type!=='offer'&&desc.type!=='answer'))return null;

    'a=ice-ufrag:'+t[1],'a=ice-pwd:'+t[2],'a=fingerprint:sha-256 '+t[3].match(/../g).join(':'),'a=setup:'+(t[0]==='o'?'actpass':'active'),'a=mid:0','a=sctp-port:5000']

function qrCanvas(text){                                                                  // black on white whatever the theme: cameras need the contrast

async function qrOffer(me){                                                               // scanner phone: show my QR
  if(!me||CAM!==me)return;
  try{
    me.qrUntil=Date.now()+90000;linkClose(me);                                            // pause the internet pairing meanwhile

// ── FIT THE SCREEN (v0.3.88) ─────────────────────────────────────────────────────────────────────────────────────────
// Some Android windows (the installed app especially) report a page height taller than the part you can see, so the cart bar sits
// off the bottom of the screen until you pinch-zoom. The page is sized to what is really visible instead, and checked again when the
// window changes. If the cart bar is still pushed off the bottom, the difference is taken off. A page the person has zoomed into is left alone.
let fitRaf=0;
function fitView(){
  if(fitRaf)return;
  fitRaf=requestAnimationFrame(()=>{
    fitRaf=0;
    const vv=window.visualViewport,root=document.documentElement;
    if(vv&&vv.scale>1.02)return;
    const vis=Math.round(vv?vv.height:innerHeight);
    if(!(vis>240))return;
    root.style.setProperty('--app-h',vis+'px');
    if(window.scrollY>0)scrollTo(0,0);
    requestAnimationFrame(()=>{
      const b=CARTBAR&&!CARTBAR.hidden?CARTBAR.getBoundingClientRect():null;
      if(!b||!b.height)return;                           // no cart bar on this screen (tablet layout, or not built yet)
      const over=Math.ceil(b.bottom-(vv?vv.offsetTop+vv.height:innerHeight));
      if(over>1&&over<vis/2)root.style.setProperty('--app-h',(vis-over)+'px');
    });
  });
}
// ── FULL SCREEN (v0.3.150) ────────────────────────────────────────────────────────────────────────────
// The header's icon button takes the till full screen (no browser bars, no taskbar) and back. The browser only allows it from a tap or click, so it cannot start by itself, and Esc or
// the button leaves it. The button stays hidden where the browser has no full screen for a page (an iPhone). The size of the page follows through the resize event: fitView() runs again.
const fsOn=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
const fsCan=()=>{const r=document.documentElement;return !!(document.fullscreenEnabled||document.webkitFullscreenEnabled)&&!!(r.requestFullscreen||r.webkitRequestFullscreen);};
function fsIcon(on){
  const NS='http://www.w3.org/2000/svg',v=document.createElementNS(NS,'svg'),p=document.createElementNS(NS,'path');
  [['viewBox','0 0 24 24'],['fill','none'],['stroke','currentColor'],['stroke-width','2.2'],['stroke-linecap','round'],['stroke-linejoin','round'],['aria-hidden','true']].forEach(([k,x])=>v.setAttribute(k,x));
  p.setAttribute('d',on?'M9 3v6H3M15 3v6h6M9 21v-6H3M15 21v-6h6':'M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6');   // corners pointing in (leave) or out (enter)
  v.append(p);return v;
}
function paintFs(){
  const b=document.getElementById('b-fs');if(!b)return;
  const can=fsCan(),t=fsOn()?'Exit full screen':'Full screen';
  b.hidden=!can;b.setAttribute('aria-label',t);b.title=t;b.replaceChildren(fsIcon(fsOn()));
  fitView();
}
function toggleFs(){
  try{
    const d=document,r=d.documentElement,end=x=>{if(x&&x.catch)x.catch(()=>{});};
    if(fsOn())end((d.exitFullscreen||d.webkitExitFullscreen).call(d));
    else end((r.requestFullscreen||r.webkitRequestFullscreen).call(r,{navigationUI:'hide'}));
  }catch{}
}
['fullscreenchange','webkitfullscreenchange'].forEach(e=>document.addEventListener(e,paintFs));

['resize','orientationchange','pageshow','focus'].forEach(e=>addEventListener(e,fitView));
if(window.visualViewport)visualViewport.addEventListener('resize',fitView);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)fitView();});
[0,300,1000,2500].forEach(t=>setTimeout(fitView,t));

  $('hdr').hidden=false;netPill();cloudPill();
  initTillSettings();                                  // Settings button, Lock button, lock-screen keys
  addEventListener('online',()=>{netPill();cloudPill();setupTill();probeClock(true);syncAll();paintSales();});addEventListener('offline',()=>{netPill();paintSales();});
  setInterval(syncAll,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncAll();});
  ['pointerdown','keydown','touchstart','scroll'].forEach(e=>document.addEventListener(e,idleReset,{passive:true,capture:true}));
  idleReset();
  try{new BroadcastChannel('mdm_session').onmessage=e=>{if(e.data&&e.data.type==='logout'){parkOnExit();try{sessionStorage.removeItem(SESSION_KEY);}catch{}toApp();}};}catch{}
  addEventListener('storage',e=>{if(e.key==='mdm_session_event'&&e.newValue&&e.newValue.startsWith('logout:')){parkOnExit();try{sessionStorage.removeItem(SESSION_KEY);}catch{}toApp();}});
  $('b-app').onclick=()=>exitGuard(toApp);$('b-out').onclick=()=>exitGuard(logout);$('b-recv').onclick=openReceive;if(canReceive())$('b-recv').hidden=false;   // the two exits the cashier chooses; idle logout calls logout() directly
  $('b-mine').hidden=false;$('b-mine').onclick=openMine;   // My sales: every role sees its own sales today (mineToday filters on USER.username)
  if(isCashier())$('b-app').hidden=true;   // no main app behind a cashier login
  await loadSold();                                    // stock = received - issued - sold: the ledger must be read BEFORE the catalog is built
  await loadShift();
  try{SHBC=new BroadcastChannel('mdm_shift');SHBC.onmessage=async()=>{await loadShift();paintShift();if(SHOVL&&!SHBUSY)renderShift();if(PAYOVL&&PAYFOOT&&PAY)renderPayFoot(settle(toC(cartTotal()),PAY.tenders));};}catch{}
  $('b-shift').onclick=openShiftSheet;
  $('b-print').onclick=openPrinter;
  $('b-ret').onclick=openReturns;
  loadCatalog();
  paintTill();setupTill();paintSales();syncAll();                              // claim this till's code (needs the network once)
  TAB=await claimTab();
  const rc=await recoverDrafts(true);                   // BEFORE buildSell: its first renderCart would delete our draft
  buildSell();
  paintShift();
  if(rc.restored||rc.adopted){const n=draftNotice(rc);say(n.join('. ')+'.',rc.notes.length?'warn':'ok',7000);if(rc.restored)openCart();}
  maybePromptShift();                                   // no shift yet (or someone else's): open straight onto the shift sheet
  checkLockOnOpen();                                    // till settings: closed while locked, or not used for the idle time: open locked
}
// Header rows that can be swiped sideways (action buttons, status pills): fade the edge that has more to see.
(function(){
  function wire(el){
    if(!el)return;
    const upd=()=>{
      const max=el.scrollWidth-el.clientWidth,x=Math.abs(el.scrollLeft);
      el.dataset.fade=(max>2&&x>2?'l':'')+(max>2&&x<max-2?'r':'');
    };
    el.addEventListener('scroll',upd,{passive:true});
    if(window.ResizeObserver){const ro=new ResizeObserver(upd);ro.observe(el);Array.from(el.children).forEach(c=>ro.observe(c));}   // a button hidden/shown or relabelled (Shift / Open shift / Close shift) changes its size
    addEventListener('resize',upd);addEventListener('orientationchange',upd);
    upd();
  }
  wire(document.querySelector('header .hb'));wire(document.querySelector('header .pills'));
})();
boot();
</script>
