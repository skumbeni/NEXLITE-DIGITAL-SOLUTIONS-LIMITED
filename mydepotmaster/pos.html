<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>

<title>Till — Shop Inventory &amp; Sales Manager</title>
<link rel="manifest" href="manifest.json">

     CSP mirrors index.html minus what the till does not use. -->

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#1A1A2E;--surface:#16213E;--border:#2C3E50;--text:#fff;--muted:#9aa5b8;--green:#00e096;--red:#ff6b6b;--amber:#ffb84d}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--border)}
header b{font-size:18px}header small{display:block;color:var(--muted);font-size:13px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--border);color:var(--muted)}
.pill.ok{color:var(--green);border-color:var(--green)}.pill.bad{color:var(--red);border-color:var(--red)}
main{max-width:560px;margin:0 auto;padding:28px 16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;text-align:center}
.card .ic{font-size:40px;margin-bottom:8px}.card h1{font-size:20px;margin-bottom:6px}.card p{color:var(--muted);margin-bottom:16px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button{font:inherit;font-weight:600;padding:11px 18px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer}
button.pri{background:var(--green);border-color:var(--green);color:#0a1628}

/* ── layout shell: header on top, the rest of the screen belongs to <main> ── */
[hidden]{display:none!important}
body{display:flex;flex-direction:column;height:100vh;height:100dvh}
main{width:100%}
header{flex:none}
header .hr{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:flex-end}
header .hb{display:flex;gap:6px}
button.sm{padding:5px 11px;font-size:13px;font-weight:600;border-radius:8px}
button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.pill{font-size:12px}

/* ── SELL SCREEN ─────────────────────────────────────────────────────────────
   Phone  (<768px): items fill the screen; the cart is a bottom sheet opened from a bar at the bottom.
   Tablet (>=768px): two panes, items on the left, cart on the right, always visible. */
main.on-sell{max-width:none;margin:0;padding:0;flex:1;min-height:0}
.sell{position:relative;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%;overflow:hidden}
.items{display:flex;flex-direction:column;min-height:0;min-width:0}

.searchbar{display:flex;gap:8px;padding:10px 12px 6px}
.searchbar input{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:2px solid var(--border);background:var(--surface);color:var(--text)}
.searchbar input:focus{outline:none;border-color:var(--green)}
.searchbar input::placeholder{color:var(--muted)}
#kb{display:none;min-width:48px;padding:0 12px;font-size:20px;line-height:1}
.msg{min-height:22px;padding:0 14px 4px;font-size:13px;color:var(--muted)}
.msg.ok{color:var(--green)}.msg.bad{color:var(--red)}

.grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:8px;align-content:start;padding:4px 12px 84px;overscroll-behavior:contain}
.grid .note{grid-column:1/-1;text-align:center;color:var(--muted);padding:28px 8px;font-size:14px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-height:96px;padding:10px 11px;text-align:left;font-weight:400;border-radius:12px;background:var(--surface);border:1px solid var(--border)}
.tile:active:not(:disabled){background:#1c2a4d}
.tile:disabled{opacity:.5;cursor:not-allowed}
.tile .nm{font-weight:600;font-size:15px;line-height:1.25;overflow-wrap:anywhere;padding-right:20px}
.tile .pr{color:var(--green);font-weight:700;font-size:15px}
.tile .pr small{color:var(--muted);font-weight:400;font-size:12px;margin-left:4px}
.tile .st{font-size:12px;color:var(--muted)}
.tile .st.low{color:var(--amber)}.tile .st.out{color:var(--red)}
.tile .inc{position:absolute;top:7px;right:7px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--green);color:#0a1628;font-size:12px;font-weight:700;line-height:22px;text-align:center}

.cartbar{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:14px 16px;border:0;border-top:1px solid var(--border);border-radius:0;background:var(--surface);font-size:16px;text-align:left}
.cartbar .cb-main{display:flex;flex-direction:column;line-height:1.25}
.cartbar .cb-main small{color:var(--muted);font-weight:400;font-size:13px}
.cartbar .cb-tot{font-weight:700;color:var(--green)}
.cartbar.has .cb-go{color:var(--green)}
.cartbar .cb-go{font-size:14px}

.scrim{position:absolute;inset:0;z-index:25;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s}
.sell.open .scrim{opacity:1;pointer-events:auto}

.cart{position:absolute;left:0;right:0;bottom:0;z-index:30;display:flex;flex-direction:column;height:84%;background:var(--surface);border-top:1px solid var(--border);border-radius:18px 18px 0 0;transform:translateY(100%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s}
.sell.open .cart{transform:none;visibility:visible;transition:transform .22s ease}
.grab{flex:none;display:block;width:100%;padding:8px 0 2px;border:0;background:transparent}
.grab i{display:block;width:44px;height:5px;margin:0 auto;border-radius:3px;background:var(--border)}
.cart-h{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 14px 10px;border-bottom:1px solid var(--border)}
.cart-h h2{font-size:17px}
.cart-h .acts{display:flex;gap:6px}
.lines{flex:1;min-height:0;overflow-y:auto;padding:4px 14px;overscroll-behavior:contain}
.lines .empty{text-align:center;color:var(--muted);padding:36px 12px;font-size:14px}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 0;border-bottom:1px solid var(--border)}
.line .ln{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.line .lt{font-weight:700;text-align:right}
.line .lp{color:var(--muted);font-size:13px;align-self:center}
.line .lw{grid-column:1/-1;font-size:12px;color:var(--amber)}
.qty{display:flex;align-items:center;gap:4px;justify-self:end}
.qty button{width:40px;height:40px;padding:0;font-size:20px;line-height:1;border-radius:10px}
.qty input{width:58px;height:40px;text-align:center;font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);padding:0 2px}
.cart-f{flex:none;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border)}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;color:var(--muted);margin-bottom:10px}
.tot b{font-size:24px;color:var(--text)}
.cart-f .pri{width:100%;padding:14px 18px;font-size:17px}
.cart-f .pri:disabled{opacity:.45;cursor:not-allowed}
.cart-f .hint{margin-top:8px;text-align:center;font-size:12px;color:var(--muted)}

@media (min-width:768px){
  .sell{grid-template-columns:minmax(0,1fr) 380px}
  .grid{padding-bottom:12px}
  .cartbar,.scrim,.grab,.cart-h .x{display:none}
  .cart{position:static;z-index:auto;height:auto;transform:none;visibility:visible;border-radius:0;border-top:0;border-left:1px solid var(--border);transition:none}
  .cart-h{padding-top:12px}
}
@media (max-width:767px){
  header{flex-wrap:wrap;gap:6px 8px;padding:8px 12px}
  header b{font-size:17px}header small{display:none}
  header .hr{display:contents}
  header>div:first-child{flex:1;min-width:0}
  header .hb{order:2}
  header .pills{order:3;width:100%;flex-wrap:nowrap;overflow:hidden;gap:5px}
  .pill{font-size:11px;padding:2px 8px;white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){.cart,.scrim{transition:none!important}}

/* line remove button, secondary button in the cart footer */
.line .lt{display:flex;align-items:center;justify-content:flex-end;gap:4px}
.line .rm{width:34px;height:34px;padding:0;border-radius:8px;border-color:transparent;color:var(--muted);font-size:15px;line-height:1}
.cart-f .sec{width:100%;margin-bottom:8px;padding:10px 16px;font-size:15px}
.cart-f .sec:disabled{opacity:.45;cursor:not-allowed}

/* ── RECEIPT PREVIEW: one paper receipt for the whole basket ── */
.rovl{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;background:rgba(0,0,0,.72);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.rscroll{flex:1;min-height:0;width:100%;overflow-y:auto;padding:16px 12px}
.rbar{flex:none;display:flex;gap:10px;justify-content:center;width:100%;padding:10px 14px;background:var(--surface);border-top:1px solid var(--border)}
.rbar button{flex:1;max-width:200px}
.paper{--acc:#1E8449;max-width:320px;margin:0 auto;padding:20px 18px;background:#fff;color:#111;font:14px/1.4 Arial,Helvetica,sans-serif;border-radius:6px}
.paper .c{text-align:center}.paper .mu{color:#777;font-size:12px}.paper .b{font-weight:700}
.paper .logo{display:block;margin:0 auto 6px;height:56px;max-width:140px;object-fit:contain}
.paper .ini{display:flex;align-items:center;justify-content:center;width:56px;height:56px;margin:0 auto 6px;border-radius:10px;background:var(--acc);color:#fff;font-size:17px;font-weight:900}
.paper .dep{font-size:18px;font-weight:800;margin-bottom:2px}
.paper .rule{border:0;border-top:2.5px solid var(--acc);margin:10px 0}
.paper .dash{border:0;border-top:1px dashed #bbb;margin:10px 0}
.paper .tag{display:inline-block;margin:6px 0 2px;padding:2px 10px;border:1.5px solid #c0392b;border-radius:6px;color:#c0392b;font-weight:700;font-size:12px}
.paper table{width:100%;border-collapse:collapse}
.paper td{padding:3px 0;vertical-align:top}
.paper td.r{text-align:right;white-space:nowrap}
.paper .ln td{padding-top:7px}
.paper .gt td{font-size:18px;font-weight:800;padding-top:4px}
.paper .gt td.r{color:var(--acc)}
.paper .ft{margin-top:12px;text-align:center;font-size:11px;color:#999}
@media print{
  body>*:not(.rovl){display:none!important}
  body{display:block;height:auto;background:#fff;padding:0}
  .rovl{position:static;display:block;background:none;padding:0}
  .rscroll{overflow:visible;padding:0}
  .rbar{display:none!important}
  .paper{border-radius:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ── PAYMENT SCREEN (roadmap step 6) ── */
.povl{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.72);padding:env(safe-area-inset-top,0) 0 0}
.pay{width:100%;max-width:520px;max-height:100%;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:18px 18px 0 0}
@media (min-width:768px){.povl{align-items:center;padding:16px}.pay{border-radius:18px;max-height:94%}}
.pay-h{flex:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px 8px}
.pay-h h2{font-size:17px}
.pay-body{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 12px;overscroll-behavior:contain}
.pay-due{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;color:var(--muted)}
.pay-due b{font-size:26px;color:var(--text)}
.tl .t{display:grid;grid-template-columns:1fr auto auto;gap:2px 8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.tl .t small{grid-column:1/-1;color:var(--muted);font-size:12px}
.tl .rm{width:34px;height:34px;padding:0;border-radius:8px;border-color:transparent;color:var(--muted);font-size:15px;line-height:1}
.pay-sum{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:15px;padding:10px 0;margin:6px 0 10px;border-bottom:1px solid var(--border)}
.pay-sum .r{text-align:right;font-weight:700}
.pay-sum .amb{color:var(--amber)}.pay-sum .ok,.pay-sum .chg{color:var(--green)}
.pay-sum .chg{font-size:20px}
.methods{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 10px}
.methods button{padding:10px 2px;font-size:13px;border-radius:10px}
.methods button.on{background:var(--green);border-color:var(--green);color:#0a1628}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.fld input,.fld select{width:100%;font:inherit;font-size:17px;padding:11px 12px;border-radius:10px;border:2px solid var(--border);background:var(--bg);color:var(--text)}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--green)}
.pay-hint{min-height:18px;margin:-4px 0 8px;font-size:13px;color:var(--muted)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.quick button{padding:8px 14px;font-size:14px;border-radius:8px}
.pay-err{min-height:18px;margin-bottom:4px;font-size:13px;color:var(--red)}
.pay .add{width:100%;padding:12px 16px;margin-bottom:12px}
.pay .acct{width:100%;margin-bottom:10px;padding:10px 14px;font-size:14px}
.pay .acct.on{border-color:var(--amber);color:var(--amber)}
.pay-f{flex:none;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border)}
.pay-f .pri{width:100%;padding:14px 18px;font-size:17px}
.pay-f .pri:disabled{opacity:.45;cursor:not-allowed}
.pay-note{margin-top:8px;text-align:center;font-size:12px;color:var(--amber)}
.pay-note.mu{color:var(--muted)}

/* ── HELD / PARKED SALES (roadmap step 7) ── */
.msg.warn{color:var(--amber)}
.statrow{display:flex;align-items:flex-start;gap:8px}
.statrow .msg{flex:1;min-width:0}
#hb{flex:none;margin:0 12px 6px 0;padding:7px 12px;white-space:nowrap;border-color:var(--amber);color:var(--amber)}
.cart-f .sec-row{display:flex;gap:8px;margin-bottom:8px}
.cart-f .sec-row .sec{flex:1;width:auto;margin:0;padding:10px 8px}
.pay-body.held-body{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.held{padding:12px 0;border-bottom:1px solid var(--border)}
.held:last-child{border-bottom:0}
.h-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.h-top .ag{margin-left:6px;font-size:13px;color:var(--muted)}
.h-top .ag.old{color:var(--amber)}
.h-sub{margin:3px 0 10px;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.h-acts{display:flex;gap:8px}
.h-acts .pri{flex:1;padding:10px 16px}
.h-acts button:not(.pri){padding:10px 16px}
.h-empty{text-align:center;color:var(--muted);padding:28px 8px;font-size:14px}
</style>
</head>

  <div><b>🧾 Till</b><small id="depot"></small></div>
  <div class="hr">

  </div>
</header>
<main id="main"></main>

<!-- Shared gating rules (same file index.html loads). Plain synchronous script, before the inline script below. -->
<script src="gate.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js" defer></script>

<script>
// ── SHARED WITH index.html — Firebase config + data key (keep in sync). Gating rules now come from gate.js. ──
const FB_CONFIG={apiKey:"AIzaSyD_WnWTMBgd__V2M8840LDt1a-7Ebnh6ZU",authDomain:"realtime-database-be871.firebaseapp.com",databaseURL:"https://realtime-database-be871-default-rtdb.firebaseio.com",projectId:"realtime-database-be871",storageBucket:"realtime-database-be871.firebasestorage.app",messagingSenderId:"1051301635587",appId:"1:1051301635587:web:00c5bc5825dd41fd329036"};
const APP_CHECK_KEY='6LcLhystAAAAAHCIiZK1fQf1AbgAYJdDLwUNX9XT';
const DATA_LK='mdm_depot_v2';
const LIC_KEY=Gate.KEYS.license, STAY_KEY=Gate.KEYS.stay, SESSION_KEY=Gate.KEYS.posSession, SESSION_MS=Gate.POS_SESSION_MS;
const TRIAL_MS=Gate.TRIAL_MS;

const $=id=>document.getElementById(id);
let DATA=null, USER=null, LICENSE=null;

// Firebase Auth: same init as index.html, so the persisted session (IndexedDB) is restored here too.
// START-UP ORDER: the three SDK tags above are `defer`red, which runs them AFTER the page has been parsed. An inline
// script ignores `defer` and runs while parsing, i.e. BEFORE the SDK exists, so initialising right here threw
// "firebase is not defined" (swallowed by the catch below) and Firebase was never started: App Check was never
// activated and POS.idToken() always returned null. So the init waits for DOMContentLoaded, which fires after every
// deferred script has run (or failed). The page still paints without waiting for the SDK; if it cannot load at all
// (offline, blocked) the same catch resolves the promise and the till carries on without a cloud session.
window._fbAuthSdkReady=new Promise(function(resolve){
  function init(){
    try{
      firebase.initializeApp(FB_CONFIG);
      try{firebase.appCheck().activate(APP_CHECK_KEY,true);}catch(e){console.warn('App Check activation failed',e);}
      let done=false;const fin=()=>{if(!done){done=true;resolve();}};
      firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
      const un=firebase.auth().onAuthStateChanged(()=>{un();fin();},()=>{un();fin();});
      setTimeout(fin,4000);
    }catch(e){console.warn('Firebase Auth SDK init failed',e);resolve();}
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
});

async function hmac256(key,data){
  try{
    const enc=new TextEncoder();
    const k=await crypto.subtle.importKey('raw',enc.encode(key),{name:'HMAC',hash:'SHA-256'},false,['sign']);
    const sig=await crypto.subtle.sign('HMAC',k,enc.encode(data));
    return Array.from(new Uint8Array(sig)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch{return '';}   // no crypto.subtle: signature can't match, so the till stays locked (fail closed)
}

// ── DATA: newest of localStorage / IndexedDB, as index.html does ───────────
function idbData(){
  return new Promise(res=>{
    try{
      const q=indexedDB.open('mdm_db',1);
      q.onerror=()=>res(null);
      q.onsuccess=()=>{try{
        const g=q.result.transaction('depot_data','readonly').objectStore('depot_data').get('main');
        g.onsuccess=()=>res(g.result||null);g.onerror=()=>res(null);
      }catch{res(null);}};
    }catch{res(null);}
  });
}
async function loadData(){
  let ls=null;try{ls=JSON.parse(localStorage.getItem(DATA_LK)||'null');}catch{}
  const db=await idbData();
  if(ls&&db)return (db._v||0)>(ls._v||0)?db:ls;
  return ls||db;
}

// ── SESSION: handed over by index.html (this tab) or a valid "stay signed in" ─
function sessionUser(){
  let u=null;
  try{const p=JSON.parse(sessionStorage.getItem(SESSION_KEY)||'null');if(p&&p.u&&Date.now()-p.t<SESSION_MS)u=p.u;}catch{}
  if(!u)try{const p=JSON.parse(localStorage.getItem(STAY_KEY)||'null');if(p&&p.enabled&&p.username&&p.expiresAt>Date.now())u=p.username;}catch{}
  if(!u)return null;
  return (DATA.users||[]).find(x=>String(x.username||'').toLowerCase()===String(u).toLowerCase())||null;
}

// ── LICENSE / TIER: signed cache written by index.html, same rules as currentTier() ─
async function loadLicense(){
  try{
    const w=JSON.parse(localStorage.getItem(LIC_KEY)||'null');

// too (see commodityItems). The open cart is autosaved on this device after every change (see LIVE-CART AUTOSAVE
// below) so a reload or a killed browser does not lose it; saving the SALE itself is still a later step.

function el(tag,cls,text,attrs){

function money(n){

  return c?c+' '+v:v;

const fq=n=>(+Number(n).toFixed(3)).toLocaleString();
// Same id rule as index.html's _itemLegacyId(): FNV-1a of the upper-cased name, for items not yet stamped with an id.
function legacyId(name){
  const s=String(name||'').trim().toUpperCase();let h=2166136261;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}
  return 'itm_'+h.toString(36);
}
const isApproved=r=>!r||!r.approvalStatus||r.approvalStatus==='approved';

// Commodities (DATA.commodities) are sold from the till too. They are not in the item master, so: stock = approved
// received minus approved issued, summed over ALL batches of that commodity; price = the selling price set for it in
// the main app's Price List (💲 Prices) — DATA.commodities[i].sellingPrice. No price set = not sellable yet.
// The id is prefixed 'com:' so it can never clash with an item id.
function commodityItems(){
  const cr=DATA.commodityReceived||{},ci=DATA.commodityIssued||{};
  return (DATA.commodities||[]).filter(c=>c&&c.id&&c.name).map(c=>{
    let rec=cr[c.id]||[],iss=ci[c.id]||[];
    if(c.id==='maize'){                         // old maize-only arrays, until the main app has migrated them
      if(!rec.length)rec=DATA.maizeReceived||[];
      if(!iss.length)iss=DATA.maizeIssued||[];
    }
    rec=rec.filter(isApproved);iss=iss.filter(isApproved);
    const avail=rec.reduce((a,r)=>a+Number(r.received||0),0)-iss.reduce((a,r)=>a+Number(r.issued||0),0);
    const unit=String(c.unit||'');
    const o={
      id:'com:'+c.id,kind:'commodity',icon:String(c.icon||''),name:String(c.name),sku:'',barcode:'',
      unit,per:/.s$/i.test(unit)?unit.slice(0,-1):unit,   // "bags" -> price shown "per bag"
      category:'Commodity',min:0,price:Number(c.sellingPrice)||0,avail
    };
    o.hay=(o.name+' commodity '+unit).toLowerCase();
    return o;
  });
}
function loadCatalog(){
  const rec=new Map(),iss=new Map();
  (DATA.generalInventory||[]).filter(isApproved).forEach(r=>rec.set(r.itemName,(rec.get(r.itemName)||0)+Number(r.received||0)));
  (DATA.generalIssued||[]).filter(isApproved).forEach(r=>iss.set(r.itemName,(iss.get(r.itemName)||0)+Number(r.issued||0)));
  const prices=DATA.inventoryPrices||{};
  const general=(DATA.inventoryItems||[]).map(x=>typeof x==='string'?{name:x}:x).filter(x=>x&&x.name).map(x=>{
    const o={
      id:x.id||legacyId(x.name),kind:'item',name:String(x.name),sku:String(x.sku||''),barcode:String(x.barcode||''),
      unit:String(x.unit||''),per:String(x.unit||''),category:String(x.category||''),min:Number(x.minStock)||0,
      price:Number((prices[x.name]||{}).sellingPrice)||0,
      avail:(rec.get(x.name)||0)-(iss.get(x.name)||0)
    };
    o.hay=(o.name+' '+o.sku+' '+o.barcode+' '+o.category).toLowerCase();
    return o;
  });
  ITEMS=general.concat(commodityItems()).sort((a,b)=>a.name.localeCompare(b.name));
  BYID=new Map(ITEMS.map(i=>[i.id,i]));
}
function matches(q){

}
function scanMatch(q){
  const c=String(q||'').trim().toLowerCase();if(!c)return null;

// ── cart
// A line total is rounded to 2 decimals once, and the basket total is the sum of those rounded line totals,
// so the lines printed on the receipt always add up to the total printed under them.
const lineTotal=l=>Math.round(l.price*l.qty*100)/100;
const cartTotal=()=>Math.round(CART.reduce((a,l)=>a+lineTotal(l),0)*100)/100;

// ── BASKET: the cart frozen into one record = one receipt ─────────────────────
// This is the shape that step 9 will store as sales/{saleId}: header + lines, with the selling price copied
// onto each line at the moment of sale (so editing a price later never changes an old receipt). id and
// receiptNo stay null until payment (step 6) and the per-till number prefix (step 8) exist. Nothing is saved.
function makeBasket(pay){
  const lines=CART.map(l=>({itemId:l.id,kind:l.kind||'item',name:l.name,unit:l.unit,qty:l.qty,price:l.price,total:lineTotal(l)}));
  return Object.assign({
    id:null,receiptNo:null,at:Date.now(),
    cashier:USER?String(USER.username):'',
    lines,lineCount:lines.length,
    qtyTotal:Math.round(lines.reduce((a,l)=>a+l.qty,0)*1000)/1000,
    total:Math.round(lines.reduce((a,l)=>a+l.total,0)*100)/100
  },pay||{});
}

// ── PAYMENT (roadmap step 6) ─────────────────────────────────────────────────
// Charge opens one payment screen for the basket. Tenders: cash (amount received, change worked out), MTN Money and
// Airtel Money (transaction reference required), card (slip no. optional); a basket can be split over any mix.
// Whatever is not paid can go on a customer's account: nothing paid = 'credit', some paid = 'partial', all paid =
// 'paid' — the same creditStatus values the main app puts on issues. Money is worked in whole ngwee so totals never drift.
// NOTHING IS SAVED YET: finalizeSale() is where step 8 (receipt number) and step 9 (sales/{saleId}) will commit the sale.
const METHODS={cash:{label:'Cash'},mtn:{label:'MTN Money',ref:true},airtel:{label:'Airtel Money',ref:true},card:{label:'Card'}};
const toC=n=>Math.round((Number(n)||0)*100),fromC=c=>c/100;
const MAXC=toC(1e9);
let PAYOVL=null,PAYBODY=null,PAYFOOT=null,PAY=null;

// tenders are applied in the order entered. Cash may be more than what is left (the rest is change); MTN/Airtel/card
// may not (they cannot give change) — addTender() blocks that, `over` is only a safety net.
function settle(totalC,tenders){
  let rem=totalC,paid=0,change=0,over=false;
  const applied=tenders.map(t=>{
    const give=toC(t.tendered),use=Math.min(give,rem);
    if(t.method!=='cash'&&give>rem)over=true;
    rem-=use;paid+=use;if(t.method==='cash')change+=give-use;
    return use;
  });
  return {applied,paid,rem,change,over};
}
const payStatus=S=>S.rem<=0?'paid':(S.paid>0?'partial':'credit');
const payReady=S=>!S.over&&(S.rem<=0||(PAY.onAccount&&!!PAY.customer));
const customers=()=>(DATA.contacts||[]).filter(c=>c&&c.type==='customer'&&c.id).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));
function fld(label,input){const w=el('label','fld');w.append(el('span','',label),input);return w;}

function openPay(){
  if(!CART.length||PAYOVL)return;
  if(isReadOnly()){say('The till is read-only right now.','bad');return;}
  if(toC(cartTotal())<=0){say('Nothing to charge.','bad');return;}
  PAY={method:'cash',tenders:[],onAccount:false,customer:''};
  const ovl=el('div','povl','',{role:'dialog','aria-modal':'true','aria-label':'Payment'});
  const box=el('div','pay'),head=el('div','pay-h');
  const cx=el('button','sm','Cancel',{type:'button'});cx.onclick=cancelPay;
  head.append(el('h2','','Payment'),cx);
  PAYBODY=el('div','pay-body');PAYFOOT=el('div','pay-f');
  box.append(head,PAYBODY,PAYFOOT);ovl.append(box);
  ovl.addEventListener('click',e=>{if(e.target===ovl)cancelPay();});
  document.body.append(ovl);PAYOVL=ovl;
  renderPay();
}
function closePay(){
  if(!PAYOVL)return;
  PAYOVL.remove();PAYOVL=PAYBODY=PAYFOOT=PAY=null;
  if(!COARSE)focusSearch();
}
function cancelPay(){
  if(PAY&&PAY.tenders.length&&!confirm('Discard the payments entered?'))return;
  closePay();
}
function renderPay(){
  const totalC=toC(cartTotal()),S=settle(totalC,PAY.tenders),fr=document.createDocumentFragment();
  const due=el('div','pay-due');due.append(el('span','','Total due'),el('b','',money(fromC(totalC))));fr.append(due);

  if(PAY.tenders.length){                                   // payments taken so far
    const tl=el('div','tl');
    PAY.tenders.forEach((t,i)=>{
      const row=el('div','t');
      row.append(el('span','',METHODS[t.method].label),el('b','',money(fromC(S.applied[i]))));
      const rm=el('button','rm','\u2715',{type:'button','aria-label':'Remove '+METHODS[t.method].label+' payment'});
      rm.onclick=()=>{PAY.tenders.splice(i,1);renderPay();};
      row.append(rm);
      const sub=[];
      if(t.ref)sub.push('Ref '+t.ref);
      if(t.method==='cash'&&toC(t.tendered)>S.applied[i])sub.push('Received '+money(t.tendered));
      if(sub.length)row.append(el('small','',sub.join(' · ')));
      tl.append(row);
    });
    fr.append(tl);
  }
  const sum=el('div','pay-sum');
  sum.append(el('span','','Paid'),el('span','r',money(fromC(S.paid))));
  sum.append(el('span','','Left to pay'),el('span','r '+(S.rem>0?'amb':'ok'),money(fromC(S.rem))));
  if(S.change>0)sum.append(el('span','b','Change to give'),el('span','r chg',money(fromC(S.change))));
  fr.append(sum);

  if(S.rem>0){                                              // take another payment
    const spec=METHODS[PAY.method],mt=el('div','methods');
    Object.keys(METHODS).forEach(k=>{
      const b=el('button',PAY.method===k?'on':'',METHODS[k].label,{type:'button'});
      b.onclick=()=>{PAY.method=k;renderPay();};
      mt.append(b);
    });
    fr.append(mt);
    const amt=el('input','','',{id:'pay-amt',type:'number',inputmode:'decimal',min:'0',step:'0.01','aria-label':'Amount'});
    amt.value=fromC(S.rem).toFixed(2);
    fr.append(fld(PAY.method==='cash'?'Cash received':spec.label+' amount',amt));
    const hint=el('div','pay-hint');fr.append(hint);
    let ref=null;
    if(PAY.method!=='cash'){
      ref=el('input','','',{id:'pay-ref',type:'text',autocomplete:'off',autocapitalize:'characters',spellcheck:'false',maxlength:'40'});
      fr.append(fld(spec.ref?spec.label+' transaction reference (required)':'Card slip / approval no. (optional)',ref));
    }
    if(PAY.method==='cash'){                                // one-tap cash: exact, then the next round notes above what is left
      const q=el('div','quick'),vals=[S.rem],k=S.rem/100;
      [10,50,100,200].forEach(n=>{const v=Math.ceil(k/n)*n*100;if(v>S.rem&&!vals.includes(v))vals.push(v);});
      vals.slice(0,4).forEach((v,i)=>{
        const b=el('button','',i===0?'Exact':fq(fromC(v)),{type:'button'});
        b.onclick=()=>{PAY.tenders.push({method:'cash',tendered:fromC(v),ref:''});renderPay();};
        q.append(b);
      });
      fr.append(q);
    }
    const err=el('div','pay-err','',{role:'alert'});
    const add=el('button','add','Add payment',{type:'button'});
    const upd=()=>{
      const c=toC(amt.value);err.textContent='';
      hint.textContent=c>S.rem&&PAY.method==='cash'?'Change to give: '+money(fromC(c-S.rem)):(c>0&&c<S.rem?'Still to pay after this: '+money(fromC(S.rem-c)):'');
    };
    const doAdd=()=>{
      const c=toC(amt.value),m=PAY.method,fail=t=>{err.textContent=t;};
      if(!(c>0)||c>MAXC)return fail('Enter the amount.');
      if(m!=='cash'&&c>S.rem)return fail('Only '+money(fromC(S.rem))+' is left to pay, and '+spec.label+' cannot give change.');
      let r='';
      if(ref){
        r=ref.value.trim().toUpperCase().replace(/\s+/g,'');
        if(spec.ref&&r.length<4)return fail('Enter the '+spec.label+' transaction reference (at least 4 characters).');

      }

    };

    const ab=el('button','acct'+(PAY.onAccount?' on':''),PAY.onAccount?'\u2713 Balance goes on account \u2014 tap to undo':'Put the balance on account (credit)',{type:'button'});

}

// ── HELD / PARKED SALES (roadmap step 7) ─────────────────────────────────────
// "Hold sale" parks the cart so the next customer can be served; "Held (n)" beside the search box lists the parked
// baskets and brings one back. A held basket is NOT a sale: nothing is recorded, no stock moves and no receipt number
// is used until it is paid. Baskets are kept on THIS device (localStorage, one list per depot), so they survive a
// reload, a logout or an offline spell, and every till tab on the device sees the same list.
// Resuming moves the basket back into the cart. Whatever is in the cart at that moment is parked first, so nothing is
// lost, and prices are re-read from the Price List: a basket held this morning is sold at today's price, exactly as if
// its items were scanned now. Leaving the till (logout, idle timeout, signed out from another tab) with items in the
// cart parks them instead of throwing them away.
const HELD_MAX=20,HELD_OLD_MS=12*3600*1000;
const heldKey=()=>'mdm_pos_held_v1:'+((DATA&&DATA.installId)||'local');
const heldLineOk=l=>!!(l&&l.id&&Number(l.qty)>0&&Number.isFinite(Number(l.price)));
function readHeld(){
  try{
    const a=JSON.parse(localStorage.getItem(heldKey())||'[]');
    return (Array.isArray(a)?a:[]).filter(h=>h&&h.id&&Array.isArray(h.lines))
      .map(h=>Object.assign({},h,{lines:h.lines.filter(heldLineOk)})).filter(h=>h.lines.length);
  }catch{return [];}
}
function writeHeld(a){
  try{if(a.length)localStorage.setItem(heldKey(),JSON.stringify(a));else localStorage.removeItem(heldKey());return true;}
  catch{return false;}   // storage full or blocked: the caller keeps the cart as it is
}
const heldTotal=h=>Math.round(h.lines.reduce((a,l)=>a+lineTotal({price:Number(l.price),qty:Number(l.qty)}),0)*100)/100;
const cartAsHeld=()=>({
  id:'h_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),at:Date.now(),by:USER?String(USER.username):'',
  lines:CART.map(l=>({id:l.id,kind:l.kind||'item',name:l.name,unit:l.unit||'',per:l.per||'',price:l.price,qty:l.qty}))
});
function ago(t){
  const m=Math.max(0,Math.round((Date.now()-t)/6e4));
  if(m<1)return 'just now';if(m<60)return m+' min ago';
  const h=Math.floor(m/60);if(h<24)return h+' h ago';
  const d=Math.floor(h/24);return d+(d===1?' day ago':' days ago');
}

// Returns true when the cart is empty afterwards (held, or there was nothing to hold).
function holdCart(quiet){
  if(!CART.length)return true;
  const a=readHeld();
  if(a.length>=HELD_MAX){say('Too many held sales ('+HELD_MAX+'). Resume or discard one first.','bad');return false;}
  a.push(cartAsHeld());

  CART=[];renderCart();renderHeldBtn();
  if(!quiet)say('Sale held. Serve the next customer.','ok');

}
function parkOnExit(){try{if(CART&&CART.length)holdCart(true);}catch{}}
function resumeHeld(id){
  const a=readHeld(),i=a.findIndex(h=>h.id===id);   // read fresh: another till tab may have resumed it already
  if(i<0){say('That held sale was already resumed or discarded.','bad');renderHeldBtn();renderHeldList();return;}
  const h=a.splice(i,1)[0],parked=CART.length>0;
  if(parked)a.push(cartAsHeld());                   // one out, one in: never over the limit
  if(!writeHeld(a)){say('Could not resume: no storage space left on this device.','bad');return;}
  const r=repriceLines(h.lines);CART=r.lines;
  closeHeld();renderCart();renderHeldBtn();openCart();
  const note=priceNotes(r,'held');
  if(parked)note.push('the sale you had open is now held');
  say('Held sale resumed'+(note.length?'. '+note.join('. '):'')+'.',r.repriced||r.unlisted.length?'warn':'ok',note.length?7000:null);
}
// Lines coming back from storage (a held basket, a restored cart) are re-read from the Price List, exactly as if the
// items were scanned now. An item with no price any more keeps the stored price and is named in the notes.
function repriceLines(lines){
  let repriced=0;const unlisted=[];
  const out=lines.map(l=>{
    const it=BYID.get(l.id);
    const line={id:l.id,kind:l.kind||'item',name:l.name,unit:l.unit||'',per:l.per||'',price:Number(l.price),qty:Number(l.qty)};
    if(it&&it.price>0){
      if(Math.abs(it.price-line.price)>0.004)repriced++;
      line.price=it.price;line.name=it.name;line.unit=it.unit;line.per=it.per;line.kind=it.kind;
    }else unlisted.push(String(l.name));
    return line;
  });
  return {lines:out,repriced,unlisted};
}
function priceNotes(r,what){   // what: 'held' (Resume) or 'saved' (restored cart)
  const note=[];
  if(r.repriced)note.push(r.repriced+(r.repriced===1?' price was':' prices were')+' updated to the Price List');
  if(r.unlisted.length)note.push((r.unlisted.length===1?r.unlisted[0]+' is':r.unlisted.length+' items are')+' not on the Price List any more, so the '+(what||'held')+' price is kept');
  return note;
}

// ── LIVE-CART AUTOSAVE ───────────────────────────────────────────────────────
// Held baskets only protect a sale the cashier parks, or leaves through logout / idle timeout. An OPEN cart used to
// live in memory alone, so a reload (including the update reload), a killed browser or a dead battery lost it. Now every
// cart change writes the cart to localStorage (one draft per till tab, per depot), and the draft is deleted the moment
// the cart is empty again (held, cleared, or, later, paid).
//   • Reloaded tab: the tab keeps its id in sessionStorage, so it finds its own draft and puts it straight back in the
//     cart (re-priced, see repriceLines). A different cashier's draft goes to Held instead of into this cashier's cart.
//   • Tab that died (browser killed, phone restarted): its draft is moved to the Held list, marked "recovered", by
//     whichever till tab opens next. Whether a tab is still alive is read from the Web Locks API: every till tab holds a
//     lock named after its id for as long as it is open. Without Web Locks a draft is only adopted after HELD_OLD_MS of
//     silence, so a tab that is merely in the background is never robbed of its cart.
// Nothing here records a sale; a draft is just a cart that survived.
const DRAFT_PFX='mdm_pos_draft_v1:',TAB_KEY='mdm_pos_tab',LOCK_PFX='mdm_pos_tab:';
let TAB='';
const draftKey=(tab)=>DRAFT_PFX+((DATA&&DATA.installId)||'local')+':'+tab;
function saveDraft(){
  if(!TAB)return;                                   // before boot has claimed a tab id
  try{
    if(!CART.length){localStorage.removeItem(draftKey(TAB));return;}
    localStorage.setItem(draftKey(TAB),JSON.stringify({v:1,tab:TAB,at:Date.now(),by:USER?String(USER.username):'',
      lines:CART.map(l=>({id:l.id,kind:l.kind||'item',name:l.name,unit:l.unit||'',per:l.per||'',price:l.price,qty:l.qty}))}));
  }catch{}                                          // storage full or blocked: the cart still works, it just is not saved
}
// Pick this tab's id and take its lock. A duplicated browser tab copies sessionStorage, so if another tab already holds
// the lock for the id we were given, we take a new one rather than share a draft with it.
async function claimTab(){
  const mk=()=>'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  let id=null;try{id=sessionStorage.getItem(TAB_KEY);}catch{}
  if(!id)id=mk();
  if(navigator.locks&&navigator.locks.request){
    for(let i=0;i<3;i++){
      let got=false;
      try{got=await new Promise(res=>{
        navigator.locks.request(LOCK_PFX+id,{ifAvailable:true},lock=>{
          if(!lock){res(false);return;}
          res(true);return new Promise(()=>{});     // never settles: the lock is held until this page closes
        }).catch(()=>res(true));
      });}catch{got=true;}
      if(got)break;
      id=mk();
    }
  }
  try{sessionStorage.setItem(TAB_KEY,id);}catch{}
  return id;
}
async function liveTabLocks(){
  try{
    if(!(navigator.locks&&navigator.locks.query))return null;
    return new Set(((await navigator.locks.query()).held||[]).map(l=>l.name));
  }catch{return null;}                              // unknown: the caller falls back to the age rule
}
// Called at boot (before the sell screen is built; boot=true) and whenever the till comes back to the front.
// Returns {restored,adopted} so the caller can say what happened.
async function recoverDrafts(boot){
  const out={restored:0,adopted:0,notes:[]};
  const pre=draftKey(''),mine=draftKey(TAB);
  const keys=[];
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(pre))keys.push(k);}}catch{return out;}
  if(!keys.length)return out;
  const live=await liveTabLocks();
  const held=readHeld(),have=new Set(held.map(h=>h.id)),adopt=[],spent=[];
  const me=USER?String(USER.username).toLowerCase():'';
  for(const k of keys){
    let d=null;try{d=JSON.parse(localStorage.getItem(k)||'null');}catch{}
    const lines=d&&Array.isArray(d.lines)?d.lines.filter(heldLineOk):[];
    if(!lines.length){if(k!==mine)try{localStorage.removeItem(k);}catch{}continue;}   // empty or unreadable: nothing to keep
    if(k===mine){
      if(!boot)continue;                                                              // our own live draft
      if(!CART.length&&String(d.by||'').toLowerCase()===me){
        const r=repriceLines(lines);CART=r.lines;out.restored=r.lines.length;out.notes=priceNotes(r,'saved');continue;
      }
      // someone else's cart, or this tab already has items: park it below
    }else{
      const dead=live?!live.has(LOCK_PFX+d.tab):Date.now()-(Number(d.at)||0)>HELD_OLD_MS;
      if(!dead)continue;                                                              // another tab is still using it
    }
    adopt.push({id:'r_'+String(d.tab)+'_'+String(d.at),at:Number(d.at)||Date.now(),by:String(d.by||''),rec:true,
      lines:lines.map(l=>({id:l.id,kind:l.kind||'item',name:l.name,unit:l.unit||'',per:l.per||'',price:Number(l.price),qty:Number(l.qty)})),key:k});
  }
  // Move them into Held. A fixed id (tab + last change) means a pass that is interrupted before the draft is deleted
  // cannot create the basket twice. If Held is full the draft simply stays where it is and is tried again next time.
  let changed=false;
  for(const a of adopt){
    const {key,...h}=a;
    if(have.has(h.id)){spent.push(key);continue;}
    if(held.length>=HELD_MAX)break;
    held.push(h);have.add(h.id);spent.push(key);out.adopted++;changed=true;
  }
  if(changed&&!writeHeld(held)){out.adopted=0;return out;}   // could not save the list: keep every draft
  spent.forEach(k=>{try{localStorage.removeItem(k);}catch{}});
  return out;
}
function draftNotice(r){
  const m=[];
  if(r.restored)m.push('Your open sale was restored');
  if(r.adopted)m.push(r.adopted+(r.adopted===1?' unsaved sale was':' unsaved sales were')+' recovered into Held');
  m.push(...r.notes);
  return m;
}

  const cbm=el('span','cb-main');cbm.append(el('span','','',{id:'cb-a'}),el('small','','',{id:'cb-b'}));
  const cbr=el('span','cb-main');cbr.style.alignItems='flex-end';cbr.append(el('span','cb-tot','',{id:'cb-t'}),el('small','cb-go','View cart \u25B2'));
  CARTBAR.append(cbm,cbr);
  const scrim=el('div','scrim');
  SELL.append(items,CARTBAR,scrim,cart);
  m.append(SELL);

  // events
  GRID.addEventListener('click',e=>{
    const t=e.target.closest('.tile');if(!t||t.disabled)return;
    const i=BYID.get(t.dataset.id);if(i){addItem(i,1);if(!COARSE)focusSearch();}
  });
  Q.addEventListener('input',renderGrid);
  Q.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&Q.value){Q.value='';renderGrid();return;}
    if(e.key!=='Enter')return;
    e.preventDefault();
    const v=Q.value.trim();if(!v)return;
    let hit=scanMatch(v);                                // scanner: exact barcode or SKU, then Enter
    if(!hit){const r=matches(v);if(r.length===1)hit=r[0];}   // typing: one item left in the list
    if(!hit){say('No item matches \u201c'+v+'\u201d.','bad');Q.select();return;}
    if(!hit.price){say(hit.name+' has no price yet. Set it in the main app under \uD83D\uDCB2 Prices.','bad');Q.select();return;}
    addItem(hit,1);Q.value='';renderGrid();focusSearch();
  });
  // Touch devices: the box keeps focus for a Bluetooth/USB scanner, but the on-screen keyboard stays down
  // until the keyboard button is tapped, so it does not cover the items.
  if(COARSE){
    kb.style.display='block';
    kb.onclick=()=>{kbBusy=true;Q.setAttribute('inputmode','search');Q.blur();focusSearch();kbBusy=false;};
    Q.addEventListener('blur',()=>{if(!kbBusy)Q.setAttribute('inputmode','none');});
  }
  CARTBAR.onclick=openCart;scrim.onclick=closeCart;grab.onclick=closeCart;x.onclick=closeCart;
  clr.onclick=()=>{if(CART.length&&confirm('Clear this sale?'))clearCart();};
  HBTN.onclick=openHeld;
  // A scanner types like a keyboard. If focus is anywhere that is not a text field, send the keystrokes to the box.
  document.addEventListener('keydown',e=>{
    if(PAYOVL){if(e.key==='Escape')cancelPay();return;}
    if(HOVL){if(e.key==='Escape')closeHeld();return;}
    if(e.key==='Escape'&&ROVL){hideReceipt();return;}
    if(e.key==='Escape'&&SELL.classList.contains('open')){closeCart();return;}
    const t=e.target,tag=t&&t.tagName;
    if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(t&&t.isContentEditable))return;
    if(e.ctrlKey||e.metaKey||e.altKey||e.key.length!==1||e.key===' ')return;
    focusSearch();
  },true);
  // Back from another tab (e.g. the main app after receiving stock): pick up the latest items and stock.
  document.addEventListener('visibilitychange',async()=>{
    if(document.visibilityState!=='visible')return;
    const d=await loadData();if(!d)return;DATA=d;loadCatalog();
    CART.forEach(l=>{const it=BYID.get(l.id);if(it){l.unit=it.unit;l.per=it.per;}});
    const rc=await recoverDrafts(false);                // a tab that died while this one was in the background
    renderGrid();renderCart();renderHeldBtn();if(HOVL)renderHeldList();
    if(rc.adopted)say(draftNotice(rc).join('. ')+'.','warn',7000);
  });
  addEventListener('storage',e=>{if(e.key===heldKey()){renderHeldBtn();renderHeldList();}});   // another till tab held/resumed one
  renderGrid();renderCart();renderHeldBtn();focusSearch();
}

async function boot(){
  if(sessionStorage.getItem('_play')==='1')return card('🔒','Not available','The till is not available in this version of the app.',[['Back to app',toApp,true]]);
  DATA=await loadData();
  if(!DATA)return card('📭','No data on this device','Open the main app and sign in first.',[['Open main app',toApp,true]]);
  USER=sessionUser();
  if(!USER)return card('🔑','Please sign in','Sign in on the main app, then open the Till from there.',[['Open main app',toApp,true]]);
  LICENSE=await loadLicense();
  if(!hasFeature('pos_till'))return card('🔒','Till not available','The Till is not available on this account. Check the main app.',[['Back to app',toApp,true]]);
  if(isReadOnly())return card('⏸','Till unavailable','This account is read-only right now (suspended, pending or in grace period). Check the main app.',[['Back to app',toApp,true]]);
  try{sessionStorage.setItem(SESSION_KEY,JSON.stringify({u:String(USER.username).toLowerCase(),t:Date.now()}));}catch{}
  const di=DATA.depotInfo||{};
  $('depot').textContent=di.name||'';
  setPill('p-user',USER.username+(USER.role?' · '+USER.role:''));
  $('hdr').hidden=false;netPill();cloudPill();
  addEventListener('online',()=>{netPill();cloudPill();});addEventListener('offline',netPill);
  ['pointerdown','keydown','touchstart','scroll'].forEach(e=>document.addEventListener(e,idleReset,{passive:true,capture:true}));
  idleReset();
  try{new BroadcastChannel('mdm_session').onmessage=e=>{if(e.data&&e.data.type==='logout'){parkOnExit();try{sessionStorage.removeItem(SESSION_KEY);}catch{}toApp();}};}catch{}
  addEventListener('storage',e=>{if(e.key==='mdm_session_event'&&e.newValue&&e.newValue.startsWith('logout:')){parkOnExit();try{sessionStorage.removeItem(SESSION_KEY);}catch{}toApp();}});
  $('b-app').onclick=toApp;$('b-out').onclick=logout;
  loadCatalog();
  TAB=await claimTab();
  const rc=await recoverDrafts(true);                   // BEFORE buildSell: its first renderCart would delete our draft
  buildSell();
  if(rc.restored||rc.adopted){const n=draftNotice(rc);say(n.join('. ')+'.',rc.notes.length?'warn':'ok',7000);if(rc.restored)openCart();}
}
boot();
</script>
