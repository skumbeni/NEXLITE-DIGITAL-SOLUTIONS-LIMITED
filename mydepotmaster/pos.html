<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#1A1A2E"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Till — Shop Inventory &amp; Sales Manager</title>
<link rel="manifest" href="manifest.json">
<!-- Same origin as index.html, so it shares localStorage, IndexedDB and the Firebase Auth session.
     CSP mirrors index.html minus what the till does not use. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' blob:; script-src 'self' 'unsafe-inline' https://www.google.com/recaptcha/ https://www.gstatic.com/; style-src 'self' 'unsafe-inline'; connect-src https://mdm-copilot-proxy.chongogoodson0.workers.dev https://*.firebaseio.com https://firebaseinstallations.googleapis.com https://securetoken.googleapis.com https://identitytoolkit.googleapis.com https://firebaseappcheck.googleapis.com https://www.google.com/recaptcha/ https://recaptcha.google.com; img-src 'self' data: blob: https:; worker-src 'self' blob:; manifest-src 'self' blob:; frame-src https://www.google.com/recaptcha/ https://recaptcha.google.com; frame-ancestors 'none';">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#1A1A2E;--surface:#16213E;--border:#2C3E50;--text:#fff;--muted:#9aa5b8;--green:#00e096;--red:#ff6b6b;--amber:#ffb84d;--on-green:#0a1628;--press:#1c2a4d;color-scheme:dark}
/* Light theme (Till settings > Appearance). The page sets data-theme on <html> to light or dark (Auto is worked out from the phone) before it paints. */
:root[data-theme="light"]{--bg:#F4F6F8;--surface:#ffffff;--border:#D5D8DC;--text:#1f2d3a;--muted:#66727f;--green:#1E8449;--red:#C0392B;--amber:#B9770E;--on-green:#ffffff;--press:#e6ebf1;color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:calc(16px*var(--ts,1))/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--border)}
header b{font-size:calc(18px*var(--ts,1))}header small{display:block;color:var(--muted);font-size:calc(13px*var(--ts,1))}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:calc(12px*var(--ts,1));padding:3px 9px;border-radius:99px;border:1px solid var(--border);color:var(--muted)}
.pill.ok{color:var(--green);border-color:var(--green)}.pill.bad{color:var(--red);border-color:var(--red)}.pill.warn{color:var(--amber);border-color:var(--amber)}
main{max-width:560px;margin:0 auto;padding:28px 16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;text-align:center}
.card .ic{font-size:calc(40px*var(--ts,1));margin-bottom:8px}.card h1{font-size:calc(20px*var(--ts,1));margin-bottom:6px}.card p{color:var(--muted);margin-bottom:16px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button{font:inherit;font-weight:600;padding:11px 18px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer}
button.pri{background:var(--green);border-color:var(--green);color:var(--on-green)}

/* ── layout shell: header on top, the rest of the screen belongs to <main> ── */
[hidden]{display:none!important}
:root{--app-h:100vh}@supports(height:100dvh){:root{--app-h:100dvh}}   /* fitView() below replaces this with the height really visible */
body{display:flex;flex-direction:column;height:var(--app-h)}
main{width:100%}
header{flex:none}
header .hr{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:flex-end}
header .hr{min-width:0}
/* action buttons: ONE row. If it is wider than the space it has, it scrolls sideways inside itself (the page never gets wider), and the edge with more to see fades. */
header .hb{display:flex;flex-wrap:nowrap;align-items:center;gap:6px;min-width:0;max-width:100%;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
header .hb button{flex:0 0 auto;white-space:nowrap}
header .hb button:focus-visible{outline-offset:-2px}
header .hb button:last-child{margin-right:12px}
header .hb[data-fade="r"],header .pills[data-fade="r"]{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent)}
header .hb[data-fade="l"],header .pills[data-fade="l"]{-webkit-mask-image:linear-gradient(to right,transparent,#000 28px);mask-image:linear-gradient(to right,transparent,#000 28px)}
header .hb[data-fade="lr"],header .pills[data-fade="lr"]{-webkit-mask-image:linear-gradient(to right,transparent,#000 28px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to right,transparent,#000 28px,#000 calc(100% - 28px),transparent)}
button.sm{padding:5px 11px;font-size:calc(13px*var(--ts,1));font-weight:600;border-radius:8px}
button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.pill{font-size:calc(12px*var(--ts,1))}

/* ── SELL SCREEN ─────────────────────────────────────────────────────────────
   Phone  (<768px): items fill the screen; the cart is a bottom sheet opened from a bar at the bottom.
   Tablet (>=768px): two panes, items on the left, cart on the right, always visible. */
main.on-sell{max-width:none;margin:0;padding:0;flex:1;min-height:0}
.sell{position:relative;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%;overflow:hidden}
.items{display:flex;flex-direction:column;min-height:0;min-width:0}

.searchbar{display:flex;gap:8px;padding:10px 12px 6px}
.searchbar input{flex:1;min-width:0;font:inherit;font-size:max(17px,calc(17px*var(--ts,1)));padding:12px 14px;border-radius:12px;border:2px solid var(--border);background:var(--surface);color:var(--text)}
.searchbar input:focus{outline:none;border-color:var(--green)}
.searchbar input::placeholder{color:var(--muted)}
#kb{display:none;min-width:48px;padding:0 12px;font-size:calc(20px*var(--ts,1));line-height:1}
.msg{min-height:22px;padding:0 14px 4px;font-size:calc(13px*var(--ts,1));color:var(--muted)}
.msg.ok{color:var(--green)}.msg.bad{color:var(--red)}

.grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:8px;align-content:start;padding:4px 12px 84px;overscroll-behavior:contain}
.grid .note{grid-column:1/-1;text-align:center;color:var(--muted);padding:28px 8px;font-size:calc(14px*var(--ts,1))}
.tile{position:relative;display:block;padding:10px 11px;text-align:left;font-weight:400;border-radius:12px;background:var(--surface);border:1px solid var(--border)}
/* v0.3.148: the flex column lives in an inner span, not on the <button>. Firefox sized a button's row from its first lines only, so the wrapped name, the
   pack line (BOX x5 . CARTON x100 . PACK x1,000) and the stock line spilled out of the tile. The span is ordinary block content, so every wrapped line counts. */
.tile .ti{display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-height:74px;height:100%}
.tile:active:not(:disabled){background:var(--press)}
.tile:disabled{opacity:.5;cursor:not-allowed}
.tile .nm{font-weight:600;font-size:calc(15px*var(--ts,1));line-height:1.25;overflow-wrap:anywhere;padding-right:20px}
.tile .pr{color:var(--green);font-weight:700;font-size:calc(15px*var(--ts,1))}
.tile .pr small{color:var(--muted);font-weight:400;font-size:calc(12px*var(--ts,1));margin-left:4px}
.tile .st{font-size:calc(12px*var(--ts,1));color:var(--muted)}
.tile .st.low{color:var(--amber)}.tile .st.out{color:var(--red)}
.tile .inc{position:absolute;top:7px;right:7px;min-width:calc(22px*var(--ts,1));height:calc(22px*var(--ts,1));padding:0 6px;border-radius:99px;background:var(--green);color:var(--on-green);font-size:calc(12px*var(--ts,1));font-weight:700;line-height:calc(22px*var(--ts,1));text-align:center}

.cartbar{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:14px 16px;border:0;border-top:1px solid var(--border);border-radius:0;background:var(--surface);font-size:calc(16px*var(--ts,1));text-align:left}
.cartbar .cb-main{display:flex;flex-direction:column;line-height:1.25}
.cartbar .cb-main small{color:var(--muted);font-weight:400;font-size:calc(13px*var(--ts,1))}
.cartbar .cb-tot{font-weight:700;color:var(--green)}
.cartbar.has .cb-go{color:var(--green)}
.cartbar .cb-go{font-size:calc(14px*var(--ts,1))}

.scrim{position:absolute;inset:0;z-index:25;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s}
.sell.open .scrim{opacity:1;pointer-events:auto}

.cart{position:absolute;left:0;right:0;bottom:0;z-index:30;display:flex;flex-direction:column;height:84%;background:var(--surface);border-top:1px solid var(--border);border-radius:18px 18px 0 0;transform:translateY(100%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s}
.sell.open .cart{transform:none;visibility:visible;transition:transform .22s ease}
.grab{flex:none;display:block;width:100%;padding:8px 0 2px;border:0;background:transparent}
.grab i{display:block;width:44px;height:5px;margin:0 auto;border-radius:3px;background:var(--border)}
.cart-h{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 14px 10px;border-bottom:1px solid var(--border)}
.cart-h h2{font-size:calc(17px*var(--ts,1))}
.cart-h .acts{display:flex;gap:6px}
.lines{flex:1;min-height:0;overflow-y:auto;padding:4px 14px;overscroll-behavior:contain}
.lines .empty{text-align:center;color:var(--muted);padding:36px 12px;font-size:calc(14px*var(--ts,1))}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 0;border-bottom:1px solid var(--border)}
.line .ln{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.line .lt{font-weight:700;text-align:right}
.line .lp{color:var(--muted);font-size:calc(13px*var(--ts,1));align-self:center}
.line .lw{grid-column:1/-1;font-size:calc(12px*var(--ts,1));color:var(--amber)}
.line .lo{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;font-size:calc(12px*var(--ts,1));font-weight:600;color:var(--green)}
.line .lh{grid-column:1/-1;font-size:calc(12px*var(--ts,1));color:var(--muted)}
.line .lv{grid-column:1/-1;font-size:calc(12px*var(--ts,1));font-weight:600;color:var(--green)}
.tile .offer{display:block;font-size:calc(12px*var(--ts,1));font-weight:700;color:var(--green)}
.tile .whl{display:block;font-size:calc(11px*var(--ts,1));font-weight:600;color:var(--green);line-height:1.3}
.tile .alt{display:block;font-size:calc(11px*var(--ts,1));color:var(--muted);line-height:1.3}
.tile .xp{display:block;font-size:calc(11px*var(--ts,1));font-weight:700;line-height:1.3}.tile .xp.bad{color:var(--red)}.tile .xp.warn{color:var(--amber)}
.line .lx{grid-column:1/-1;font-size:calc(12px*var(--ts,1));font-weight:700;color:var(--red)}
.line .lu{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:calc(12px*var(--ts,1));color:var(--muted)}
.line .lu select{font:inherit;font-weight:600;font-size:max(14px,calc(14px*var(--ts,1)));padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);max-width:100%}
.qty{display:flex;align-items:center;gap:4px;justify-self:end}
.qty button{width:40px;height:40px;padding:0;font-size:20px;line-height:1;border-radius:10px}
.qty input{width:58px;height:40px;text-align:center;font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);padding:0 2px}
.cart-f{flex:none;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border)}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-size:calc(15px*var(--ts,1));color:var(--muted);margin-bottom:10px}
.tot b{font-size:calc(24px*var(--ts,1));color:var(--text)}
.cart-f .pri{width:100%;padding:14px 18px;font-size:calc(17px*var(--ts,1))}
.cart-f .pri:disabled{opacity:.45;cursor:not-allowed}
.cart-f .hint{margin-top:8px;text-align:center;font-size:calc(12px*var(--ts,1));color:var(--muted)}

@media (min-width:768px){
  .sell{grid-template-columns:minmax(0,1fr) 380px}
  .grid{padding-bottom:12px}
  .cartbar,.scrim,.grab,.cart-h .x{display:none}
  .cart{position:static;z-index:auto;height:auto;transform:none;visibility:visible;border-radius:0;border-top:0;border-left:1px solid var(--border);transition:none}
  .cart-h{padding-top:12px}
}
@media (max-width:767px){
  header{flex-wrap:wrap;gap:6px 8px;padding:8px 12px}
  header b{font-size:calc(17px*var(--ts,1))}header small{display:none}
  header .hr{display:contents}
  header>div:first-child{flex:1 1 100%;min-width:0}
  /* action buttons: one full-width row you can swipe sideways, same as the status pills below it */
  header .hb{order:2;flex:0 0 100%;touch-action:pan-x;scrollbar-width:none}
  header .hb::-webkit-scrollbar{display:none}
  header .hb button.sm{min-height:36px;padding:6px 13px}
  header .hb #b-help{min-width:36px;padding-left:0;padding-right:0}
  /* status pills: one row you can swipe sideways (was overflow:hidden, so the last pills were cut off and could not be reached) */
  header .pills{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;touch-action:pan-x;scrollbar-width:none;gap:5px;padding-bottom:2px}
  header .pills::-webkit-scrollbar{display:none}
  .pill{font-size:calc(11px*var(--ts,1));padding:2px 8px;white-space:nowrap;flex:0 0 auto}
  header .pills .pill:last-child{margin-right:12px}
}
@media (prefers-reduced-motion:reduce){.cart,.scrim{transition:none!important}}

/* line remove button, secondary button in the cart footer */
.line .lt{display:flex;align-items:center;justify-content:flex-end;gap:4px}
.line .rm{width:34px;height:34px;padding:0;border-radius:8px;border-color:transparent;color:var(--muted);font-size:15px;line-height:1}
.cart-f .sec{width:100%;margin-bottom:8px;padding:10px 16px;font-size:calc(15px*var(--ts,1))}
.cart-f .sec:disabled{opacity:.45;cursor:not-allowed}

/* ── RECEIPT PREVIEW: one paper receipt for the whole basket ── */
.rovl{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;background:rgba(0,0,0,.72);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.rscroll{flex:1;min-height:0;width:100%;overflow-y:auto;padding:16px 12px}
.rbar{flex:none;display:flex;gap:10px;justify-content:center;width:100%;padding:10px 14px;background:var(--surface);border-top:1px solid var(--border)}
.rbar button{flex:1;max-width:200px}
.paper{--acc:#1E8449;--u:max(1cqw,2.4px);container-type:inline-size;box-sizing:border-box;min-height:100mm;max-width:480px;margin:0 auto 14px;padding:24px 6%;background:#fff;color:#222;font:400 calc(16px*var(--ts,1))/1.55 Arial,Helvetica,"Liberation Sans",sans-serif;border-radius:6px}   /* v0.3.104: every size below is a multiple of --u, so the text always fills the width of the paper */
.paper>*{font-size:calc(var(--u)*7.8)}
.paper .c{text-align:center}.paper .mu{color:#555;font-size:calc(var(--u)*6.3)}.paper .b{font-weight:700}
.paper .logo{display:block;margin:0 auto calc(var(--u)*2);height:calc(var(--u)*14);max-width:60%;object-fit:contain}
.paper .dep{font-size:calc(var(--u)*10.2);font-weight:700;margin-bottom:calc(var(--u)*.6)}
.paper .rule,.paper .dash{border:0;border-top:calc(var(--u)*.5) dashed #333;margin:calc(var(--u)*3) 0}
.paper .dd{border:0;border-top:calc(var(--u)*.5) dashed #333;border-bottom:calc(var(--u)*.5) dashed #333;height:calc(var(--u)*1.2);margin:calc(var(--u)*3) 0}
.paper .ttl,.paper .thx{text-align:center;font-weight:700;text-transform:uppercase;font-size:calc(var(--u)*9.5);line-height:1.1;margin:calc(var(--u)*2) 0}
.paper .thx{margin:calc(var(--u)*7) 0 calc(var(--u)*3)}.paper .ttl{font-size:calc(var(--u)*14.25)}
.paper .tag{display:inline-block;margin:calc(var(--u)*1.5) 0 calc(var(--u)*.5);padding:calc(var(--u)*.6) calc(var(--u)*3);border:1.5px solid #c0392b;border-radius:6px;color:#c0392b;font-weight:700;font-size:calc(var(--u)*6)}
.paper .tag.paid{border-color:var(--acct,var(--acc));color:var(--acct,var(--acc))}
.paper table{width:100%;border-collapse:collapse}
.paper td{padding:calc(var(--u)*1.3) 0;vertical-align:top}
.paper td.r{text-align:right;white-space:nowrap}
.paper .amt{display:flex;justify-content:space-between;gap:calc(var(--u)*2);min-width:calc(var(--u)*26);margin-left:auto}
.paper .gt td{font-weight:700;text-transform:uppercase;font-size:calc(var(--u)*8.7);padding:calc(var(--u)*2) 0}
.paper .pm td{font-weight:700;text-transform:uppercase}
.paper .bc{text-align:center;margin:calc(var(--u)*2) 0 calc(var(--u)*1)}.paper .bc svg{display:block;margin:0 auto;width:62%;height:auto}
.paper .ft{margin-top:calc(var(--u)*3);text-align:center;font-size:calc(var(--u)*6.3);color:#555}
.paper .sec{margin:calc(var(--u)*3) 0 calc(var(--u)*1);font-size:calc(var(--u)*6.3);font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#555}
.paper .sig{display:flex;gap:16px;margin-top:calc(var(--u)*8);font-size:calc(var(--u)*8.7);color:#555}.paper .sig span{flex:1;border-top:1px solid #999;padding-top:3px}
.paper .tag+.tag{margin-left:6px}
@page{margin:0}                                  /* no browser header/footer (URL, date) on the printout; the receipt carries its own padding */
@media print{
  body>*:not(.rovl){display:none!important}
  body{display:block;height:auto;background:#fff;padding:0}
  .rovl{position:static;display:block;background:none;padding:0}
  .rscroll{overflow:visible;padding:0}
  .rbar{display:none!important}
  .paper{border-radius:0;max-width:none;margin:0;padding:5mm 6%;-webkit-print-color-adjust:exact;print-color-adjust:exact}   /* the paper is the whole page */
  .paper tr,.paper tbody,.paper .tail{break-inside:avoid}            /* a long basket breaks between items, never through one; the totals block stays whole */
}

/* ── PAYMENT SCREEN (roadmap step 6) ── */
.povl{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.72);padding:env(safe-area-inset-top,0) 0 0}
.pay{width:100%;max-width:520px;max-height:100%;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:18px 18px 0 0}
@media (min-width:768px){.povl{align-items:center;padding:16px}.pay{border-radius:18px;max-height:94%}}
.pay-h{flex:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px 8px}
.pay-h h2{font-size:calc(17px*var(--ts,1))}
.pay-body{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 12px;overscroll-behavior:contain}
.pay-due{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;color:var(--muted)}
.pay-due b{font-size:calc(26px*var(--ts,1));color:var(--text)}
.tl .t{display:grid;grid-template-columns:1fr auto auto;gap:2px 8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.tl .t small{grid-column:1/-1;color:var(--muted);font-size:calc(12px*var(--ts,1))}
.tl .rm{width:34px;height:34px;padding:0;border-radius:8px;border-color:transparent;color:var(--muted);font-size:15px;line-height:1}
.pay-sum{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:calc(15px*var(--ts,1));padding:10px 0;margin:6px 0 10px;border-bottom:1px solid var(--border)}
.pay-sum .r{text-align:right;font-weight:700}
.pay-sum .amb{color:var(--amber)}.pay-sum .ok,.pay-sum .chg{color:var(--green)}
.pay-sum .chg{font-size:calc(20px*var(--ts,1))}
.methods{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 10px}
.methods button{padding:10px 2px;font-size:calc(13px*var(--ts,1));border-radius:10px}
.methods button.on{background:var(--green);border-color:var(--green);color:var(--on-green)}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:calc(13px*var(--ts,1));color:var(--muted)}
.fld input,.fld select{width:100%;font:inherit;font-size:max(17px,calc(17px*var(--ts,1)));padding:11px 12px;border-radius:10px;border:2px solid var(--border);background:var(--bg);color:var(--text)}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--green)}

// Firebase Auth: same init as index.html, so the persisted session (IndexedDB) is restored here too.
// START-UP ORDER: the three SDK tags above are `defer`red, which runs them AFTER the page has been parsed. An inline
// script ignores `defer` and runs while parsing, i.e. BEFORE the SDK exists, so initialising right here threw
// "firebase is not defined" (swallowed by the catch below) and Firebase was never started: App Check was never
// activated and POS.idToken() always returned null. So the init waits for DOMContentLoaded, which fires after every
// deferred script has run (or failed). The page still paints without waiting for the SDK; if it cannot load at all
// (offline, blocked) the same catch resolves the promise and the till carries on without a cloud session.
window._fbAuthSdkReady=new Promise(function(resolve){
  function init(){
    try{
      firebase.initializeApp(FB_CONFIG);
      try{firebase.appCheck().activate(APP_CHECK_KEY,true);}catch(e){console.warn('App Check activation failed',e);}
      let done=false;const fin=()=>{if(!done){done=true;resolve();}};
      firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
      const un=firebase.auth().onAuthStateChanged(()=>{un();fin();},()=>{un();fin();});
      setTimeout(fin,4000);
    }catch(e){console.warn('Firebase Auth SDK init failed',e);resolve();}
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
});

async function hmac256(key,data){
  try{
    const enc=new TextEncoder();
    const k=await crypto.subtle.importKey('raw',enc.encode(key),{name:'HMAC',hash:'SHA-256'},false,['sign']);
    const sig=await crypto.subtle.sign('HMAC',k,enc.encode(data));
    return Array.from(new Uint8Array(sig)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch{return '';}   // no crypto.subtle: signature can't match, so the till stays locked (fail closed)
}

// ── DATA: newest of localStorage / IndexedDB, as index.html does ───────────
function idbData(){
  return new Promise(res=>{
    try{
      const q=indexedDB.open('mdm_db',1);
      q.onerror=()=>res(null);
      q.onsuccess=()=>{try{
        const g=q.result.transaction('depot_data','readonly').objectStore('depot_data').get('main');
        g.onsuccess=()=>res(g.result||null);g.onerror=()=>res(null);
      }catch{res(null);}};
    }catch{res(null);}
  });
}
async function loadData(){
  let ls=null;try{ls=JSON.parse(localStorage.getItem(DATA_LK)||'null');}catch{}
  const db=await idbData();
  if(ls&&db)return (db._v||0)>(ls._v||0)?db:ls;
  return ls||db;
}

// ── SESSION: handed over by index.html (this tab) or a valid "stay signed in" ─
function sessionUser(){
  let u=null;
  try{const p=JSON.parse(sessionStorage.getItem(SESSION_KEY)||'null');if(p&&p.u&&Date.now()-p.t<SESSION_MS)u=p.u;}catch{}
  if(!u)try{const p=JSON.parse(localStorage.getItem(STAY_KEY)||'null');if(p&&p.enabled&&p.username&&p.expiresAt>Date.now())u=p.username;}catch{}
  if(!u)return null;
  return (DATA.users||[]).find(x=>String(x.username||'').toLowerCase()===String(u).toLowerCase())||null;
}

// ── LICENSE / TIER: signed cache written by index.html, same rules as currentTier() ─
async function loadLicense(){
  try{
    const w=JSON.parse(localStorage.getItem(LIC_KEY)||'null');
    if(w&&w.data&&w.sig&&await hmac256('mdm_lic',w.data)===w.sig)return JSON.parse(w.data);
  }catch{}
  const ts=DATA.trialStart||0;    // no/invalid cache: same fallback as index.html (trial from trialStart)
  return {effectiveStatus:ts&&Date.now()<ts+TRIAL_MS?'trial':'trial_expired',trialStart:ts};
}

// clock to the cached licence's dates (Gate.reconcile) — the cache can be older than the dates inside it.

function currentTier(){return Gate.tierOf(gateLic(),DATA);}
function hasFeature(f){return Gate.hasFeature(f,gateLic(),DATA);}
function isReadOnly(){return Gate.isReadOnly(gateLic(),DATA);}

// ── RECONNECT CLOUD ─────────────────────────────────────────────────────────────
// A till has no cloud session when its login was a fingerprint / "stay signed in" / offline one (only a typed password can sign in
// to Firebase) or after a logout (logout signs the SDK out). Without a session, sales cannot upload. Tapping the red pill asks for
// the password once, signs in with the same account index.html uses, then uploads whatever is waiting.
const AUTH_DOMAIN='mdm-depot.internal';            // same synthetic e-mail domain as index.html (_authEmailFor)
let CLOUDOVL=null;
function closeCloud(){if(CLOUDOVL){CLOUDOVL.remove();CLOUDOVL=null;}}
function reconnectCloud(){
  if(CLOUDOVL||!USER)return;
  const ovl=el('div','povl','',{role:'dialog','aria-modal':'true','aria-label':'Reconnect cloud'});
  const box=el('div','pay'),head=el('div','pay-h');
  const cx=el('button','sm','Cancel',{type:'button'});cx.onclick=closeCloud;
  head.append(el('h2','','Reconnect cloud'),cx);
  const body=el('div','pay-body'),f=el('label','fld');
  const inp=el('input','',null,{type:'password',autocomplete:'current-password',autocapitalize:'none',spellcheck:'false','aria-label':'Your password'});
  f.append(el('span','','Type the password for '+String(USER.username)+' to connect this till to the cloud, so its sales can upload.'),inp);
  const err=el('div','pay-err','');
  body.append(f,err);
  const foot=el('div','pay-f'),ok=el('button','pri','Connect',{type:'button'});
  foot.append(ok);box.append(head,body,foot);ovl.append(box);
  ovl.addEventListener('click',e=>{if(e.target===ovl)closeCloud();});
  async function submit(){
    err.textContent='';
    const pw=inp.value;
    if(!pw){err.textContent='Type your password.';return;}
    if(!navigator.onLine){err.textContent='No signal. Go online and try again.';return;}
    ok.disabled=true;ok.textContent='Connecting\u2026';
    let msg='';
    try{
      await window._fbAuthSdkReady;
      await firebase.auth().signInWithEmailAndPassword(String(USER.username).trim().toLowerCase()+'@'+AUTH_DOMAIN,pw);
    }catch(e){
      const c=e&&e.code;
      msg=(c==='auth/wrong-password'||c==='auth/invalid-credential'||c==='auth/invalid-login-credentials')?'Wrong password.'
        :c==='auth/user-not-found'?'This login has no cloud account yet. Ask the Admin.'
        :c==='auth/too-many-requests'?'Too many tries. Wait a few minutes and try again.'
        :c==='auth/network-request-failed'?'No signal. Try again.'
        :'Could not connect ('+(c||'error')+').';
    }
    ok.disabled=false;ok.textContent='Connect';
    if(!CLOUDOVL)return;                              // cancelled while connecting
    if(msg){err.textContent=msg;inp.value='';inp.focus();return;}
    closeCloud();cloudPill();setupTill();syncAll();paintSales();
  }
  ok.onclick=submit;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit();}});
  document.body.append(ovl);CLOUDOVL=ovl;inp.focus();
}
// Shared with the next steps (sales writes, sync): the same Firebase token and depot key index.html uses.

// ── RECEIPT NUMBERS (roadmap step 8) ──────────────────────────────────────────
// All the rules live in gate.js (Gate.receiptNumbering), the same code index.html runs, so both pages use ONE counter
// per device. This till's code (e.g. K7F2) is claimed in the cloud once (depots/<depot>/tills/<code>, create-only in the
// database rules), which is what makes two tills unable to share a code. Until it is claimed the till will not number
// a sale (a practice sale needs no number). After that it needs no network. The claim is retried whenever the phone
// comes back online.
const CLOUD=Gate.restCloud({
  dbUrl:FB_CONFIG.databaseURL,
  idToken:force=>window.POS.idToken(force),
  appCheck:async()=>{try{await window._fbAuthSdkReady;const t=await firebase.appCheck().getToken();return t&&t.token||null;}catch{return null;}}
});
const NUM=Gate.receiptNumbering({
  depotKey:()=>DATA&&DATA.installId,
  who:()=>USER?String(USER.username):'',
  cloud:CLOUD
});

// Idle logout, same rule as index.html: off while "stay signed in" is active. NEW (till settings): a user who switched on "Stay logged in"
// in Till settings, and has a PIN, is never logged out for being idle: the till LOCKS instead (see TILL SETTINGS below).
let idleT=null;
function stayOn(){try{const p=JSON.parse(localStorage.getItem(STAY_KEY)||'null');return !!(p&&p.enabled&&p.username&&p.expiresAt>Date.now());}catch{return false;}}
function idleReset(){
  clearTimeout(idleT);if(!USER||LOCKOVL)return;
  const c=cfgGet();
  if(c.stay&&c.pin){touchActive();idleT=setTimeout(lockTill,c.mins*6e4);return;}      // stay logged in: lock, never log out
  if(stayOn())return;
  const di=DATA.depotInfo||{};
  const mins=Number((di.autoLogoutMinutesByRole||{})[USER.role])||Number(di.autoLogoutMinutes)||10;
  idleT=setTimeout(logout,mins*6e4);
}

// ── TILL SETTINGS: THEME, STAY LOGGED IN (LOCK SCREEN + PIN), PIN, PASSWORD ──────────────────────────────────────────────
// All of it lives on THIS phone and never touches DATA: the till does not write DATA (index.html owns it and its cloud sync). Keys:
//   mdm_pos_theme               'dark' | 'light' | 'auto'   the till's own theme (the main app keeps its own, mdm_theme)
//   mdm_pos_text                85 | 100 | 115 | 130 | 150  the till's own text size in percent (Settings > Text size; the main app is not affected)
//   mdm_pos_cfg:<username>      {stay, mins, pin:{s,h,n,at}}   per login. The PIN is a salted PBKDF2 hash (s = salt, h = hash, n = length), never the PIN
//   mdm_pos_locked:<username>   '1' while the lock screen is up, so a reload or a restart cannot skip it
//   mdm_pos_active:<username>   when the till was last touched (index.html also writes it after a password or fingerprint login), so a phone put
//                               away, or an app that was closed, opens LOCKED once the idle time has passed
//   mdm_pos_pinfail:<username>  wrong PINs in a row {n, until}: 5 wrong = 30 s pause, 10 = 2 min, 15 = logged out (the password is needed again)
//   mdm_pos_pwfail:<username>   same count for the password typed in Settings
// "Stay logged in" = no idle logout; the till locks after the chosen minutes and the same login types its PIN. It also keeps the sign-in across an
// app restart (it writes the same record as the main app's Stay Signed In). Forgot the PIN? Settings > PIN > Set PIN with the account password,
// or Log out on the lock screen and sign in again. The password itself is changed in the main app (it lives in DATA.users): see goChangePassword().
const LOCK_MINS=[1,2,5,10,15,30], PIN_ITER=100000, THEME_K='mdm_pos_theme';
let LOCKOVL=null,LOCKBUF='',LOCKBUSY=false,LOCKTICK=null,LOCKDOTS=null,LOCKERR=null,LAST_TOUCH=0,LAST_SEEN=0,CFGC=null;
let ASKOVL=null,HELPOVL=null,SETOVL=null,SETBODY=null,SETTTL=null,SETVIEW='main',SETSTAY=false,SETNOTE='';
const ukey=p=>p+':'+String(USER&&USER.username||'').toLowerCase();
const hexOf=u8=>Array.from(u8).map(b=>b.toString(16).padStart(2,'0')).join('');
const pinOk=p=>/^\d{4,6}$/.test(String(p));

// theme
function themePref(){try{const v=localStorage.getItem(THEME_K);return v==='light'||v==='auto'?v:'dark';}catch{return 'dark';}}
function applyTheme(p){
  const light=p==='light'||(p==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme:light)').matches);
  document.documentElement.setAttribute('data-theme',light?'light':'dark');
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',light?'#F4F6F8':'#1A1A2E');
}
function setTheme(p){try{localStorage.setItem(THEME_K,p);}catch{}applyTheme(p);}

// text size: --ts on <html> multiplies every font size in the stylesheet (see the v0.3.149 note in the CSS)
const TEXT_K='mdm_pos_text', TEXT_STEPS=[85,100,115,130,150];
function textPref(){try{const v=Number(localStorage.getItem(TEXT_K));return TEXT_STEPS.includes(v)?v:100;}catch{return 100;}}
function applyText(p){document.documentElement.style.setProperty('--ts',String(p/100));}
function setText(p){try{localStorage.setItem(TEXT_K,String(p));}catch{}applyText(p);}

// per-login settings (kept in memory: idleReset reads them on every touch)
function cfgGet(){
  if(!CFGC){
    let c={};try{c=JSON.parse(localStorage.getItem(ukey('mdm_pos_cfg'))||'null')||{};}catch{}
    const m=Number(c.mins);
    CFGC={stay:!!c.stay,mins:LOCK_MINS.includes(m)?m:5,pin:(c.pin&&c.pin.h&&c.pin.s)?c.pin:null};
  }
  return {...CFGC};
}
function cfgSave(c){
  CFGC=null;
  try{localStorage.setItem(ukey('mdm_pos_cfg'),JSON.stringify({stay:!!c.stay,mins:c.mins,pin:c.pin||null}));return true;}catch{return false;}
}
function readActive(){try{return Number(localStorage.getItem(ukey('mdm_pos_active')))||0;}catch{return 0;}}
function touchActive(force){
  const now=Date.now();if(!force&&now-LAST_TOUCH<5000)return;
  LAST_TOUCH=now;try{localStorage.setItem(ukey('mdm_pos_active'),String(now));}catch{}
}
const lockFlagKey=()=>ukey('mdm_pos_locked');
function paintLockBtn(){const b=$('b-lock');if(b)b.hidden=!(USER&&cfgGet().pin);}

// wrong-attempt counters
function failGet(k){try{const o=JSON.parse(localStorage.getItem(ukey(k))||'null');return {n:Number(o&&o.n)||0,until:Number(o&&o.until)||0};}catch{return {n:0,until:0};}}
function failWait(k){return Math.max(0,failGet(k).until-Date.now());}
function failBump(k){const s=failGet(k);s.n++;if(s.n%5===0)s.until=Date.now()+(s.n>=10?120000:30000);try{localStorage.setItem(ukey(k),JSON.stringify(s));}catch{}return s;}
function failClear(k){try{localStorage.removeItem(ukey(k));}catch{}}

// PIN + password checks
async function pbk(str,salt,iter){
  const enc=new TextEncoder();
  const k=await crypto.subtle.importKey('raw',enc.encode(str),'PBKDF2',false,['deriveBits']);
  return hexOf(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:iter,hash:'SHA-256'},k,256)));
}
async function pinRecord(pin){const sa=new Uint8Array(16);crypto.getRandomValues(sa);const s=hexOf(sa);return {s,h:await pbk(pin,s,PIN_ITER),n:pin.length,at:Date.now()};}
async function pinMatches(pin,rec){try{return !!rec&&(await pbk(pin,rec.s,PIN_ITER))===rec.h;}catch{return false;}}
// The account password, checked on this phone (mdm2 = PBKDF2, the format index.html writes). An older format is checked with the cloud instead.
// Gives {ok:true} | {ok:false,wrong:true} (a wrong password: counted) | {ok:false,err:'...'} (could not check: not counted)
async function checkPassword(pw){
  const st=USER&&USER.password;
  if(typeof st==='string'&&st.startsWith('mdm2:')){
    const p=st.split(':');if(p.length!==3)return {ok:false,err:'This login cannot be checked on this phone. Sign in again in the main app.'};
    try{return (await pbk(pw,p[1],200000))===p[2]?{ok:true}:{ok:false,wrong:true};}catch{return {ok:false,err:'This phone could not check the password.'};}
  }
  if(!navigator.onLine)return {ok:false,err:'Go online once to check your password.'};
  try{
    await window._fbAuthSdkReady;
    await firebase.auth().signInWithEmailAndPassword(String(USER.username).trim().toLowerCase()+'@'+AUTH_DOMAIN,pw);
    return {ok:true};
  }catch(e){
    const c=e&&e.code;
    if(c==='auth/wrong-password'||c==='auth/invalid-credential'||c==='auth/invalid-login-credentials')return {ok:false,wrong:true};
    return {ok:false,err:c==='auth/network-request-failed'?'No signal. Try again.':'Could not check the password ('+(c||'error')+').'};
  }
}

// ── the lock screen ──
function lockTill(){
  if(!USER||LOCKOVL)return;
  const c=cfgGet();if(!c.pin)return;
  clearTimeout(idleT);
  try{localStorage.setItem(lockFlagKey(),'1');}catch{}
  try{if(SETOVL)closeSettings();}catch{}
  try{if(HELPOVL)closeHelp();}catch{}
  try{if(ASKOVL)closeAsk();}catch{}
  try{if(CAMOVL)stopCam();}catch{}
  try{if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();}catch{}
  const o=el('div','lockovl','',{role:'dialog','aria-modal':'true','aria-label':'Till locked'});
  const box=el('div','lockbox');
  const di=DATA&&DATA.depotInfo||{};
  LOCKDOTS=el('div','lk-dots');LOCKERR=el('div','lk-err','',{'aria-live':'polite'});
  const pad=el('div','lk-pad');
  const key=(txt,fn,cls,label)=>{const b=el('button',cls||'',txt,{type:'button'});if(label)b.setAttribute('aria-label',label);b.onclick=fn;return b;};
  '123456789'.split('').forEach(d=>pad.append(key(d,()=>lockPress(d))));
  pad.append(key('Log out',()=>{if(confirm('Log out? You will need your password to sign in again.')){clearInterval(LOCKTICK);logout();}},'sm2'),key('0',()=>lockPress('0')),key('\u232B',lockBack,'','Delete'));
  box.append(el('div','lk-ic','\U0001F512'),el('h2','','Till locked'),el('div','lk-sub',(di.name?di.name+' \u00B7 ':'')+'Type the PIN for '+USER.username),LOCKDOTS,LOCKERR,pad);
  o.append(box);document.body.append(o);LOCKOVL=o;LOCKBUF='';
  Array.from(document.body.children).forEach(e=>{if(e!==o&&e.tagName!=='SCRIPT')e.inert=true;});
  paintLock();lockWaitTick();
}
function paintLock(){
  if(!LOCKDOTS)return;
  const n=(cfgGet().pin||{n:4}).n;LOCKDOTS.replaceChildren();
  for(let i=0;i<n;i++)LOCKDOTS.append(el('i',i<LOCKBUF.length?'f':''));
}
function lockWaitTick(){
  clearInterval(LOCKTICK);LOCKTICK=null;
  if(failWait('mdm_pos_pinfail')<=0)return;
  const upd=()=>{
    const w=failWait('mdm_pos_pinfail');
    if(!LOCKOVL||w<=0){clearInterval(LOCKTICK);LOCKTICK=null;if(LOCKERR)LOCKERR.textContent='';return;}
    LOCKERR.textContent='Too many wrong PINs. Try again in '+Math.ceil(w/1000)+' seconds.';
  };
  upd();LOCKTICK=setInterval(upd,1000);
}
function lockPress(d){
  if(!LOCKOVL||LOCKBUSY||failWait('mdm_pos_pinfail')>0)return;
  const c=cfgGet();if(!c.pin){unlockTill();return;}   // the PIN was removed in another tab: nothing to ask
  LOCKERR.textContent='';
  if(LOCKBUF.length>=c.pin.n)return;
  LOCKBUF+=d;paintLock();
  if(LOCKBUF.length===c.pin.n)lockSubmit();
}
function lockBack(){if(!LOCKOVL||LOCKBUSY)return;LOCKBUF=LOCKBUF.slice(0,-1);paintLock();}
async function lockSubmit(){
  if(LOCKBUSY||!LOCKOVL)return;
  const c=cfgGet();if(!c.pin){unlockTill();return;}
  const pin=LOCKBUF;LOCKBUSY=true;
  const ok=await pinMatches(pin,c.pin);
  LOCKBUSY=false;if(!LOCKOVL)return;
  LOCKBUF='';
  if(ok){failClear('mdm_pos_pinfail');unlockTill();return;}
  const s=failBump('mdm_pos_pinfail');
  paintLock();
  LOCKOVL.classList.remove('shake');void LOCKOVL.offsetWidth;LOCKOVL.classList.add('shake');
  try{if(navigator.vibrate)navigator.vibrate(120);}catch{}
  if(s.n>=15){
    LOCKERR.textContent='Too many wrong PINs. Signing out\u2026';

function initTillSettings(){

function askGuideAnswer(q){
  const qt=[...new Set(askToks(q))];
  if(!qt.length)return '';
  const G=askGuide().map(r=>({r,ti:new Set(askToks(r[0])),tx:new Set(askToks(r[0]+' '+r[1]))}));
  const idf=w=>{const d=G.filter(g=>g.tx.has(w)).length;return d?Math.log(1+G.length/d):0;};   // a word in every topic ('sale') counts for little, a rare one ('refund') for a lot
  const sc=G.map(g=>{let n=0;qt.forEach(w=>{n+=(g.ti.has(w)?3:(g.tx.has(w)?1:0))*idf(w);});return {r:g.r,n};}).sort((a,b)=>b.n-a.n);
  const top=sc[0],nx=sc[1];
  if(!top||top.n<1.5)return '';
  return top.r[0]+'\n'+top.r[1]+(nx&&nx.n>=1.5&&nx.n*2>=top.n?'\n\nAlso see: '+nx.r[0]+'.':'');
}
function askGuideKnows(ws){const k=new Set(askGuide().flatMap(r=>askToks(r[0]+' '+r[1])));return ws.some(w=>k.has(w));}

function askSystem(){

    'Rules: Be brief (under 120 words), in plain words, with short steps. Use ONLY the guide and the live facts below; if the answer is not there, say so plainly and tell the person to ask their Admin or Manager. Never invent a price, a stock figure, a total or a button. '+

async function askAI(q,prior){
  ASKWHY='';
  if(!navigator.onLine){ASKWHY='off';return '';}
  if(!hasFeature('ai_copilot'))return '';
  const uk='mdm_copilot_usage_'+localYMD(Date.now());let used=0;try{used=parseInt(localStorage.getItem(uk)||'0',10)||0;}catch{}
  if(used>=ASK_DAILY_CAP||Date.now()-ASKLAST<2500){ASKWHY='busy';return '';}
  ASKLAST=Date.now();
  const ac=new AbortController(),to=setTimeout(()=>ac.abort(),30000);
  try{
    const input=(prior.length?'Recent conversation (oldest first):\n'+prior.map(m=>(m.me?'Person: ':'Assistant: ')+m.t).join('\n')+'\n\n':'')+'Question: '+q+'\n\nLive till facts (JSON):\n'+JSON.stringify(askFacts(q));
    const res=await fetch(ASK_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:ASK_MODEL,input,system_instruction:askSystem()}),signal:ac.signal});
    if(!res.ok){ASKWHY='busy';return '';}
    const d=await res.json();
    try{localStorage.setItem(uk,String(used+1));}catch{}
    const t=((d&&d.steps)||[]).filter(x=>x.type==='model_output').flatMap(x=>x.content||[]).filter(c=>c.type==='text').map(c=>c.text||'').join('').replace(/\*\*/g,'').replace(/^\s*[*-]\s+/gm,'\u2022 ').replace(/^#+\s*/gm,'').trim();
    if(!t){ASKWHY='busy';return '';}
    return t.slice(0,1500);
  }catch{ASKWHY='busy';return '';}
  finally{clearTimeout(to);}
}
async function askAnswer(q,prior){
  const l=q.toLowerCase(),howto=/\b(how (do|can|to)|where|button)\b/.test(l);
  if(/^\s*\d{4,8}\s*$/.test(q)||/\b(pin|password)\b.*\b\d{4,}\b/.test(l))return 'Never type a PIN or a password here. Nobody who works for the depot needs it.';
  if(!howto){
    if(/\b(not uploaded|unsent|not synced|waiting to (upload|sync))\b|\bmy sales (been |got )?(uploaded|synced|sent)\b|\bsales (uploaded|synced)\b/.test(l))return askPendingText();
    if(/\b(how (much|many)|total)\b.*\b(sold|sales|sell|made|takings)\b|\bwhat (have|did) i sold\b|\b(sales|sold) (so far|today)\b|\bmy (sales|takings)\b/.test(l))return askSalesText();
    if(/\b(cash|money)\b.*\b(drawer|should be|expected)\b|\bexpected cash\b|\bis my shift (open|on)\b|\bshift status\b|\bam i (on|in) a shift\b|\bmy float\b/.test(l))return askShiftText();
  }
  if(/\b(price|cost|how much|stock|left|how many|available|do (we|you) have|in stock|selling for|sell for)\b/.test(l)){
    const it=askItems(q);
    if(it.length)return it.slice(0,5).map(askItemLine).join('\n')+(it.length>5?'\n\nMore than 5 items match. Type more of the name.':'');
    const ct=askToks(q).filter(w=>!ASK_GEN.has(w));
    if(ct.length&&!askGuideKnows(ct))return 'I could not find an item like that on this till. Type more of the name as it shows on the tile.';   // a price or stock question about something that is neither an item nor a till topic
  }
  const ai=await askAI(q,prior);
  if(ai)return ai;
  const g=askGuideAnswer(q);
  const note=ASKWHY==='off'?'\n\n(Offline: this answer comes from the built-in guide.)':(ASKWHY==='busy'?'\n\n(The AI helper is busy or cannot be reached: this answer comes from the built-in guide.)':'');
  return g?g+note:'I could not find that in the till guide. Try other words, or ask your '+(isCashier()?'Admin or Manager':'Admin')+'.'+note;
}
async function askSend(q){
  q=String(q||'').replace(/\s+/g,' ').trim().slice(0,300);
  if(!q||ASKBUSY)return;
  ASKBUSY=true;
  const prior=ASKLOG.filter(m=>!m.wait).slice(-6);   // the turns before this question
  ASKLOG.push({me:1,t:q},{t:'\u2026thinking',wait:1});
  if(ASKIN)ASKIN.value='';
  paintAsk();
  let ans='';
  try{ans=await askAnswer(q,prior);}catch{ans='';}
  ASKLOG.pop();ASKLOG.push({t:ans||'Sorry, I could not answer that. Ask your Admin or Manager.'});
  ASKBUSY=false;paintAsk();
}

// Every completed sale is ONE append-only record, sales/{saleId} (saleId = the receipt number), kept by sales.js, the same
// file index.html loads. It is written to this phone's IndexedDB first, in one transaction together with its "still to

// to depots/<depot>/sales/<saleId> is create-only and idempotent, so it simply retries until it works. The same sync also
// downloads the other tills' sales. Stock on this screen = received - issued - sold + returns, worked out by Sales.stockBook
// (sales.js), the same function the main app uses, so both always show the same number.
// The sale is NOT written into DATA, so two tills selling at the same moment cannot overwrite each other.
// The app's date rule (the same as index.html's today()): the DEVICE's own calendar date, so on a phone set to Zambia time the day turns over at midnight there.
// It used to be the UTC date, which kept "today" on the previous day from 00:00 to 02:00.

// Step 33: the last Sales.ledgerPolicy().hotDays days are held as the real sales, older days as day totals (Sales.foldCold: one pseudo sale per day, till, shift and
// cashier, standing for n sales). Nothing is deleted. Credit and customer sales, discounts a person allowed, wholesale baskets and any sale a void / refund points at stay real.
// A sale of an older day is read from the phone by its receipt number when the refund screen asks for it (LEDGER.get).
const ledgerArgs=rets=>({today:localYMD(Date.now()),hotDays:Sales.ledgerPolicy(DATA&&DATA.depotInfo).hotDays,returns:rets});
async function loadSold(){
  await loadRets();                                      // step 19: voids and refunds are read with the sales: stock and the drawer need both. Read FIRST: a sale a return points at must stay a real record
  try{SALES_ALL=(await LEDGER.load(ledgerArgs(RETS_ALL))).list;SALES_PENDING=await LEDGER.pending();}

}
// Voids and refunds (roadmap step 19): their own append-only records, returns/{returnId}, kept by returns.js. Same rules as sales:
// saved on this phone first, uploaded when there is signal, the other tills' downloaded. See VOIDS AND REFUNDS further down.
const RETLG=Returns.create({
  depotKey:()=>DATA&&DATA.installId,

  if(SALES_ERR||SHIFT_ERR)setPill('p-sales','Sales: '+(SALES_ERR||SHIFT_ERR),'bad');
  else if(waiting)setPill('p-sales','Sales: '+waiting+(!navigator.onLine?' waiting for signal':(SALES_AUTH?' waiting (no cloud session)':' uploading')),'warn');

// Upload this till's sales, then fetch the others'. Safe to call as often as you like; one run at a time.
async function syncSales(){
  if(salesBusy||!navigator.onLine||!(DATA&&DATA.installId))return;
  salesBusy=true;
  try{
    const up=await LEDGER.push(CLOUD);
    SALES_AUTH=!!(up.left&&up.error==='NO_AUTH');
    SALES_ERR=(up.left&&up.error&&up.error!=='NETWORK'&&up.error!=='NO_AUTH')?'upload problem ('+up.error+')':'';
    let got=0;
    try{got=(await LEDGER.pull(CLOUD)).added;}catch(e){console.warn('Sales download failed',e);}
    // Step 19: voids and refunds go up AFTER the sales they point at (the database rules want the sale to be there first), then the other tills' come down.
    try{
      const ru=await RETLG.push(CLOUD);
      if(ru.left&&ru.error==='NO_AUTH')SALES_AUTH=true;
      if(!up.left&&ru.left&&ru.error&&ru.error!=='NETWORK'&&ru.error!=='NO_AUTH')SALES_ERR='refund upload problem ('+ru.error+')';
    }catch(e){console.warn('Returns upload failed',e);}
    try{got+=(await RETLG.pull(CLOUD)).added;}catch(e){console.warn('Returns download failed',e);}
    await loadSold();
    if(got&&GRID){loadCatalog();renderGrid();}
  }catch(e){console.warn('Sales sync failed',e);}
  finally{salesBusy=false;paintSales();}
}

  if(!hits.length&&cam){const alt=/^0\d{12}$/.test(v)?v.slice(1):(/^\d{12}$/.test(v)?'0'+v:'');if(alt)hits=scanHits(alt);}
  if(hits.length>1)return {err:'Two items have the code \u201c'+v+'\u201d: '+hits.slice(0,3).map(h=>h.i.name).join(', ')+(hits.length>3?', \u2026':'')+'. Nothing was added. Ask a manager to fix the barcode in the main app.',ms:7000};
  let hit=hits[0]?hits[0].i:null;const unit=hits[0]?hits[0].u:null;
  if(!hit&&!cam&&!looksLikeCode(v)){const r=matches(v);if(r.length===1)hit=r[0];}   // typing a name: one item left in the list
  const shown=cam&&v.length>40?v.slice(0,40)+'\u2026':v;
  if(!hit)return {err:(cam||looksLikeCode(v))?'No item has the code \u201c'+shown+'\u201d.':'No item matches \u201c'+v+'\u201d.'};
  if(!hit.price)return {err:hit.name+(isCashier()?' has no price yet. Ask your admin to set it.':' has no price yet. Set it in the main app under \uD83D\uDCB2 Prices.')};
  return {hit,unit};
}

// ── items pane
function tile(i){
  const b=el('button','tile','',{type:'button','data-id':i.id}),w=el('span','ti');   // w holds the contents (see .tile .ti)
  w.append(el('span','nm',(i.icon?i.icon+' ':'')+i.name));

  w.append(pr);
  let st,cls='st';
  if(!i.price){st='Not priced yet';}
  else if(i.ok<=0){st=i.xp&&i.xp.expired>0&&i.avail>0?'All expired':'Out of stock';cls+=' out';}      // step 30: stock that is past its date is not stock you can sell
  else if(i.min&&i.ok<=i.min){st=fq(i.ok)+' left';cls+=' low';}
  else st=fq(i.ok)+' in stock';

  }
  if(i.units&&i.price)w.append(el('span','alt',i.units.filter(u=>!u.isBase).map(u=>u.name+' \u00D7'+fq(u.factor)).join(' \u00B7 ')));   // step 26: it is also sold by the pack or carton
  const of=offerFor(i);if(of&&i.price)w.append(el('span','offer',of));      // step 25: a live offer covers this item
  if(i.price&&i.wprice>0&&levelPolicy().on)w.append(el('span','whl','Wholesale '+money(i.wprice)+(i.wmin>0?' from '+fq(i.wmin):'')));   // step 27

const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dShort=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(d||''));return m?(+m[3])+' '+MON[+m[2]-1]:String(d||'');};
// Step 30: the items in the cart that would have to be sold from stock that is past its date (an item with nothing past its date is never in this list).
function expiredInCart(){
  const out=[],seen=new Set();

    if(seen.has(l.id))return;seen.add(l.id);
    const it=BYID.get(l.id);
    if(it&&it.xp&&it.xp.expired>0&&inCartBase(l.id)>it.ok)out.push(it);
  });

}

// ── cart
// A line total is rounded to 2 decimals once, and the basket total is the sum of those rounded line totals,
// so the lines printed on the receipt always add up to the total printed under them.
// Step 18: lineTotal is a line's value BEFORE any discount; the basket's discount (DISC, below) is shared out over the lines in
// whole ngwee, and cartTotal() is what the customer pays after it. With no discount nothing differs from before.
const lineTotal=l=>Math.round(l.price*l.qty*100)/100;
// ── MULTIPLE UNITS (roadmap step 26) ──────────────────────────────────────────
// A cart line is in ONE unit: l.unit / l.price / l.qty are what the customer sees. A line in a pack or carton also has l.f (base units in one of
// it) and l.bu (the base unit's name); a base-unit line has neither. The same item in two units is two lines (lineKey tells them apart). Stock is
// always in the base unit: baseOf(l) = qty x f. Offers are worked on the base-unit equivalent of the line (see promoRes), so "3 for K20" means three
// singles whether they are scanned one by one or sold as a carton.
const lineF=l=>{const f=Number(l&&l.f);return f>0?f:1;};
const lineKey=l=>l.id+(lineF(l)!==1?'|'+String(l.unit||'').toUpperCase():'');
const baseOf=l=>Sales.baseQty({qty:l.qty,factor:lineF(l)});
const inCartBase=id=>Math.round(CART.reduce((a,l)=>l.id===id?a+baseOf(l):a,0)*1000)/1000;
const cartShape=l=>{const o={id:l.id,kind:l.kind||'item',name:l.name,unit:l.unit||'',per:l.per||'',price:lvRetail(l),qty:Number(l.qty)};if(lineF(l)!==1){o.f=lineF(l);o.bu=String(l.bu||'');}return o;};   // what a held basket / draft keeps
function unitFor(it,l){                          // the item's current unit that this line is in (null: the item has no such unit any more)
  if(!it)return null;
  if(lineF(l)===1)return it.units?it.units[0]:null;
  return it.units?it.units.find(u=>!u.isBase&&u.name.toUpperCase()===String(l.unit||'').toUpperCase())||null:null;
}
function putUnit(l,it,u){                        // make line l a line in unit u (price, label and size follow)
  if(u.isBase){l.unit=it.unit;l.per=it.per;l.price=it.price;l.rp=it.price;l.wp=it.wprice||0;delete l.f;delete l.bu;}
  else{l.unit=u.name;l.per=u.name;l.price=u.price;l.rp=u.price;l.wp=u.wprice||0;l.f=u.factor;l.bu=it.units[0].name;}
  l.wm=it.wmin||0;                               // step 27: the quantity (base units) from which the item is wholesale by itself
}
// Step 27: every cart line keeps its RETAIL price (rp), its WHOLESALE price (wp, 0 = none) and the item's wholesale quantity (wm). l.price is what one unit costs NOW: promoRes() works
// it out (Sales.levelApply) and writes it back, so the first thing every total does is ask promoRes(). A held basket or a draft keeps the retail price only.
const lvRetail=l=>Number(l.rp!=null?l.rp:l.price);
const cartGross=()=>{promoRes();return Math.round(CART.reduce((a,l)=>a+lineTotal(l),0)*100)/100;};
// ── PROMOTIONS (roadmap step 25) ───────────────────────────────────────────────
// Offers the Admin keeps in Settings -> Promotions (DATA.promotions: a percentage off, a special price, N for a price, buy N get M free; on items
// or categories, between dates, on chosen weekdays). They are applied by the till itself, line by line, by Sales.promoApply() (sales.js): each line
// gets the ONE offer that saves the customer most. The cashier does nothing; the cart shows the offer under the line, and what is saved is
// recorded on the sale (line.promoDiscount / promoId / promoName, header promoDiscount) as part of the discount. Nothing is stored in the cart:
// the offers are worked out again from the cart every time, so a held or restored basket gets today's offers, like today's prices.
// The clock: offers are judged at PNOW, set whenever the cart is redrawn and when Charge opens, so the total on the payment screen and the
// sale saved from it always agree. If an offer ends between the two, Charge redraws the cart and says so before any money is taken.
// A manual discount (step 18) is worked on the value AFTER the offers (grossLinesC), so the cashier's limit is a share of what the customer
// would otherwise pay.
let PNOW=Date.now(),PL_RAW=null,PL=[];
const promoClock=()=>{PNOW=Date.now();};
function promoList(){const raw=DATA&&DATA.promotions;if(raw!==PL_RAW){PL_RAW=raw;PL=Sales.promoList(raw);}return PL;}
// Step 27: the price of each line (retail, or wholesale when the basket is a wholesale basket or the item reached its wholesale quantity) is settled TOGETHER with the offers by
// Sales.levelApply(): a line gets the cheaper of its wholesale price and its retail price with the offer, never both. The result is written back onto the lines (l.price, l.lp, l.lv).
function promoRes(){
  if(!CART.length)return {lines:[],totalC:0};
  const r=Sales.levelApply(CART.map(l=>{const it=BYID.get(l.id);return {itemId:l.id,category:it?it.category:'',qty:l.qty,f:lineF(l),rp:lvRetail(l),wp:l.wp||0,wm:l.wm||0};}),
    {on:levelPolicy().on,level:LV?Sales.WHOLESALE:'retail',promos:promoList(),now:PNOW,money});
  r.lines.forEach((x,i)=>{const l=CART[i];l.price=x.price;l.lp=x.listPrice;if(x.level)l.lv=1;else delete l.lv;});
  return r;
}
// The tag on an item tile: the first live offer that covers the item, in words. Uses the real clock (the tile is not a sale).
function offerFor(i){
  const day=Sales.promoDay(Date.now()),p=promoList().find(x=>Sales.promoActive(x,day)&&Sales.promoMatches(x,{itemId:i.id,category:i.category}));
  return p?Sales.promoText(p,{money}):'';
}
const cartTotal=()=>(Math.round(cartGross()*100)-promoRes().totalC-discSplit().total)/100;   // cartGross() settles the prices first (step 27)

// ── BASKET: the cart frozen into one record = one receipt ─────────────────────
// This is the shape sales.js stores as sales/{saleId}: header + lines, with the selling price copied
// onto each line at the moment of sale (so editing a price later never changes an old receipt). receiptNo, tillId,
// till and seq are stamped when the sale is completed (step 8), and finalizeSale saves it (step 9).
function makeBasket(pay){
  const sp=discSplit(),pr=promoRes();
  const lines=CART.map((l,i)=>{
    const pc=pr.lines[i]?pr.lines[i].discC:0,dc=pc+sp.lines[i];      // step 25: what the offer took off + the manual share
    const o={itemId:l.id,kind:l.kind||'item',name:l.name,unit:l.unit,qty:l.qty,price:l.price,total:(toC(lineTotal(l))-dc)/100};
    if(lineF(l)!==1){o.factor=lineF(l);o.base=String(l.bu||'');}               // step 26: sold in a pack or carton
    if(l.lv){o.level=Sales.WHOLESALE;o.listPrice=l.lp;}   // step 27: sold at the wholesale price; price is what was charged, listPrice the retail price of the same unit
    if(dc>0)o.discount=dc/100;                         // step 18: line.total is AFTER the discount, line.discount is ALL that came off (offer and manual)
    if(pc>0){o.promoDiscount=pc/100;o.promoId=pr.lines[i].promo.id;o.promoName=pr.lines[i].promo.name;}   // step 25: the part that an offer gave
    return o;
  });
  const b=Object.assign({
    id:null,receiptNo:null,at:Date.now(),
    cashier:USER?String(USER.username):'',cashierRole:USER?String(USER.role||''):'',
    lines,lineCount:lines.length,
    qtyTotal:Math.round(lines.reduce((a,l)=>a+l.qty,0)*1000)/1000,
    total:Math.round(lines.reduce((a,l)=>a+Math.round(l.total*100),0))/100
  },pay||{});
  if(LV&&lines.some(l=>l.level)){b.priceLevel=Sales.WHOLESALE;b.priceLevelBy=LV.by;}   // step 27: the basket was chosen as a wholesale basket (and a line really got the lower price)
  if(pr.totalC+sp.total>0){                        // the same fields sales.js toRecord() writes, so the preview and the saved sale read alike
    b.discount=(pr.totalC+sp.total)/100;
    if(pr.totalC>0)b.promoDiscount=pr.totalC/100;
    if(sp.total>0&&DISC){b.discountBy=DISC.by||'';b.discountReason=DISC.reason||'';}
    else{b.discountBy=Sales.PROMO_BY;b.discountReason=Array.from(new Set(lines.filter(l=>l.promoName).map(l=>l.promoName))).join(', ').slice(0,60);}
  }
  return b;
}
// White text on the brand colour (initials box), or near-black when the colour is light, so a yellow or pale brand colour is still
// readable on paper. The same test picks the colour for the TOTAL and the PAID tag: the brand colour itself, or near-black if it is
// too light to read on white. Dark colours, including the default green, print exactly as before.
function brandLight(c){
  const m=/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(c||'');if(!m)return false;
  let h=m[1];if(h.length===3)h=h.replace(/./g,x=>x+x);
  const [r,g,b]=[0,2,4].map(i=>{const v=parseInt(h.substr(i,2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});
  return .2126*r+.7152*g+.0722*b>.35;
}
function paperTop(){                            // logo or initials, depot name, district, phone: the head of every printed paper

  if(brandLight(accent)){paper.style.setProperty('--ink','#111');paper.style.setProperty('--acct','#111');}
  if(typeof di.logoDataUrl==='string'&&di.logoDataUrl.startsWith('data:image/')){
    const im=el('img','logo','',{alt:(di.name||'')+' logo'});im.src=di.logoDataUrl;paper.append(im);
  }

  if(di.district)paper.append(el('div','c mu',di.district));
  if(di.contactPhone)paper.append(el('div','c mu','Tel: '+di.contactPhone));

}
function receiptEl(b,tag){

    const gross=b.lines.reduce((a,l)=>a+Math.round(l.price*l.qty*100),0)/100,dC=toC(b.discount),pC=Math.min(dC,toC(b.promoDiscount)),mC=dC-pC;

let ROVL=null,ROPENER=null,ROVL_SALE=false;
function showReceipt(b,tag,sale){          // sale=true: the receipt of a recorded sale; the cart is already empty then

// The page title becomes the file name when the cashier chooses "Save as PDF", so it carries the receipt number.
function printReceipt(b,tag,auto,kick){
  const pf=prefs();
  if(isThermal(pf)){try{thermal(escposReceipt(b,tag,pf,kick),pf,auto);}catch{say('Could not build the receipt for the printer.','bad');}return;}
  if(auto)return;                                  // the browser's print dialog is never opened by itself
  const t=document.title;

function hideReceipt(){

}
// ── PRINTER: built-in thermal printers on Android POS terminals ──────────────
// Step 35 added a third route, 'ble' (Bluetooth LE printer, direct, see BLUETOOTH PRINTER below). Receipts, void/refund slips and X/Z reports all go
// through thermal(): RawBT or Bluetooth, whichever this device chose. 'browser' still prints through the print dialog.
// Route per device (localStorage): 'browser' = the print dialog as before; 'rawbt' = ESC/POS bytes handed to the free RawBT app, which prints
// to the terminal's printer with no dialog, so a saved sale can print by itself. Chrome only allows that hand-off right after a tap, so
// auto-print runs straight after Charge; if it is ever blocked, the receipt stays on screen and Print still works.
// v0.3.108: the same two routes open a cash drawer (see CASH DRAWER below).
const PRK='mdm_till_printer';
function prefs(){let o=null;try{o=JSON.parse(localStorage.getItem(PRK)||'null');}catch{}return Object.assign({mode:'browser',cols:0,size:1,auto:false,bc:true,drawer:'off'},o||{});}
const asc=s=>String(s==null?'':s).replace(/[\u00a0\u202f\u2009]/g,' ').replace(/\u00d7/g,'x').replace(/[\u00b7\u2022]/g,'-').replace(/[\u2212\u2013\u2014]/g,'-').replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7e]/g,'?');
function escposReceipt(b,tag,pf,kick){
  const k=escposKit(pf),di=DATA.depotInfo||{};
  if(kick)k.kick();                                  // v0.3.108: the drawer opens as the receipt starts to print
  k.bd(1);k.hi(k.sz?k.SC:1);k.ctr(di.name||'Shop Inventory & Sales Manager');k.hi(k.SC);k.bd(0);
  if(di.district)k.ctr(di.district);
  if(di.contactPhone)k.ctr('Tel: '+di.contactPhone);
  if(tag==='TEST PRINT'){k.ln('123456789012345678901234567890123456789012345678');k.ln('Using '+k.W+' characters per line');}   // the ruler wraps where the paper ends: 32 = 58 mm, 48 = 80 mm
  k.dd();k.ttl('RECEIPT');k.dd();
  if(b.receiptNo)k.ctr('No. '+b.receiptNo);
  k.ctr(slipDt(b.at));if(b.cashier)k.ctr('Served by '+b.cashier);
  if(tag)k.ctr('['+tag+']');
  k.ln('');
  b.lines.forEach(l=>{k.item(lineLbl(l),k.col(Math.round(l.price*l.qty*100)/100));
    k.ln('  '+fq(l.qty)+' x '+num(l.price));                                          // v0.3.105: the unit price under each item
    if(l.promoDiscount>0)k.lr('  Offer: '+l.promoName,'-'+num(l.promoDiscount));

// A third way to print, beside the browser dialog and RawBT: the same ESC/POS bytes go straight to a Bluetooth LOW ENERGY thermal printer
// with Web Bluetooth, so no helper app is needed. It only works where the page runs in Chrome (the browser, or the Trusted Web Activity
// PWABuilder makes). A WebView app such as Median has no Web Bluetooth: use RawBT there. Many cheap 58 mm printers are Bluetooth CLASSIC
// (SPP), which Web Bluetooth cannot see: pair those in Android settings and use RawBT.
// Chrome shows its device chooser only after a tap, so the first connection is made from the Printer dialog (or from a Print button).
// The link then stays open while the page lives, and is re-opened without a tap if it drops. After a reload, getDevices() (where Chrome
// has it) finds the printer again; if not, one tap on Print connects it. Auto-print after a sale never opens the chooser: if the

const BLE_SVC=['0000ff00-0000-1000-8000-00805f9b34fb','0000ffe0-0000-1000-8000-00805f9b34fb','000018f0-0000-1000-8000-00805f9b34fb','49535343-fe7d-4ae5-8fa9-9fafd205e455','e7810a71-73ae-499d-8c15-faa9aef0c3f2','0000fee7-0000-1000-8000-00805f9b34fb','0000ae30-0000-1000-8000-00805f9b34fb'];

  for(const s of list){
    let cs;try{cs=await s.getCharacteristics();}catch{continue;}
    const c=cs.find(x=>x.properties.writeWithoutResponse)||cs.find(x=>x.properties.write);

async function bleAttach(dev){

async function bleConnect(pick){                        // pick=true: called from a tap, so Chrome may show its device chooser

async function bleWrite(c,u8){                          // small pieces: a printer's buffer is tiny. Too big for this printer: step down and retry the same bytes

    const sb=el('button','sm','Go to shift',{type:'button'});sb.style.cssText='margin:8px auto 0;display:block';sb.onclick=()=>{closePay();openShiftSheet();};F.append(sb);
  }

    F.append(el('div','pay-note','This till has no receipt code yet. It must go online once to get one. You can still run a practice sale.'));
    const rt=el('button','sm','Set up this till now',{type:'button'});rt.style.margin='8px auto 0';rt.style.display='block';rt.onclick=setupTill;F.append(rt);
  }

  if(S.over)msg='A payment is more than what is left to pay. Remove it and add it again.';
  else if(S.rem>0&&!PAY.onAccount)msg=money(fromC(S.rem))+' still to pay.';
  else if(S.rem>0&&!PAY.customer)msg='Choose the customer to put '+money(fromC(S.rem))+' on account.';

}
function completePay(){
  if(!PAY||FINALIZING)return;
  if(!reconcileLevel()||!reconcileDisc()){renderCart();renderPay();return;}   // step 18: the total changed; the payments entered stay, the screen is redrawn (step 27: the same for wholesale prices)
  const S=settle(toC(cartTotal()),PAY.tenders);
  if(!payReady(S))return;
  const cust=customers().find(c=>c.id===PAY.customer);
  finalizeSale(makeBasket({
    payments:PAY.tenders.map((t,i)=>({method:t.method,label:METHODS[t.method].label,amount:fromC(S.applied[i]),tendered:t.tendered,ref:t.ref||''})),
    amountPaid:fromC(S.paid),change:fromC(S.change),balance:fromC(S.rem),creditStatus:payStatus(S),
    customerId:cust?cust.id:'',customerName:cust?String(cust.name||''):'',practice:!!PAY.practice
  }));
}
// Step 8: the receipt number is taken HERE, once: Gate numbering saves the counter first and only then returns the number,
// so a crash leaves a gap but never a repeat. If the counter cannot be saved the sale is refused and the payment screen stays
// open with the payments as entered.
// Step 9: right after the number, the sale is appended to the ledger (sales.js): stored on this phone together with its
// "to upload" mark in ONE transaction. Only when that has succeeded does the cart empty, stock drop and the receipt show;
// if it fails nothing is recorded, the cart and the payments stay as they were, and the cashier can simply try again (the
// number already taken is skipped, which leaves a gap, never a repeat). A practice basket (practice:true) skips all of this.
// Step 16: the whole decision runs inside the shift lock (a second tab cannot close the shift between the check and the save). The
// sale is stamped with the shift it belongs to. No shift, or someone else's shift, and nothing is taken or recorded.
async function recordSale(b){
  const ck=clockStop('The sale was not completed.');if(ck)return {err:ck};
  const id=tillIdNow(),cur=id?await SHIFTLG.current(id):null;
  if(!cur)return {err:'No shift is open on this till. Open a shift, then try again. The sale was not completed.'};
  if(!sameUser(cur.open.cashier,USER&&USER.username))return {err:'The shift open on this till is '+cur.open.cashier+'\u2019s. It must be closed before you can sell. The sale was not completed.'};
  let r;
  try{r=await NUM.next();}
  catch(e){
    console.warn('Receipt number failed',e);
    return {err:NUM_MSG[e&&e.code]||'Could not take a receipt number. The sale was not completed. Try again.'};
  }
  b.receiptNo=r.receiptNo;b.tillId=r.tillId;b.till=r.code;b.seq=r.seq;b.shiftId=cur.open.shiftId;
  try{return {rec:await LEDGER.append(b)};}
  catch(e){
    console.warn('Sale not saved',e);
    return {err:(e&&e.code==='INVALID')?e.message+'. Nothing was recorded.':(SALE_MSG[e&&e.code]||'The sale could not be saved. Nothing was recorded. Try again.')};
  }
}
let FINALIZING=false,PAYERR='';
const NUM_MSG={
  NOT_REGISTERED:'This till has no receipt code yet. Go online once, then tap \u201cSet up this till now\u201d.',
  STORAGE:'This phone could not save the receipt counter (storage full or blocked). The sale was not completed. Free some space and try again.',
  LOCK:'Another till tab is busy. Wait a moment and try again.'
};
const SALE_MSG={
  STORAGE:'This phone could not save the sale (storage full or blocked). Nothing was recorded. Free some space and try again.',
  NO_DEPOT:'This till does not know its depot yet. Open the main app online once, then try again.',
  EXISTS:'That receipt number is already recorded. Nothing new was recorded. Try again.'
};
async function finalizeSale(b){
  if(FINALIZING)return;
  FINALIZING=true;PAYERR='';
  if(PAYOVL&&PAY)renderPayFoot(settle(toC(cartTotal()),PAY.tenders));
  try{
    if(b.practice){closePay();showReceipt(b,'PRACTICE \u2014 NOT A SALE');return;}
    if(isReadOnly()){PAYERR='The till is read-only right now. The sale was not completed.';return;}
    const out=await withShiftLock(()=>recordSale(b));   // step 16: shift check, receipt number and ledger append, one at a time
    if(out.err){PAYERR=out.err;return;}
    const rec=out.rec;
    // From here the sale exists. Take it out of stock, empty the cart, show the receipt, and upload if there is signal.
    SALES_ALL.push(rec);
    SALES_PENDING++;
    closePay();
    CART=[];renderCart();                          // renderCart also deletes the autosaved copy of this cart
    loadCatalog();renderGrid();paintSales();
    showReceipt(b,'',true);
    {const pf=prefs(),kick=drawerOn(pf)&&(b.payments||[]).some(x=>x.method==='cash'&&toC(x.tendered)>0);   // v0.3.108: cash in this sale: open the drawer
      if(pf.auto)printReceipt(b,'',true,kick);        // thermal auto-print: only in RawBT mode, see PRINTER below; the drawer pulse rides in the same job
      else if(kick)openDrawer();}
    say('Sale '+b.receiptNo+' saved','ok',3500);
    syncSales();
  }finally{
    FINALIZING=false;
    if(PAYOVL&&PAY)renderPayFoot(settle(toC(cartTotal()),PAY.tenders));
  }
}

function addItem(i,n,u){                         // u: the unit (from i.units) when a pack or carton barcode was scanned; omitted = the base unit
  u=u&&!u.isBase?u:null;

}
function setQty(key,q){                          // key: lineKey(line)

// Change a line to another unit of the same item (the quantity stays; price and size follow). A line already in that unit takes it over.
function setUnit(key,name){

// ── DISCOUNT (till roadmap step 18) ─────────────────────────────────────────────
// One discount for the whole basket, as a percentage or an amount, switched on by the Admin (Settings -> Till discounts; OFF by
// default). It is shared out over the lines in whole ngwee (Sales.discountSplit) and saved on the sale: each line's discount, the
// total, who allowed it and an optional reason. The rules are Sales.discountJudge(): a Cashier or Staff login may give up to the
// cashier limit alone; more, up to the maximum, needs a manager PIN (the same PIN pad as step 15; the approver is recorded); an
// Admin or Manager login gives up to the maximum alone; nobody gives more than the maximum. With no PIN set, a discount above the
// cashier limit simply cannot be approved. A PIN approves a percentage ceiling, so adding items keeps it; removing items so that the
// same amount becomes a larger share takes it off. The discount is checked again whenever the basket changes, when Charge opens and
// when payment completes. It is NOT kept when a sale is held, resumed from Held, or restored after a reload: it must be allowed again.
let DISC=null,DOVL=null;              // DISC: {kind:'pct'|'amt', value, reason, by (who allowed it), apBP (percentage a PIN approved, in basis points; 0 = none)}
const DISC_LOST='the discount was not kept, apply it again';
const discPolicy=()=>Sales.discountPolicy(DATA&&DATA.depotInfo);
const grossLinesC=()=>{const pr=promoRes();return CART.map((l,i)=>toC(lineTotal(l))-(pr.lines[i]?pr.lines[i].discC:0));};   // step 25: each line's value AFTER the offers, which is what a manual discount is a share of
function discSplit(){
  if(!DISC||!CART.length)return {lines:CART.map(()=>0),total:0};
  return Sales.discountSplit(grossLinesC(),DISC.kind,DISC.value);
}
// true when nothing changed; false when the discount had to come off (it says why).
function reconcileDisc(){
  if(!DISC)return true;
  if(!CART.length){DISC=null;return true;}
  const sp=discSplit();
  if(!(sp.total>0)){DISC=null;return true;}
  const j=Sales.discountJudge({grossC:grossLinesC().reduce((a,b)=>a+b,0),discC:sp.total,policy:discPolicy(),holder:isHolder(USER),apBP:DISC.apBP||0});
  if(j.ok)return true;
  DISC=null;
  say('The discount was taken off. '+(j.err||'It is now more than you may give without a manager PIN. Apply it again.'),'warn',7000);
  return false;
}
const approverName=w=>String(typeof w==='string'?w:(w&&(w.username||w.name))||'manager PIN').slice(0,80);

// ── WHOLESALE PRICES (till roadmap step 27) ─────────────────────────────────────
// The Admin sets a wholesale price per item (Price List and item details) and switches the feature on (Settings -> Wholesale prices; OFF by default). A line is sold at the wholesale
// price when (a) the basket is a wholesale basket, chosen here, or (b) the item's total in the basket reaches the item's own "wholesale from" quantity. (b) needs nobody's say-so: it is
// printed on the tile, and the cart tells the cashier what to add. (a) is a decision, so it is controlled like a discount: an Admin or Manager login makes a basket wholesale on its own;
// a Cashier or Staff login needs a manager PIN (or the Admin lets anyone do it); a WHOLESALE CUSTOMER (a contact the Admin marked wholesale) needs no PIN, and the basket then belongs to that
// customer (the payment screen starts with them and cannot change them). Who allowed it is saved on the sale. The prices and offers are settled together by Sales.levelApply().
// Like a discount it is NOT kept when a sale is held, resumed from Held, or restored after a reload: choose it again.
let LV=null,LOVL=null;               // LV: null = retail basket, otherwise { by: who allowed it, cust: the wholesale customer's id, or '' }
const LEVEL_LOST='the wholesale prices were not kept, choose them again';
const levelPolicy=()=>Sales.levelPolicy(DATA&&DATA.depotInfo);
const wholesaleCustomers=()=>customers().filter(c=>c.priceLevel==='wholesale');
// true when nothing changed; false when the basket had to go back to retail (it says why).
function reconcileLevel(){
  if(!LV)return true;
  if(!CART.length){LV=null;return true;}
  if(!levelPolicy().on){LV=null;say('Wholesale prices are switched off, so the sale is back at retail prices.','warn',7000);return false;}
  if(LV.cust&&!wholesaleCustomers().some(c=>c.id===LV.cust)){LV=null;say('That customer is not a wholesale customer any more, so the sale is back at retail prices.','warn',7000);return false;}
  return true;
}
function closeLevel(){if(!LOVL)return;LOVL.remove();LOVL=null;if(!COARSE)focusSearch();}
function openLevel(){
  if(LOVL||DOVL||PAYOVL||HOVL||PINOVL||SHOVL||MOVL||RPOVL||ROVL||CAMOVL||!CART.length)return;
  const pol=levelPolicy();
  if(!pol.on){say('Wholesale prices are not switched on for this depot.','bad');return;}
  if(isReadOnly()){say('The till is read-only right now.','bad');return;}

  if(!CART.some(l=>l.wp>0))body.append(el('div','pay-note','No item in this sale has a wholesale price, so nothing would change.'));
  const mt=el('div','methods');mt.style.gridTemplateColumns='1fr';
  const done=(msg)=>{closeLevel();renderCart();say(msg,'ok');};

  bW.onclick=()=>{
    if(alone){LV={by:String(USER.username).slice(0,80),cust:''};done('Wholesale prices.');return;}
    askManagerPin(who=>{const nm=approverName(who);LV={by:nm,cust:''};done('Wholesale prices allowed by '+nm+'.');},

      const b=el('button',LV&&LV.cust===c.id?'on':'',String(c.name||'')+(c.phone?' \u00B7 '+c.phone:''),{type:'button'});
      b.onclick=()=>{LV={by:('Customer: '+String(c.name||'')).slice(0,80),cust:c.id};done('Wholesale prices for '+String(c.name||'')+'.');};
      ct.append(b);
    });
    body.append(ct);
  }
  box.append(head,body);ovl.append(box);
  ovl.addEventListener('click',e=>{if(e.target===ovl)closeLevel();});
  document.body.append(ovl);LOVL=ovl;

// ── HELD / PARKED SALES (roadmap step 7) ─────────────────────────────────────
// "Hold sale" parks the cart so the next customer can be served; "Held (n)" beside the search box lists the parked
// baskets and brings one back. A held basket is NOT a sale: nothing is recorded, no stock moves and no receipt number
// is used until it is paid. Baskets are kept on THIS device (localStorage, one list per depot), so they survive a
// reload, a logout or an offline spell, and every till tab on the device sees the same list.
// Resuming moves the basket back into the cart. Whatever is in the cart at that moment is parked first, so nothing is
// lost, and prices are re-read from the Price List: a basket held this morning is sold at today's price, exactly as if
// its items were scanned now. Leaving the till (logout, idle timeout, signed out from another tab) with items in the
// cart parks them instead of throwing them away.
const HELD_MAX=20,HELD_OLD_MS=12*3600*1000;
const heldKey=()=>'mdm_pos_held_v1:'+((DATA&&DATA.installId)||'local');
const heldLineOk=l=>!!(l&&l.id&&Number(l.qty)>0&&Number.isFinite(Number(l.price)));
function readHeld(){
  try{
    const a=JSON.parse(localStorage.getItem(heldKey())||'[]');
    return (Array.isArray(a)?a:[]).filter(h=>h&&h.id&&Array.isArray(h.lines))
      .map(h=>Object.assign({},h,{lines:h.lines.filter(heldLineOk)})).filter(h=>h.lines.length);
  }catch{return [];}
}
function writeHeld(a){
  try{if(a.length)localStorage.setItem(heldKey(),JSON.stringify(a));else localStorage.removeItem(heldKey());return true;}
  catch{return false;}   // storage full or blocked: the caller keeps the cart as it is
}
const heldTotal=h=>Math.round(h.lines.reduce((a,l)=>a+lineTotal({price:Number(l.price),qty:Number(l.qty)}),0)*100)/100;
const cartAsHeld=()=>({
  id:'h_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),at:Date.now(),by:USER?String(USER.username):'',
  lines:CART.map(cartShape)
});
function ago(t){
  const m=Math.max(0,Math.round((Date.now()-t)/6e4));
  if(m<1)return 'just now';if(m<60)return m+' min ago';
  const h=Math.floor(m/60);if(h<24)return h+' h ago';
  const d=Math.floor(h/24);return d+(d===1?' day ago':' days ago');
}
function renderHeldBtn(){
  if(!HBTN)return;
  const n=readHeld().length;HBTN.hidden=!n;HBTN.textContent='Held ('+n+')';
}
// Returns true when the cart is empty afterwards (held, or there was nothing to hold).
function holdCart(quiet){
  if(!CART.length)return true;
  const a=readHeld();

// A shift is one cashier on this till: "Open shift" (the FLOAT, the cash already in the drawer) to "Close shift" (the cash COUNTED).
// Both are append-only records kept by shifts.js, uploaded like sales (shifts/{id}, shiftCloses/{id}). A real sale needs an open
// shift of the person logged in; every sale carries its shiftId. Expected cash = float + the CASH taken on that shift's sales
// (change already left out); the difference to the count is saved with the close. A practice sale needs no shift.
// One shift per till at a time. A shift left open (idle logout, phone put away) is still there at the next login: the same cashier
// carries on; anyone else must have an admin or manager close it first (they count the drawer; the record says it was forced).
// Opening and closing are checked under a lock together with taking a sale, so a second tab cannot sell into a shift that has
// just been closed. Cash out of the drawer during a shift (refunds: step 19; pay-outs are not built) goes in as `out`; shifts.js already
// takes it as `out`. X and Z reports (step 17) are further down, after renderShiftDone.
