<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#1A1A2E"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Till — Shop Inventory &amp; Sales Manager</title>
<link rel="manifest" href="manifest.json">
<!-- Same origin as index.html, so it shares localStorage, IndexedDB and the Firebase Auth session.
     CSP mirrors index.html minus what the till does not use. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' blob:; script-src 'self' 'unsafe-inline' https://www.google.com/recaptcha/ https://www.gstatic.com/; style-src 'self' 'unsafe-inline'; connect-src https://*.firebaseio.com https://firebaseinstallations.googleapis.com https://securetoken.googleapis.com https://identitytoolkit.googleapis.com https://firebaseappcheck.googleapis.com https://www.google.com/recaptcha/ https://recaptcha.google.com; img-src 'self' data: blob: https:; worker-src 'self' blob:; manifest-src 'self' blob:; frame-src https://www.google.com/recaptcha/ https://recaptcha.google.com; frame-ancestors 'none';">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#1A1A2E;--surface:#16213E;--border:#2C3E50;--text:#fff;--muted:#9aa5b8;--green:#00e096;--red:#ff6b6b;--amber:#ffb84d}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--border)}
header b{font-size:18px}header small{display:block;color:var(--muted);font-size:13px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--border);color:var(--muted)}
.pill.ok{color:var(--green);border-color:var(--green)}.pill.bad{color:var(--red);border-color:var(--red)}.pill.warn{color:var(--amber);border-color:var(--amber)}
main{max-width:560px;margin:0 auto;padding:28px 16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;text-align:center}
.card .ic{font-size:40px;margin-bottom:8px}.card h1{font-size:20px;margin-bottom:6px}.card p{color:var(--muted);margin-bottom:16px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button{font:inherit;font-weight:600;padding:11px 18px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer}
button.pri{background:var(--green);border-color:var(--green);color:#0a1628}

/* ── layout shell: header on top, the rest of the screen belongs to <main> ── */
[hidden]{display:none!important}
body{display:flex;flex-direction:column;height:100vh;height:100dvh}
main{width:100%}
header{flex:none}
header .hr{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:flex-end}
header .hb{display:flex;gap:6px}
button.sm{padding:5px 11px;font-size:13px;font-weight:600;border-radius:8px}
button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.pill{font-size:12px}

/* ── SELL SCREEN ─────────────────────────────────────────────────────────────
   Phone  (<768px): items fill the screen; the cart is a bottom sheet opened from a bar at the bottom.
   Tablet (>=768px): two panes, items on the left, cart on the right, always visible. */
main.on-sell{max-width:none;margin:0;padding:0;flex:1;min-height:0}
.sell{position:relative;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%;overflow:hidden}
.items{display:flex;flex-direction:column;min-height:0;min-width:0}

.searchbar{display:flex;gap:8px;padding:10px 12px 6px}
.searchbar input{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:2px solid var(--border);background:var(--surface);color:var(--text)}
.searchbar input:focus{outline:none;border-color:var(--green)}
.searchbar input::placeholder{color:var(--muted)}
#kb{display:none;min-width:48px;padding:0 12px;font-size:20px;line-height:1}
.msg{min-height:22px;padding:0 14px 4px;font-size:13px;color:var(--muted)}
.msg.ok{color:var(--green)}.msg.bad{color:var(--red)}

.grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:8px;align-content:start;padding:4px 12px 84px;overscroll-behavior:contain}
.grid .note{grid-column:1/-1;text-align:center;color:var(--muted);padding:28px 8px;font-size:14px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-height:96px;padding:10px 11px;text-align:left;font-weight:400;border-radius:12px;background:var(--surface);border:1px solid var(--border)}
.tile:active:not(:disabled){background:#1c2a4d}
.tile:disabled{opacity:.5;cursor:not-allowed}
.tile .nm{font-weight:600;font-size:15px;line-height:1.25;overflow-wrap:anywhere;padding-right:20px}
.tile .pr{color:var(--green);font-weight:700;font-size:15px}
.tile .pr small{color:var(--muted);font-weight:400;font-size:12px;margin-left:4px}
.tile .st{font-size:12px;color:var(--muted)}
.tile .st.low{color:var(--amber)}.tile .st.out{color:var(--red)}
.tile .inc{position:absolute;top:7px;right:7px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--green);color:#0a1628;font-size:12px;font-weight:700;line-height:22px;text-align:center}

.cartbar{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:14px 16px;border:0;border-top:1px solid var(--border);border-radius:0;background:var(--surface);font-size:16px;text-align:left}
.cartbar .cb-main{display:flex;flex-direction:column;line-height:1.25}
.cartbar .cb-main small{color:var(--muted);font-weight:400;font-size:13px}
.cartbar .cb-tot{font-weight:700;color:var(--green)}
.cartbar.has .cb-go{color:var(--green)}
.cartbar .cb-go{font-size:14px}

.scrim{position:absolute;inset:0;z-index:25;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s}
.sell.open .scrim{opacity:1;pointer-events:auto}

.cart{position:absolute;left:0;right:0;bottom:0;z-index:30;display:flex;flex-direction:column;height:84%;background:var(--surface);border-top:1px solid var(--border);border-radius:18px 18px 0 0;transform:translateY(100%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s}
.sell.open .cart{transform:none;visibility:visible;transition:transform .22s ease}
.grab{flex:none;display:block;width:100%;padding:8px 0 2px;border:0;background:transparent}
.grab i{display:block;width:44px;height:5px;margin:0 auto;border-radius:3px;background:var(--border)}
.cart-h{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 14px 10px;border-bottom:1px solid var(--border)}
.cart-h h2{font-size:17px}
.cart-h .acts{display:flex;gap:6px}
.lines{flex:1;min-height:0;overflow-y:auto;padding:4px 14px;overscroll-behavior:contain}
.lines .empty{text-align:center;color:var(--muted);padding:36px 12px;font-size:14px}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 0;border-bottom:1px solid var(--border)}
.line .ln{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.line .lt{font-weight:700;text-align:right}
.line .lp{color:var(--muted);font-size:13px;align-self:center}
.line .lw{grid-column:1/-1;font-size:12px;color:var(--amber)}
.qty{display:flex;align-items:center;gap:4px;justify-self:end}
.qty button{width:40px;height:40px;padding:0;font-size:20px;line-height:1;border-radius:10px}
.qty input{width:58px;height:40px;text-align:center;font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);padding:0 2px}
.cart-f{flex:none;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border)}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;color:var(--muted);margin-bottom:10px}
.tot b{font-size:24px;color:var(--text)}
.cart-f .pri{width:100%;padding:14px 18px;font-size:17px}
.cart-f .pri:disabled{opacity:.45;cursor:not-allowed}
.cart-f .hint{margin-top:8px;text-align:center;font-size:12px;color:var(--muted)}

@media (min-width:768px){
  .sell{grid-template-columns:minmax(0,1fr) 380px}
  .grid{padding-bottom:12px}
  .cartbar,.scrim,.grab,.cart-h .x{display:none}
  .cart{position:static;z-index:auto;height:auto;transform:none;visibility:visible;border-radius:0;border-top:0;border-left:1px solid var(--border);transition:none}
  .cart-h{padding-top:12px}
}
@media (max-width:767px){
  header{flex-wrap:wrap;gap:6px 8px;padding:8px 12px}
  header b{font-size:17px}header small{display:none}
  header .hr{display:contents}
  header>div:first-child{flex:1;min-width:0}
  header .hb{order:2}
  /* status pills: one row you can swipe sideways (was overflow:hidden, so the last pills were cut off and could not be reached) */
  header .pills{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;touch-action:pan-x;scrollbar-width:none;gap:5px;padding-bottom:2px}
  header .pills::-webkit-scrollbar{display:none}
  .pill{font-size:11px;padding:2px 8px;white-space:nowrap;flex:0 0 auto}
  header .pills .pill:last-child{margin-right:12px}
}
@media (prefers-reduced-motion:reduce){.cart,.scrim{transition:none!important}}

/* line remove button, secondary button in the cart footer */
.line .lt{display:flex;align-items:center;justify-content:flex-end;gap:4px}
.line .rm{width:34px;height:34px;padding:0;border-radius:8px;border-color:transparent;color:var(--muted);font-size:15px;line-height:1}
.cart-f .sec{width:100%;margin-bottom:8px;padding:10px 16px;font-size:15px}
.cart-f .sec:disabled{opacity:.45;cursor:not-allowed}

/* ── RECEIPT PREVIEW: one paper receipt for the whole basket ── */
.rovl{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;background:rgba(0,0,0,.72);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.rscroll{flex:1;min-height:0;width:100%;overflow-y:auto;padding:16px 12px}
.rbar{flex:none;display:flex;gap:10px;justify-content:center;width:100%;padding:10px 14px;background:var(--surface);border-top:1px solid var(--border)}
.rbar button{flex:1;max-width:200px}
.paper{--acc:#1E8449;max-width:320px;margin:0 auto;padding:20px 18px;background:#fff;color:#111;font:14px/1.4 Arial,Helvetica,sans-serif;border-radius:6px}
.paper .c{text-align:center}.paper .mu{color:#777;font-size:12px}.paper .b{font-weight:700}
.paper .logo{display:block;margin:0 auto 6px;height:56px;max-width:140px;object-fit:contain}
.paper .ini{display:flex;align-items:center;justify-content:center;width:56px;height:56px;margin:0 auto 6px;border-radius:10px;background:var(--acc);color:var(--ink,#fff);font-size:17px;font-weight:900}
.paper .dep{font-size:18px;font-weight:800;margin-bottom:2px}
.paper .rule{border:0;border-top:2.5px solid var(--acc);margin:10px 0}
.paper .dash{border:0;border-top:1px dashed #bbb;margin:10px 0}
.paper .tag{display:inline-block;margin:6px 0 2px;padding:2px 10px;border:1.5px solid #c0392b;border-radius:6px;color:#c0392b;font-weight:700;font-size:12px}
.paper .tag.paid{border-color:var(--acct,var(--acc));color:var(--acct,var(--acc))}
.paper table{width:100%;border-collapse:collapse}
.paper td{padding:3px 0;vertical-align:top}
.paper td.r{text-align:right;white-space:nowrap}
.paper .ln td{padding-top:7px}
.paper .gt td{font-size:18px;font-weight:800;padding-top:4px}
.paper .gt td.r{color:var(--acct,var(--acc))}
.paper .ft{margin-top:12px;text-align:center;font-size:11px;color:#999}
.paper .sec{margin:10px 0 3px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#555}
.paper .sig{display:flex;gap:16px;margin-top:26px;font-size:11px;color:#777}.paper .sig span{flex:1;border-top:1px solid #999;padding-top:3px}
.paper .tag+.tag{margin-left:6px}
@page{margin:0}                                  /* no browser header/footer (URL, date) on the printout; the receipt carries its own padding */
@media print{
  body>*:not(.rovl){display:none!important}
  body{display:block;height:auto;background:#fff;padding:0}
  .rovl{position:static;display:block;background:none;padding:0}
  .rscroll{overflow:visible;padding:0}
  .rbar{display:none!important}
  .paper{border-radius:0;padding:5mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .paper{font-size:13px;line-height:1.3}
  .paper td{padding:2px 0}.paper .ln td{padding-top:5px}.paper .dash,.paper .rule{margin:7px 0}
  .paper tr,.paper tbody,.paper .tail{break-inside:avoid}            /* a long basket breaks between items, never through one; the totals block stays whole */
}

/* ── PAYMENT SCREEN (roadmap step 6) ── */
.povl{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.72);padding:env(safe-area-inset-top,0) 0 0}
.pay{width:100%;max-width:520px;max-height:100%;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:18px 18px 0 0}
@media (min-width:768px){.povl{align-items:center;padding:16px}.pay{border-radius:18px;max-height:94%}}
.pay-h{flex:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px 8px}
.pay-h h2{font-size:17px}
.pay-body{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 12px;overscroll-behavior:contain}
.pay-due{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;color:var(--muted)}
.pay-due b{font-size:26px;color:var(--text)}
.tl .t{display:grid;grid-template-columns:1fr auto auto;gap:2px 8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.tl .t small{grid-column:1/-1;color:var(--muted);font-size:12px}
.tl .rm{width:34px;height:34px;padding:0;border-radius:8px;border-color:transparent;color:var(--muted);font-size:15px;line-height:1}
.pay-sum{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:15px;padding:10px 0;margin:6px 0 10px;border-bottom:1px solid var(--border)}
.pay-sum .r{text-align:right;font-weight:700}
.pay-sum .amb{color:var(--amber)}.pay-sum .ok,.pay-sum .chg{color:var(--green)}
.pay-sum .chg{font-size:20px}
.methods{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 10px}
.methods button{padding:10px 2px;font-size:13px;border-radius:10px}
.methods button.on{background:var(--green);border-color:var(--green);color:#0a1628}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.fld input,.fld select{width:100%;font:inherit;font-size:17px;padding:11px 12px;border-radius:10px;border:2px solid var(--border);background:var(--bg);color:var(--text)}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--green)}
.pay-hint{min-height:18px;margin:-4px 0 8px;font-size:13px;color:var(--muted)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.quick button{padding:8px 14px;font-size:14px;border-radius:8px}
.pay-err{min-height:18px;margin-bottom:4px;font-size:13px;color:var(--red)}
.pay .add{width:100%;padding:12px 16px;margin-bottom:12px}
.pay .acct{width:100%;margin-bottom:10px;padding:10px 14px;font-size:14px}
.pay .acct.on{border-color:var(--amber);color:var(--amber)}
.pay-f{flex:none;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border)}
.pay-f .pri{width:100%;padding:14px 18px;font-size:17px}
.pay-f .pri:disabled{opacity:.45;cursor:not-allowed}
.pay-note{margin-top:8px;text-align:center;font-size:12px;color:var(--amber)}
.pay-note.mu{color:var(--muted)}

/* ── HELD / PARKED SALES (roadmap step 7) ── */
.msg.warn{color:var(--amber)}
.statrow{display:flex;align-items:flex-start;gap:8px}
.statrow .msg{flex:1;min-width:0}
#hb{flex:none;margin:0 12px 6px 0;padding:7px 12px;white-space:nowrap;border-color:var(--amber);color:var(--amber)}
.cart-f .sec-row{display:flex;gap:8px;margin-bottom:8px}
.cart-f .sec-row .sec{flex:1;width:auto;margin:0;padding:10px 8px}
.drow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;font-size:14px}
.drow[hidden]{display:none}
.drow .dv{color:var(--amber);font-weight:700;text-align:right}
.dchips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.dchips button{padding:8px 14px;font-size:14px;border-radius:10px}
.dstat{margin:6px 0 4px;font-size:13px;text-align:center;line-height:1.45;min-height:19px}
.dstat.ok{color:var(--green)}.dstat.pin{color:var(--amber)}.dstat.no{color:var(--red)}
.pay-body.held-body{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.held{padding:12px 0;border-bottom:1px solid var(--border)}
.held:last-child{border-bottom:0}
.h-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.h-top .ag{margin-left:6px;font-size:13px;color:var(--muted)}
.h-top .ag.old{color:var(--amber)}
.h-sub{margin:3px 0 10px;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.h-acts{display:flex;gap:8px}
.h-acts .pri{flex:1;padding:10px 16px}
.h-acts button:not(.pri){padding:10px 16px}
.h-empty{text-align:center;color:var(--muted);padding:28px 8px;font-size:14px}

/* ── CAMERA SCANNER (roadmap step 12) ── */
#cam{min-width:48px;padding:0 12px;font-size:20px;line-height:1}
.sovl{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;background:#000;color:#fff}
.sovl video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.sovl .sh{position:relative;z-index:2;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 28px;background:linear-gradient(#000c,#0000)}
.sovl .sh b{font-size:17px}
.sovl .aim{position:absolute;z-index:1;left:50%;top:46%;width:min(80vw,440px);height:min(38vw,170px);min-height:110px;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 100vmax rgba(0,0,0,.42);pointer-events:none;transition:border-color .15s}
.sovl .aim.ok{border-color:var(--green)}.sovl .aim.bad{border-color:var(--red)}.sovl .aim.warn{border-color:var(--amber)}
.sovl .sf{position:relative;z-index:2;margin-top:auto;padding:28px 14px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(#0000,#000d)}
.sovl .sst{min-height:50px;text-align:center;font-size:17px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.sovl .sst.ok{color:var(--green)}.sovl .sst.bad{color:var(--red)}.sovl .sst.warn{color:var(--amber)}
.sovl .ssum{margin:2px 0 12px;text-align:center;font-size:14px;color:#cfd6e4}
.sovl .sbtn{display:flex;gap:10px}
.sovl .sbtn button{flex:1;padding:14px 16px;font-size:16px;background:rgba(0,0,0,.55)}
.sovl .sbtn button.pri{background:var(--green)}
.sovl .sbtn button.on{border-color:var(--amber);color:var(--amber)}
button[hidden]{display:none!important}

/* ── SHIFTS (roadmap step 16) ── */
.pay-sum .bad{color:var(--red)}
.shv{min-height:22px;margin:-2px 0 10px;font-size:16px;font-weight:700}
.shv.ok{color:var(--green)}.shv.bad{color:var(--red)}.shv.warn{color:var(--amber)}
.shbtns{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.shbtns button{width:100%;padding:12px 16px}
/* ── RETURNS (roadmap step 19) ── */
.rt-chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.rt-chips button{padding:7px 12px;font-size:13px;border-radius:999px}
.rt-chips button.on{background:var(--green);border-color:var(--green);color:#0a1628}
.rt-line .rt-q{display:flex;gap:8px;align-items:center;margin:2px 0 4px}
.rt-line .rt-q input{width:96px;font:inherit;font-size:17px;padding:8px 10px;border-radius:10px;border:2px solid var(--border);background:var(--bg);color:var(--text)}
.rt-line .rt-q button{padding:8px 12px;font-size:14px}
.rt-line.gone{opacity:.55}
.rt-m{display:grid;grid-template-columns:96px 1fr;gap:6px 8px;align-items:center;margin-bottom:8px;font-size:14px}

// Firebase Auth: same init as index.html, so the persisted session (IndexedDB) is restored here too.
// START-UP ORDER: the three SDK tags above are `defer`red, which runs them AFTER the page has been parsed. An inline
// script ignores `defer` and runs while parsing, i.e. BEFORE the SDK exists, so initialising right here threw
// "firebase is not defined" (swallowed by the catch below) and Firebase was never started: App Check was never
// activated and POS.idToken() always returned null. So the init waits for DOMContentLoaded, which fires after every
// deferred script has run (or failed). The page still paints without waiting for the SDK; if it cannot load at all
// (offline, blocked) the same catch resolves the promise and the till carries on without a cloud session.
window._fbAuthSdkReady=new Promise(function(resolve){
  function init(){
    try{
      firebase.initializeApp(FB_CONFIG);
      try{firebase.appCheck().activate(APP_CHECK_KEY,true);}catch(e){console.warn('App Check activation failed',e);}
      let done=false;const fin=()=>{if(!done){done=true;resolve();}};
      firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
      const un=firebase.auth().onAuthStateChanged(()=>{un();fin();},()=>{un();fin();});
      setTimeout(fin,4000);
    }catch(e){console.warn('Firebase Auth SDK init failed',e);resolve();}

});

async function hmac256(key,data){
  try{
    const enc=new TextEncoder();
    const k=await crypto.subtle.importKey('raw',enc.encode(key),{name:'HMAC',hash:'SHA-256'},false,['sign']);
    const sig=await crypto.subtle.sign('HMAC',k,enc.encode(data));
    return Array.from(new Uint8Array(sig)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch{return '';}   // no crypto.subtle: signature can't match, so the till stays locked (fail closed)
}

// ── DATA: newest of localStorage / IndexedDB, as index.html does ───────────
function idbData(){
  return new Promise(res=>{
    try{
      const q=indexedDB.open('mdm_db',1);
      q.onerror=()=>res(null);
      q.onsuccess=()=>{try{
        const g=q.result.transaction('depot_data','readonly').objectStore('depot_data').get('main');
        g.onsuccess=()=>res(g.result||null);g.onerror=()=>res(null);
      }catch{res(null);}};
    }catch{res(null);}
  });
}
async function loadData(){
  let ls=null;try{ls=JSON.parse(localStorage.getItem(DATA_LK)||'null');}catch{}
  const db=await idbData();
  if(ls&&db)return (db._v||0)>(ls._v||0)?db:ls;
  return ls||db;
}

// ── RECONNECT CLOUD ─────────────────────────────────────────────────────────────
// A till has no cloud session when its login was a fingerprint / "stay signed in" / offline one (only a typed password can sign in
// to Firebase) or after a logout (logout signs the SDK out). Without a session, sales cannot upload. Tapping the red pill asks for

const AUTH_DOMAIN='mdm-depot.internal';            // same synthetic e-mail domain as index.html (_authEmailFor)
let CLOUDOVL=null;
function closeCloud(){if(CLOUDOVL){CLOUDOVL.remove();CLOUDOVL=null;}}
function reconnectCloud(){
  if(CLOUDOVL||!USER)return;
  const ovl=el('div','povl','',{role:'dialog','aria-modal':'true','aria-label':'Reconnect cloud'});

// All the rules live in gate.js (Gate.receiptNumbering), the same code index.html runs, so both pages use ONE counter

const CLOUD=Gate.restCloud({
  dbUrl:FB_CONFIG.databaseURL,

// ── SALES LEDGER (roadmap step 9) ────────────────────────────────────────────
// Every completed sale is ONE append-only record, sales/{saleId} (saleId = the receipt number), kept by sales.js, the same
// file index.html loads. It is written to this phone's IndexedDB first, in one transaction together with its "still to
// upload" mark, and only then is the receipt shown: a sale is never lost to a dropped signal or a dead battery. Uploading
// to depots/<depot>/sales/<saleId> is create-only and idempotent, so it simply retries until it works. The same sync also
// downloads the other tills' sales. Stock on this screen = received - issued - sold + returns, worked out by Sales.stockBook
// (sales.js), the same function the main app uses, so both always show the same number.
// The sale is NOT written into DATA, so two tills selling at the same moment cannot overwrite each other.
const LEDGER=Sales.create({
  depotKey:()=>DATA&&DATA.installId,
  opts:{dateOf:t=>new Date(t).toISOString().slice(0,10)},   // the date rule index.html's today() uses, so Sales History agrees
  adapter:Sales.idbAdapter()
});
let SALES_ALL=[],SALES_PENDING=0,SALES_ERR='',SALES_AUTH=false,salesBusy=false;   // SALES_ALL: every sale record on this phone (own + downloaded)
async function loadSold(){
  try{SALES_ALL=await LEDGER.all();SALES_PENDING=await LEDGER.pending();}
  catch(e){console.warn('Could not read the sales ledger',e);}
  await loadRets();                                      // step 19: voids and refunds are read with the sales: stock and the drawer need both
}
// Voids and refunds (roadmap step 19): their own append-only records, returns/{returnId}, kept by returns.js. Same rules as sales:
// saved on this phone first, uploaded when there is signal, the other tills' downloaded. See VOIDS AND REFUNDS further down.
const RETLG=Returns.create({
  depotKey:()=>DATA&&DATA.installId,
  opts:{dateOf:t=>new Date(t).toISOString().slice(0,10)},   // the same date rule as the sales ledger
  adapter:Returns.idbAdapter()
});
let RETS_ALL=[],RETS_PENDING=0;
async function loadRets(){
  try{RETS_ALL=await RETLG.all();RETS_PENDING=await RETLG.pending();}
  catch(e){console.warn('Could not read the returns ledger',e);}
}
function paintSales(){
  const waiting=SALES_PENDING+SHIFTS_PENDING+RETS_PENDING;   // shift records (step 16) and voids/refunds (step 19) go up the same way, so they count here too
  if(SALES_ERR||SHIFT_ERR)setPill('p-sales','Sales: '+(SALES_ERR||SHIFT_ERR),'bad');
  else if(waiting)setPill('p-sales','Sales: '+waiting+(!navigator.onLine?' waiting for signal':(SALES_AUTH?' waiting (no cloud session)':' uploading')),'warn');
  else setPill('p-sales','Sales: all uploaded','ok');
}
// Upload this till's sales, then fetch the others'. Safe to call as often as you like; one run at a time.
async function syncSales(){
  if(salesBusy||!navigator.onLine||!(DATA&&DATA.installId))return;
  salesBusy=true;
  try{
    const up=await LEDGER.push(CLOUD);
    SALES_AUTH=!!(up.left&&up.error==='NO_AUTH');
    SALES_ERR=(up.left&&up.error&&up.error!=='NETWORK'&&up.error!=='NO_AUTH')?'upload problem ('+up.error+')':'';
    let got=0;
    try{got=(await LEDGER.pull(CLOUD)).added;}catch(e){console.warn('Sales download failed',e);}
    // Step 19: voids and refunds go up AFTER the sales they point at (the database rules want the sale to be there first), then the other tills' come down.
    try{
      const ru=await RETLG.push(CLOUD);
      if(ru.left&&ru.error==='NO_AUTH')SALES_AUTH=true;
      if(!up.left&&ru.left&&ru.error&&ru.error!=='NETWORK'&&ru.error!=='NO_AUTH')SALES_ERR='refund upload problem ('+ru.error+')';
    }catch(e){console.warn('Returns upload failed',e);}
    try{got+=(await RETLG.pull(CLOUD)).added;}catch(e){console.warn('Returns download failed',e);}
    await loadSold();
    if(got&&GRID){loadCatalog();renderGrid();}
  }catch(e){console.warn('Sales sync failed',e);}
  finally{salesBusy=false;paintSales();}
}

function legacyId(name){
  const s=String(name||'').trim().toUpperCase();let h=2166136261;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}

}

// Commodities (DATA.commodities) are sold from the till too. They are not in the item master, so: stock = approved
// received minus approved issued, summed over ALL batches of that commodity; price = the selling price set for it in
// the main app's Price List (💲 Prices) — DATA.commodities[i].sellingPrice. No price set = not sellable yet.
// The id is prefixed 'com:' so it can never clash with an item id.
function commodityItems(){
  const cr=DATA.commodityReceived||{},ci=DATA.commodityIssued||{};
  return (DATA.commodities||[]).filter(c=>c&&c.id&&c.name).map(c=>{
    let rec=cr[c.id]||[],iss=ci[c.id]||[];
    if(c.id==='maize'){                         // old maize-only arrays, until the main app has migrated them
      if(!rec.length)rec=DATA.maizeReceived||[];
      if(!iss.length)iss=DATA.maizeIssued||[];
    }
    const key='com:'+c.id;      // received - issued - sold + returns, by the shared formula (rows flagged _sale are skipped there, sales are read from the ledger)
    const avail=Sales.stockBook({received:rec,issued:iss,sales:SALES_ALL,returns:Returns.forStock(RETS_ALL)},{keyOf:()=>key,only:key}).get(key).bal;
    const unit=String(c.unit||'');
    const o={
      id:'com:'+c.id,kind:'commodity',icon:String(c.icon||''),name:String(c.name),sku:'',barcode:'',
      unit,per:/.s$/i.test(unit)?unit.slice(0,-1):unit,   // "bags" -> price shown "per bag"
      category:'Commodity',min:0,price:Number(c.sellingPrice)||0,avail
    };
    o.hay=(o.name+' commodity '+unit).toLowerCase();
    return o;
  });

function loadCatalog(){

  const prices=DATA.inventoryPrices||{};
  const general=items.map(x=>{
    const o={
      id:x.id||legacyId(x.name),kind:'item',name:String(x.name),sku:String(x.sku||''),barcode:String(x.barcode||''),
      unit:String(x.unit||''),per:String(x.unit||''),category:String(x.category||''),min:Number(x.minStock)||0,
      price:Number((prices[x.name]||{}).sellingPrice)||0,
      avail:book.get(x.id||legacyId(x.name)).bal
    };
    o.hay=(o.name+' '+o.sku+' '+o.barcode+' '+o.category).toLowerCase();
    return o;
  });
  ITEMS=general.concat(commodityItems()).sort((a,b)=>a.name.localeCompare(b.name));
  BYID=new Map(ITEMS.map(i=>[i.id,i]));
}
function matches(q){
  const t=String(q||'').trim().toLowerCase().split(/\s+/).filter(Boolean);
  return t.length?ITEMS.filter(i=>t.every(w=>i.hay.includes(w))):ITEMS;
}
// A scan is EXACT: every item whose barcode or SKU equals the code (case-insensitive). No partial matching, so an unknown
// code can never turn into some other item. More than one hit means two items share a code: nothing is added.
function scanMatches(q){
  const c=String(q||'').trim().toLowerCase();if(!c)return [];
  return ITEMS.filter(i=>(i.barcode&&i.barcode.toLowerCase()===c)||(i.sku&&i.sku.toLowerCase()===c));
}
// A value with no space in it and a digit somewhere (4006381333931, SB-001) is a code, a scan or a typed SKU, never a name:
// it must match a barcode or SKU exactly. Only words (sugar, coke 500) may fall back to the one-item-left search.
function looksLikeCode(v){return !/\s/.test(v)&&/\d/.test(v);}
function say(text,cls,ms){
  MSG.textContent=text||'';MSG.className='msg'+(cls?' '+cls:'');
  clearTimeout(msgT);if(text)msgT=setTimeout(()=>{MSG.textContent='';MSG.className='msg';},ms||2600);
}
function focusSearch(){try{Q.focus({preventScroll:true});}catch{Q.focus();}}

// One code -> one item, or the reason it cannot be added. Used by the scan box (Enter) and by the camera, so both follow the
// same rule: exact barcode or SKU, never a guess. {camera:true}: the value always came from a barcode, so the typing search is
// off, and a 13-digit read starting with 0 also matches the same product stored as a 12-digit UPC-A (and the other way round).
function resolveCode(v,o){
  const cam=!!(o&&o.camera);
  let hits=scanMatches(v);
  if(!hits.length&&cam){const alt=/^0\d{12}$/.test(v)?v.slice(1):(/^\d{12}$/.test(v)?'0'+v:'');if(alt)hits=scanMatches(alt);}
  if(hits.length>1)return {err:'Two items have the code \u201c'+v+'\u201d: '+hits.slice(0,3).map(h=>h.name).join(', ')+(hits.length>3?', \u2026':'')+'. Nothing was added. Ask a manager to fix the barcode in the main app.',ms:7000};
  let hit=hits[0]||null;
  if(!hit&&!cam&&!looksLikeCode(v)){const r=matches(v);if(r.length===1)hit=r[0];}   // typing a name: one item left in the list
  const shown=cam&&v.length>40?v.slice(0,40)+'\u2026':v;
  if(!hit)return {err:(cam||looksLikeCode(v))?'No item has the code \u201c'+shown+'\u201d.':'No item matches \u201c'+v+'\u201d.'};
  if(!hit.price)return {err:hit.name+(isCashier()?' has no price yet. Ask your admin to set it.':' has no price yet. Set it in the main app under \uD83D\uDCB2 Prices.')};
  return {hit};
}

// ── cart
// A line total is rounded to 2 decimals once, and the basket total is the sum of those rounded line totals,
// so the lines printed on the receipt always add up to the total printed under them.
// Step 18: lineTotal is a line's value BEFORE any discount; the basket's discount (DISC, below) is shared out over the lines in
// whole ngwee, and cartTotal() is what the customer pays after it. With no discount nothing differs from before.
const lineTotal=l=>Math.round(l.price*l.qty*100)/100;
const cartGross=()=>Math.round(CART.reduce((a,l)=>a+lineTotal(l),0)*100)/100;
const cartTotal=()=>(Math.round(cartGross()*100)-discSplit().total)/100;

// ── BASKET: the cart frozen into one record = one receipt ─────────────────────
// This is the shape sales.js stores as sales/{saleId}: header + lines, with the selling price copied
// onto each line at the moment of sale (so editing a price later never changes an old receipt). receiptNo, tillId,
// till and seq are stamped when the sale is completed (step 8), and finalizeSale saves it (step 9).
function makeBasket(pay){
  const sp=discSplit();
  const lines=CART.map((l,i)=>{
    const o={itemId:l.id,kind:l.kind||'item',name:l.name,unit:l.unit,qty:l.qty,price:l.price,total:(toC(lineTotal(l))-sp.lines[i])/100};
    if(sp.lines[i]>0)o.discount=sp.lines[i]/100;       // step 18: line.total is AFTER the discount, line.discount is what came off
    return o;
  });
  const b=Object.assign({
    id:null,receiptNo:null,at:Date.now(),
    cashier:USER?String(USER.username):'',cashierRole:USER?String(USER.role||''):'',
    lines,lineCount:lines.length,
    qtyTotal:Math.round(lines.reduce((a,l)=>a+l.qty,0)*1000)/1000,
    total:Math.round(lines.reduce((a,l)=>a+Math.round(l.total*100),0))/100
  },pay||{});
  if(sp.total>0&&DISC){b.discount=sp.total/100;b.discountBy=DISC.by||'';b.discountReason=DISC.reason||'';}
  return b;
}
// White text on the brand colour (initials box), or near-black when the colour is light, so a yellow or pale brand colour is still
// readable on paper. The same test picks the colour for the TOTAL and the PAID tag: the brand colour itself, or near-black if it is
// too light to read on white. Dark colours, including the default green, print exactly as before.
function brandLight(c){
  const m=/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(c||'');if(!m)return false;
  let h=m[1];if(h.length===3)h=h.replace(/./g,x=>x+x);
  const [r,g,b]=[0,2,4].map(i=>{const v=parseInt(h.substr(i,2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});
  return .2126*r+.7152*g+.0722*b>.35;
}

// ── PRINTER: built-in thermal printers on Android POS terminals ──────────────
// Route per device (localStorage): 'browser' = the print dialog as before; 'rawbt' = ESC/POS bytes handed to the free RawBT app, which prints
// to the terminal's printer with no dialog, so a saved sale can print by itself. Chrome only allows that hand-off right after a tap, so
// auto-print runs straight after Charge; if it is ever blocked, the receipt stays on screen and Print still works.
const PRK='mdm_till_printer';
function prefs(){let o=null;try{o=JSON.parse(localStorage.getItem(PRK)||'null');}catch{}return Object.assign({mode:'browser',cols:0,size:1,auto:false},o||{});}
const asc=s=>String(s==null?'':s).replace(/[\u00a0\u202f\u2009]/g,' ').replace(/\u00d7/g,'x').replace(/[\u00b7\u2022]/g,'-').replace(/[\u2212\u2013\u2014]/g,'-').replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7e]/g,'?');
function escposReceipt(b,tag,pf){
  const sz=pf.size==null?1:pf.size|0,SC=[0,1,17][sz]||0,base=pf.cols||(Math.min(screen.width,screen.height)<=600?32:48),W=sz===2?base>>1:base,B=[27,64,27,77,0];   // ESC M 0 = Font A (the larger one); size 2 doubles the width, so half the characters fit   // cols 0 = auto: a handheld terminal (small screen) is 58 mm                       // ESC @ = reset
  const txt=s=>{s=asc(s);for(let i=0;i<s.length;i++)B.push(s.charCodeAt(i));};
  const ln=s=>{txt(s);B.push(10);},al=n=>B.push(27,97,n),bd=n=>B.push(27,69,n),hi=n=>B.push(29,33,n);
  hi(SC);
  const wrap=s=>{s=asc(s);const o=[];while(s.length>W){let k=s.lastIndexOf(' ',W);if(k<1)k=W;o.push(s.slice(0,k));s=s.slice(k).trim();}o.push(s);return o;};
  const lr=(l,r)=>{l=asc(l);r=asc(r);if(l.length+r.length+1>W){wrap(l).forEach(ln);al(2);ln(r);al(0);}else ln(l+' '.repeat(W-l.length-r.length)+r);};
  const ctr=s=>{al(1);wrap(s).forEach(ln);al(0);},rule=c=>ln(c.repeat(W));
  const di=DATA.depotInfo||{};
  bd(1);hi(sz?SC:1);ctr(di.name||'Shop Inventory & Sales Manager');hi(SC);bd(0);
  if(di.district)ctr(di.district);
  if(di.contactPhone)ctr('Tel: '+di.contactPhone);
  if(tag==='TEST PRINT'){ln('123456789012345678901234567890123456789012345678');ln('Using '+W+' characters per line');}   // the ruler wraps where the paper ends: 32 = 58 mm, 48 = 80 mm
  rule('-');ctr('SALES RECEIPT');
  if(b.receiptNo){bd(1);ctr('#'+b.receiptNo);bd(0);}
  if(tag)ctr('['+tag+']');
  const d=new Date(b.at);
  ctr(d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}));
  if(b.cashier)ctr('Served by: '+b.cashier);
  rule('-');
  b.lines.forEach(l=>{bd(1);wrap(l.name).forEach(ln);bd(0);lr(fq(l.qty)+(l.unit?' '+l.unit.toLowerCase():'')+' x '+money(l.price),money(Math.round(l.price*l.qty*100)/100));});
  rule('-');
  if(b.discount>0){lr('Subtotal',money(b.lines.reduce((a,l)=>a+Math.round(l.price*l.qty*100),0)/100));lr('Discount','-'+money(b.discount));}
  bd(1);hi(sz?SC:1);lr('TOTAL',money(b.total));hi(SC);bd(0);
  ln(b.lineCount+(b.lineCount===1?' item':' items')+' / '+fq(b.qtyTotal)+(b.qtyTotal===1?' unit':' units'));
  if(b.payments){
    rule('-');
    b.payments.forEach(x=>lr(x.label+(x.ref?' - '+x.ref:''),money(x.method==='cash'?x.tendered:x.amount)));
    if(b.change>0)lr('Change',money(b.change));
    if(b.balance>0)lr('Balance on account',money(b.balance));
    if(b.customerName)ln('Customer: '+b.customerName);
    if(b.creditStatus&&b.creditStatus!=='paid')ctr(b.creditStatus==='credit'?'** ON CREDIT **':'** PART PAID **');
    else if(b.creditStatus==='paid'&&!b.practice)ctr('** PAID IN FULL **');
  }
  rule('-');ctr('Thank you for your business!');
  B.push(27,100,4);                                // ESC d 4: feed 4 lines so the text clears the tear bar
  return Uint8Array.from(B);
}

// ── PAYMENT (roadmap step 6) ─────────────────────────────────────────────────
// Charge opens one payment screen for the basket. Tenders: cash (amount received, change worked out), MTN Money and
// Airtel Money (transaction reference required), card (slip no. optional); a basket can be split over any mix.
// Whatever is not paid can go on a customer's account: nothing paid = 'credit', some paid = 'partial', all paid =
// 'paid' — the same creditStatus values the main app puts on issues. Money is worked in whole ngwee so totals never drift.
// finalizeSale() takes the receipt number (step 8) and saves the sale to the ledger (step 9).
const METHODS={cash:{label:'Cash'},mtn:{label:'MTN Money',ref:true},airtel:{label:'Airtel Money',ref:true},card:{label:'Card'}};
const toC=n=>Math.round((Number(n)||0)*100),fromC=c=>c/100;
const MAXC=toC(1e9);
let PAYOVL=null,PAYBODY=null,PAYFOOT=null,PAY=null;

// tenders are applied in the order entered. Cash may be more than what is left (the rest is change); MTN/Airtel/card
// may not (they cannot give change) — addTender() blocks that, `over` is only a safety net.
function settle(totalC,tenders){
  let rem=totalC,paid=0,change=0,over=false;
  const applied=tenders.map(t=>{
    const give=toC(t.tendered),use=Math.min(give,rem);

function completePay(){

    payments:PAY.tenders.map((t,i)=>({method:t.method,label:METHODS[t.method].label,amount:fromC(S.applied[i]),tendered:t.tendered,ref:t.ref||''})),
    amountPaid:fromC(S.paid),change:fromC(S.change),balance:fromC(S.rem),creditStatus:payStatus(S),

// Step 8: the receipt number is taken HERE, once: Gate numbering saves the counter first and only then returns the number,
// so a crash leaves a gap but never a repeat. If the counter cannot be saved the sale is refused and the payment screen stays
// open with the payments as entered.
// Step 9: right after the number, the sale is appended to the ledger (sales.js): stored on this phone together with its
// "to upload" mark in ONE transaction. Only when that has succeeded does the cart empty, stock drop and the receipt show;
// if it fails nothing is recorded, the cart and the payments stay as they were, and the cashier can simply try again (the
// number already taken is skipped, which leaves a gap, never a repeat). A practice basket (practice:true) skips all of this.
// Step 16: the whole decision runs inside the shift lock (a second tab cannot close the shift between the check and the save). The
// sale is stamped with the shift it belongs to. No shift, or someone else's shift, and nothing is taken or recorded.
async function recordSale(b){
  const id=tillIdNow(),cur=id?await SHIFTLG.current(id):null;
  if(!cur)return {err:'No shift is open on this till. Open a shift, then try again. The sale was not completed.'};
  if(!sameUser(cur.open.cashier,USER&&USER.username))return {err:'The shift open on this till is '+cur.open.cashier+'\u2019s. It must be closed before you can sell. The sale was not completed.'};
  let r;
  try{r=await NUM.next();}
  catch(e){
    console.warn('Receipt number failed',e);
    return {err:NUM_MSG[e&&e.code]||'Could not take a receipt number. The sale was not completed. Try again.'};
  }
  b.receiptNo=r.receiptNo;b.tillId=r.tillId;b.till=r.code;b.seq=r.seq;b.shiftId=cur.open.shiftId;
  try{return {rec:await LEDGER.append(b)};}
  catch(e){
    console.warn('Sale not saved',e);
    return {err:(e&&e.code==='INVALID')?e.message+'. Nothing was recorded.':(SALE_MSG[e&&e.code]||'The sale could not be saved. Nothing was recorded. Try again.')};
  }
}
let FINALIZING=false,PAYERR='';
const NUM_MSG={
  NOT_REGISTERED:'This till has no receipt code yet. Go online once, then tap \u201cSet up this till now\u201d.',
  STORAGE:'This phone could not save the receipt counter (storage full or blocked). The sale was not completed. Free some space and try again.',
  LOCK:'Another till tab is busy. Wait a moment and try again.'

const SALE_MSG={
  STORAGE:'This phone could not save the sale (storage full or blocked). Nothing was recorded. Free some space and try again.',
  NO_DEPOT:'This till does not know its depot yet. Open the main app online once, then try again.',
  EXISTS:'That receipt number is already recorded. Nothing new was recorded. Try again.'

async function finalizeSale(b){

  if(PAYOVL&&PAY)renderPayFoot(settle(toC(cartTotal()),PAY.tenders));
  try{
    if(b.practice){closePay();showReceipt(b,'PRACTICE \u2014 NOT A SALE');return;}
    if(isReadOnly()){PAYERR='The till is read-only right now. The sale was not completed.';return;}
    const out=await withShiftLock(()=>recordSale(b));   // step 16: shift check, receipt number and ledger append, one at a time
    if(out.err){PAYERR=out.err;return;}
    const rec=out.rec;
    // From here the sale exists. Take it out of stock, empty the cart, show the receipt, and upload if there is signal.
    SALES_ALL.push(rec);

    loadCatalog();renderGrid();paintSales();

// ── DISCOUNT (till roadmap step 18) ─────────────────────────────────────────────
// One discount for the whole basket, as a percentage or an amount, switched on by the Admin (Settings -> Till discounts; OFF by
// default). It is shared out over the lines in whole ngwee (Sales.discountSplit) and saved on the sale: each line's discount, the
// total, who allowed it and an optional reason. The rules are Sales.discountJudge(): a Cashier or Staff login may give up to the
// cashier limit alone; more, up to the maximum, needs a manager PIN (the same PIN pad as step 15; the approver is recorded); an
// Admin or Manager login gives up to the maximum alone; nobody gives more than the maximum. With no PIN set, a discount above the
// cashier limit simply cannot be approved. A PIN approves a percentage ceiling, so adding items keeps it; removing items so that the
// same amount becomes a larger share takes it off. The discount is checked again whenever the basket changes, when Charge opens and
// when payment completes. It is NOT kept when a sale is held, resumed from Held, or restored after a reload: it must be allowed again.
let DISC=null,DOVL=null;              // DISC: {kind:'pct'|'amt', value, reason, by (who allowed it), apBP (percentage a PIN approved, in basis points; 0 = none)}
const DISC_LOST='the discount was not kept, apply it again';

const grossLinesC=()=>CART.map(l=>toC(lineTotal(l)));
function discSplit(){
  if(!DISC||!CART.length)return {lines:CART.map(()=>0),total:0};
  return Sales.discountSplit(grossLinesC(),DISC.kind,DISC.value);
}
// true when nothing changed; false when the discount had to come off (it says why).
function reconcileDisc(){
  if(!DISC)return true;
  if(!CART.length){DISC=null;return true;}
  const sp=discSplit();
  if(!(sp.total>0)){DISC=null;return true;}
  const j=Sales.discountJudge({grossC:grossLinesC().reduce((a,b)=>a+b,0),discC:sp.total,policy:discPolicy(),holder:isHolder(USER),apBP:DISC.apBP||0});
  if(j.ok)return true;

  return false;
}

// ── HELD / PARKED SALES (roadmap step 7) ─────────────────────────────────────
// "Hold sale" parks the cart so the next customer can be served; "Held (n)" beside the search box lists the parked
// baskets and brings one back. A held basket is NOT a sale: nothing is recorded, no stock moves and no receipt number
// is used until it is paid. Baskets are kept on THIS device (localStorage, one list per depot), so they survive a
// reload, a logout or an offline spell, and every till tab on the device sees the same list.
// Resuming moves the basket back into the cart. Whatever is in the cart at that moment is parked first, so nothing is
// lost, and prices are re-read from the Price List: a basket held this morning is sold at today's price, exactly as if
// its items were scanned now. Leaving the till (logout, idle timeout, signed out from another tab) with items in the
// cart parks them instead of throwing them away.
const HELD_MAX=20,HELD_OLD_MS=12*3600*1000;
const heldKey=()=>'mdm_pos_held_v1:'+((DATA&&DATA.installId)||'local');
const heldLineOk=l=>!!(l&&l.id&&Number(l.qty)>0&&Number.isFinite(Number(l.price)));
function readHeld(){
  try{
    const a=JSON.parse(localStorage.getItem(heldKey())||'[]');
    return (Array.isArray(a)?a:[]).filter(h=>h&&h.id&&Array.isArray(h.lines))
      .map(h=>Object.assign({},h,{lines:h.lines.filter(heldLineOk)})).filter(h=>h.lines.length);
  }catch{return [];}
}
function writeHeld(a){
  try{if(a.length)localStorage.setItem(heldKey(),JSON.stringify(a));else localStorage.removeItem(heldKey());return true;}
  catch{return false;}   // storage full or blocked: the caller keeps the cart as it is
}
const heldTotal=h=>Math.round(h.lines.reduce((a,l)=>a+lineTotal({price:Number(l.price),qty:Number(l.qty)}),0)*100)/100;
const cartAsHeld=()=>({
  id:'h_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),at:Date.now(),by:USER?String(USER.username):'',
  lines:CART.map(l=>({id:l.id,kind:l.kind||'item',name:l.name,unit:l.unit||'',per:l.per||'',price:l.price,qty:l.qty}))
});
function ago(t){
  const m=Math.max(0,Math.round((Date.now()-t)/6e4));
  if(m<1)return 'just now';if(m<60)return m+' min ago';
  const h=Math.floor(m/60);if(h<24)return h+' h ago';
  const d=Math.floor(h/24);return d+(d===1?' day ago':' days ago');
}
function renderHeldBtn(){
  if(!HBTN)return;
  const n=readHeld().length;HBTN.hidden=!n;HBTN.textContent='Held ('+n+')';
}
// Returns true when the cart is empty afterwards (held, or there was nothing to hold).
function holdCart(quiet){
  if(!CART.length)return true;
  const a=readHeld();
  if(a.length>=HELD_MAX){say('Too many held sales ('+HELD_MAX+'). Resume or discard one first.','bad');return false;}
  a.push(cartAsHeld());
  if(!writeHeld(a)){say('Could not hold the sale: no storage space left on this device.','bad');return false;}
  const hadDisc=!!DISC;
  CART=[];renderCart();renderHeldBtn();
  if(!quiet)say('Sale held. Serve the next customer.'+(hadDisc?' Its discount is not kept: apply it again when you resume.':''),'ok');
  return true;
}
function parkOnExit(){try{if(CART&&CART.length)holdCart(true);}catch{}}
function resumeHeld(id){
  const a=readHeld(),i=a.findIndex(h=>h.id===id);   // read fresh: another till tab may have resumed it already
  if(i<0){say('That held sale was already resumed or discarded.','bad');renderHeldBtn();renderHeldList();return;}
  const h=a.splice(i,1)[0],parked=CART.length>0,hadDisc=!!DISC;
  if(parked)a.push(cartAsHeld());                   // one out, one in: never over the limit
  if(!writeHeld(a)){say('Could not resume: no storage space left on this device.','bad');return;}
  const r=repriceLines(h.lines);CART=r.lines;DISC=null;   // step 18: the discount of the sale that was open is not carried over
  closeHeld();renderCart();renderHeldBtn();openCart();
  const note=priceNotes(r,'held');
  if(parked)note.push('the sale you had open is now held'+(hadDisc?' without its discount':''));
  say('Held sale resumed'+(note.length?'. '+note.join('. '):'')+'.',r.repriced||r.unlisted.length?'warn':'ok',note.length?7000:null);
}
// Lines coming back from storage (a held basket, a restored cart) are re-read from the Price List, exactly as if the
// items were scanned now. An item with no price any more keeps the stored price and is named in the notes.
function repriceLines(lines){
  let repriced=0;const unlisted=[];
  const out=lines.map(l=>{
    const it=BYID.get(l.id);
    const line={id:l.id,kind:l.kind||'item',name:l.name,unit:l.unit||'',per:l.per||'',price:Number(l.price),qty:Number(l.qty)};
    if(it&&it.price>0){
      if(Math.abs(it.price-line.price)>0.004)repriced++;
      line.price=it.price;line.name=it.name;line.unit=it.unit;line.per=it.per;line.kind=it.kind;
    }else unlisted.push(String(l.name));
    return line;
  });
  return {lines:out,repriced,unlisted};
}
function priceNotes(r,what){   // what: 'held' (Resume) or 'saved' (restored cart)
  const note=[];
  if(r.repriced)note.push(r.repriced+(r.repriced===1?' price was':' prices were')+' updated to the Price List');
  if(r.unlisted.length)note.push((r.unlisted.length===1?r.unlisted[0]+' is':r.unlisted.length+' items are')+' not on the Price List any more, so the '+(what||'held')+' price is kept');
  return note;
}
function discardHeld(id){
  const h=readHeld().find(x=>x.id===id);
  if(!h){renderHeldBtn();renderHeldList();return;}
  if(!confirm('Discard this held sale ('+money(heldTotal(h))+')? It cannot be brought back.'))return;
  writeHeld(readHeld().filter(x=>x.id!==id));
  renderHeldBtn();renderHeldList();
}
function openHeld(){
  if(HOVL||PAYOVL)return;
  const ovl=el('div','povl','',{role:'dialog','aria-modal':'true','aria-label':'Held sales'});
  const box=el('div','pay'),head=el('div','pay-h');

}
function closeHeld(){
  if(!HOVL)return;
  HOVL.remove();HOVL=HBODY=null;

function renderHeldList(){
  if(!HBODY)return;
  const a=readHeld().sort((x,y)=>y.at-x.at),fr=document.createDocumentFragment();
  if(!a.length)fr.append(el('div','h-empty','No held sales.'));

    const when=el('div');
    when.append(
      el('b','',(today?'':d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+', ')+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})),
      el('span','ag'+(Date.now()-h.at>HELD_OLD_MS?' old':''),ago(h.at))
    );
    const top=el('div','h-top');top.append(when,el('b','',money(heldTotal(h))));
    const n=h.lines.length;
    const names=h.lines.slice(0,2).map(l=>l.name).join(', ')+(n>2?' +'+(n-2)+' more':'');
    const row=el('div','held');
    row.append(top,el('div','h-sub',n+(n===1?' item':' items')+' \u00B7 '+names+(h.by?' \u00B7 '+h.by:'')+(h.rec?' \u00B7 recovered':'')));
    const acts=el('div','h-acts');
    const go=el('button','pri','Resume',{type:'button'}),del=el('button','','Discard',{type:'button','aria-label':'Discard held sale'});
    go.onclick=()=>resumeHeld(h.id);del.onclick=()=>discardHeld(h.id);
    acts.append(go,del);row.append(acts);fr.append(row);
  });

// ── MANAGER PIN TO LEAVE THE TILL (till roadmap step 15) ───────────────────────
// With "Require a manager PIN to leave the till" on (Settings → Manager PIN, set by the Admin), a Cashier or Staff login must hand
// the phone to a PIN holder (admin or manager) to use Log out or Main app while a shift is open. NOT asked: idle logout and a logout
// made in the main app (nobody is there to type a PIN, and the shift is still closed out later), or the cards shown before the
// till opens. Rules and PIN checking live in gate.js (Gate.pin*), shared with index.html where the PIN is set.
// shiftOpen() is the ONE place that says "a shift is open" for this rule. Since step 16 it is the real thing: the person logged in
// has an open shift on this till (see SHIFTS below) and is not a PIN holder. Closing the shift is the way out that needs no PIN.
const PIN_HOLDER_ROLES=Gate.PIN_ROLES;
function shiftOpen(){return !!shiftMine()&&!isHolder(USER);}
let PINOVL=null;
function exitGuard(go){
  if(!Gate.pinRequired(DATA,shiftOpen()))return go();
  askManagerPin(go);
}
function closePin(skipFocus){
  if(!PINOVL)return;
  PINOVL.remove();PINOVL=null;
  if(!skipFocus&&!COARSE)focusSearch();
}
function askManagerPin(go,msg,label){            // go(who) runs after a PIN holder's PIN was typed; step 18 reuses the pad for discounts
  if(PINOVL)return;
  const ovl=el('div','povl','',{role:'dialog','aria-modal':'true','aria-label':'Manager PIN'});
  const box=el('div','pay'),head=el('div','pay-h');
  const cx=el('button','sm','Cancel',{type:'button'});cx.onclick=()=>closePin();
  head.append(el('h2','','Manager PIN'),cx);
  const body=el('div','pay-body'),f=el('label','fld');
  const inp=el('input','',null,{type:'password',inputmode:'numeric',pattern:'[0-9]*',maxlength:'6',autocomplete:'off','aria-label':'Manager PIN'});
  f.append(el('span','',msg||'A manager must type their PIN to leave the till while a shift is open.'),inp);
  const err=el('div','pay-err','');
  body.append(f,err);
  const foot=el('div','pay-f'),ok=el('button','pri',label||'Unlock',{type:'button'});
  foot.append(ok);
  box.append(head,body,foot);ovl.append(box);
  ovl.addEventListener('click',e=>{if(e.target===ovl)closePin();});
  inp.addEventListener('input',()=>{inp.value=inp.value.replace(/\D/g,'').slice(0,6);});
  async function submit(){
    err.textContent='';
    const st=Gate.pinLockState(localStorage,Date.now());
    if(st.locked){err.textContent='Too many wrong PINs. Try again in '+Math.ceil(st.left/1000)+' seconds.';return;}
    const pin=inp.value;
    if(!Gate.pinValid(pin)){err.textContent='Type the 4 to 6 digit PIN.';return;}
    ok.disabled=true;ok.textContent='Checking\u2026';
    let who=null,bad=false;
    try{who=await Gate.pinFindApprover(pin,DATA);}catch(e){bad=true;}
    ok.disabled=false;ok.textContent=label||'Unlock';
    if(!PINOVL)return;                                   // cancelled while it was checking
    if(bad){err.textContent='This phone could not check the PIN. Try again, or ask the Admin.';return;}
    if(who){Gate.pinClear(localStorage);closePin(true);go(who);return;}
    const r=Gate.pinFailed(localStorage,Date.now());
    inp.value='';inp.focus();
    err.textContent=r.locked?'Too many wrong PINs. Locked for '+Math.ceil(r.left/1000)+' seconds.':'Wrong PIN. '+r.triesLeft+(r.triesLeft===1?' try':' tries')+' left.';
  }
  ok.onclick=submit;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit();}});
  document.body.append(ovl);PINOVL=ovl;
  const st0=Gate.pinLockState(localStorage,Date.now());
  if(st0.locked)err.textContent='Too many wrong PINs. Try again in '+Math.ceil(st0.left/1000)+' seconds.';
  inp.focus();
}

// ── SHIFTS (till roadmap step 16) ───────────────────────────────────────────────
// A shift is one cashier on this till: "Open shift" (the FLOAT, the cash already in the drawer) to "Close shift" (the cash COUNTED).
// Both are append-only records kept by shifts.js, uploaded like sales (shifts/{id}, shiftCloses/{id}). A real sale needs an open
// shift of the person logged in; every sale carries its shiftId. Expected cash = float + the CASH taken on that shift's sales
// (change already left out); the difference to the count is saved with the close. A practice sale needs no shift.
// One shift per till at a time. A shift left open (idle logout, phone put away) is still there at the next login: the same cashier
// carries on; anyone else must have an admin or manager close it first (they count the drawer; the record says it was forced).
// Opening and closing are checked under a lock together with taking a sale, so a second tab cannot sell into a shift that has
// just been closed. Cash out of the drawer during a shift (refunds: step 19; pay-outs are not built) goes in as `out`; shifts.js already
// takes it as `out`. X and Z reports (step 17) are further down, after renderShiftDone.
// Step 19: cash handed back on voids and refunds (VOIDS AND REFUNDS, further down) is that `out`: Returns.cashOutOf(shiftId).
const SHIFTLG=Shifts.create({
  depotKey:()=>DATA&&DATA.installId,
  opts:{dateOf:t=>new Date(t).toISOString().slice(0,10)},   // the same date rule as the sales ledger
  adapter:Shifts.idbAdapter()
});
let SHIFT=null,SHIFT_ALL=[],SHIFTS_PENDING=0,SHIFT_ERR='',shiftsBusy=false,shiftPrompted=false;   // SHIFT: {open,close:null} for THIS till, or null
let SHOVL=null,SHBODY=null,SHTTL=null,SHDONE=null,SHVIEW='',SHBUSY=false,SHOPENING=false,SHBC=null;
const SHIFT_MSG={
  NOT_REGISTERED:'This till has no receipt code yet. Go online once, then try again.',
  STORAGE:'This phone could not save the shift (storage full or blocked). Nothing was recorded. Free some space and try again.',
  NO_DEPOT:'This till does not know its depot yet. Open the main app online once, then try again.',
  BAD_FLOAT:'Type the float as an amount, for example 200 or 150.50. Type 0 if the drawer is empty.',
  BAD_COUNT:'Type the cash you counted as an amount, for example 1250 or 980.50. Type 0 if the drawer is empty.'
};
const sameUser=(a,b)=>String(a||'').toLowerCase()===String(b||'').toLowerCase();

function shiftState(){return !SHIFT?'none':(shiftMine()?'mine':'other');}   // none: no shift on this till; mine: the person logged in; other: someone else's
function amt(v){                                   // "200", "1,250.50" -> number; anything else -> NaN
  const s=String(v==null?'':v).replace(/[\s,]/g,'');
  if(!/^\d*\.?\d{0,2}$/.test(s)||s===''||s==='.')return NaN;

function lastFloat(){                              // the float this till opened its last shift with: a sensible starting figure

// ── X AND Z REPORTS (till roadmap step 17) ─────────────────────────────────────
// X report: a reading of the shift that is open right now (sales, money by method, cash that should be in the drawer). It records
//   nothing and changes nothing, so it can be taken as often as wanted. The cashier gets it for their own shift; an admin or manager
//   can also take it for someone else's open shift on this till.
// Z report: the final figures of a CLOSED shift. They are the close record itself (shiftCloses/{id}), so the Z cannot differ from what was
//   counted and signed off, and it has no number of its own: the shift id is its number. Printed right after Close shift, and the last
//   one on this till can be reprinted from the Open shift screen (marked COPY).
// Both are worked out from the ledger on this phone each time (Shifts.report). If a Z is printed on a phone that has not downloaded
// every sale of that shift, the totals stay correct and the item list is left out rather than shown wrong.
// The report uses the receipt's paper (logo, brand colour, print rules), so it prints the same way: Print, then the browser's print
// dialog, which also gives \"Save as PDF\". The main app's day close-out (index.html) adds the day's Z over all tills.

// kind 'X' or 'Z'; copy = this Z is a reprint. Reads the ledger fresh first: another tab may have sold or closed meanwhile.
async function showShiftReport(shiftId,kind,copy){
  if(RPOVL||ROVL)return;
  try{await loadSold();await loadShift();}catch(e){console.warn('Could not refresh before the report',e);}
  const cur=Shifts.shiftsOf(SHIFT_ALL).find(x=>x.open.shiftId===shiftId);

  if(kind==='Z'){say('That shift is not closed yet.','warn',4000);return;}

// ── VOIDS AND REFUNDS (till roadmap step 19) ──────────────────────────────────────────────────────────────────
// A sale is never edited or deleted. Taking something back writes a NEW record that points at the sale (returns.js; uploaded to
// depots/<depot>/returns/<id> like sales, create-only):
//   VOID    the whole sale, only in the shift it was taken in; the money goes back the way it came (cash as cash, MTN as MTN).
//   REFUND  some or all of the lines, any time. The customer's unpaid balance is cleared first; only the rest is money handed back, by any
//           method, never more than was paid. Damaged goods are not put back in stock (untick "Put the goods back in stock").
// Always a reason, and someone with authority: an Admin or Manager login allows it itself, anyone else needs a manager PIN (the pad of
// step 15, the approver is recorded). Cash handed back comes out of THIS shift's drawer (expected cash drops by it), so it needs the
// cashier's own open shift. It is booked on the day and in the shift it is MADE: a closed shift or day is never changed. It works offline:
// the record is saved on the phone first, the receipt shows only after that, and it uploads when there is signal. The number comes from
// the till's receipt counter (K7F2-R000125), so two tills can never collide. Two offline tills can still return the same item at the
// same moment; the app cannot stop that, it can only find it afterwards (Returns.overReturned).
const RT_MSG={
  STORAGE:'This phone could not save it (storage full or blocked). Nothing was recorded. Free some space and try again.',
  NO_DEPOT:'This till does not know its depot yet. Open the main app online once, then try again.',
  EXISTS:'That return number is already recorded. Nothing new was recorded. Try again.'
};
let RTOVL=null,RTBODY=null,RTTTL=null,RT=null,RTBUSY=false;
const cashOutNow=id=>Returns.cashOutOf(id,RETS_ALL);
const retNum=s=>String((s&&(s.receiptNo||s.id))||'');
function parseQty(v){const t=String(v==null?'':v).trim().replace(',','.');if(!/^\d*\.?\d{0,3}$/.test(t)||t===''||t==='.')return 0;return Number(t);}
function anyOverlay(){return !!(RTOVL||PAYOVL||HOVL||PINOVL||SHOVL||MOVL||CAMOVL||DOVL||ROVL||RPOVL||PRNOVL);}
function openReturns(){
  if(anyOverlay()||RTBUSY)return;

  if(!tillReady()){say('This till has no receipt code yet. Go online once first.','warn',5000);return;}
  RTBUSY=true;
  (async()=>{
    try{await loadSold();await loadShift();paintShift();}finally{RTBUSY=false;}
    if(anyOverlay())return;
    if(!shiftMine()){say(shiftState()==='other'?'The shift on this till is '+SHIFT.open.cashier+'\u2019s. Nobody can take anything back until it is closed.':'Open your shift first. Cash handed back comes out of its drawer.','warn',6000);return;}

    cx.onclick=closeReturns;RTTTL=el('h2','','Void or refund');
    head.append(RTTTL,cx);
    RTBODY=el('div','pay-body held-body');
    box.append(head,RTBODY);ovl.append(box);
    ovl.addEventListener('click',e=>{if(e.target===ovl)closeReturns();});
    document.body.append(ovl);RTOVL=ovl;
    RT={step:'find',q:'',sale:null,kind:'refund',qty:new Map(),picks:[],reason:'',note:'',restock:true,restockSet:false,alloc:null,busy:false,err:'',btn:null};
    renderRet();

}

// ── 1. find the sale: today's sales on this phone, or search by receipt number (or customer)
function retFindList(q){
  const t=String(q||'').trim().toUpperCase(),today=new Date().toISOString().slice(0,10);
  let list=SALES_ALL.filter(x=>x&&x.id);
  list=t?list.filter(x=>String(x.id).includes(t)||String(x.customerName||'').toUpperCase().includes(t)):list.filter(x=>x.date===today);
  return list.sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,40);
}
function renderRetFind(){
  RTTTL.textContent='Void or refund';
  const fr=document.createDocumentFragment();
  fr.append(el('div','h-sub','Find the sale: type or scan its receipt number (the last digits are enough), or choose one of today\u2019s.'));
  const inp=el('input','',null,{type:'text',autocomplete:'off','aria-label':'Receipt number',placeholder:'Receipt number'});
  inp.value=RT.q;

  const draw=()=>{
    RT.q=inp.value;
    const rows=retFindList(RT.q),f=document.createDocumentFragment();
    if(!rows.length)f.append(el('div','h-empty',RT.q.trim()?'No sale on this phone matches \u201c'+RT.q.trim()+'\u201d.':'No sales yet today.'));
    rows.forEach(x=>{
      const rem=Returns.remaining(x,RETS_ALL);
      const when=el('div');when.append(el('b','',x.time||''),el('span','ag',retNum(x)));
      const top=el('div','h-top');top.append(when,el('b','',money(x.total)));

// ── LIVE-CART AUTOSAVE ───────────────────────────────────────────────────────
// Held baskets only protect a sale the cashier parks, or leaves through logout / idle timeout. An OPEN cart used to
// live in memory alone, so a reload (including the update reload), a killed browser or a dead battery lost it. Now every
// cart change writes the cart to localStorage (one draft per till tab, per depot), and the draft is deleted the moment
// the cart is empty again (held, cleared, or, later, paid).
//   • Reloaded tab: the tab keeps its id in sessionStorage, so it finds its own draft and puts it straight back in the
//     cart (re-priced, see repriceLines). A different cashier's draft goes to Held instead of into this cashier's cart.
//   • Tab that died (browser killed, phone restarted): its draft is moved to the Held list, marked "recovered", by
//     whichever till tab opens next. Whether a tab is still alive is read from the Web Locks API: every till tab holds a
//     lock named after its id for as long as it is open. Without Web Locks a draft is only adopted after HELD_OLD_MS of
//     silence, so a tab that is merely in the background is never robbed of its cart.
// Nothing here records a sale; a draft is just a cart that survived.
const DRAFT_PFX='mdm_pos_draft_v1:',TAB_KEY='mdm_pos_tab',LOCK_PFX='mdm_pos_tab:';
let TAB='';
const draftKey=(tab)=>DRAFT_PFX+((DATA&&DATA.installId)||'local')+':'+tab;
function saveDraft(){
  if(!TAB)return;                                   // before boot has claimed a tab id
  try{
    if(!CART.length){localStorage.removeItem(draftKey(TAB));return;}
    localStorage.setItem(draftKey(TAB),JSON.stringify({v:1,tab:TAB,at:Date.now(),by:USER?String(USER.username):'',disc:DISC?1:0,
      lines:CART.map(l=>({id:l.id,kind:l.kind||'item',name:l.name,unit:l.unit||'',per:l.per||'',price:l.price,qty:l.qty}))}));
  }catch{}                                          // storage full or blocked: the cart still works, it just is not saved
}
// Pick this tab's id and take its lock. A duplicated browser tab copies sessionStorage, so if another tab already holds
// the lock for the id we were given, we take a new one rather than share a draft with it.
async function claimTab(){
  const mk=()=>'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  let id=null;try{id=sessionStorage.getItem(TAB_KEY);}catch{}
  if(!id)id=mk();
  if(navigator.locks&&navigator.locks.request){
    for(let i=0;i<3;i++){
      let got=false;
      try{got=await new Promise(res=>{
        navigator.locks.request(LOCK_PFX+id,{ifAvailable:true},lock=>{
          if(!lock){res(false);return;}
          res(true);return new Promise(()=>{});     // never settles: the lock is held until this page closes
        }).catch(()=>res(true));
      });}catch{got=true;}
      if(got)break;
      id=mk();
    }
  }
  try{sessionStorage.setItem(TAB_KEY,id);}catch{}
  return id;
}
async function liveTabLocks(){
  try{
    if(!(navigator.locks&&navigator.locks.query))return null;
    return new Set(((await navigator.locks.query()).held||[]).map(l=>l.name));
  }catch{return null;}                              // unknown: the caller falls back to the age rule
}
// Called at boot (before the sell screen is built; boot=true) and whenever the till comes back to the front.
// Returns {restored,adopted} so the caller can say what happened.
async function recoverDrafts(boot){
  const out={restored:0,adopted:0,notes:[]};
  const pre=draftKey(''),mine=draftKey(TAB);
  const keys=[];
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(pre))keys.push(k);}}catch{return out;}
  if(!keys.length)return out;
  const live=await liveTabLocks();
  const held=readHeld(),have=new Set(held.map(h=>h.id)),adopt=[],spent=[];
  const me=USER?String(USER.username).toLowerCase():'';
  for(const k of keys){
    let d=null;try{d=JSON.parse(localStorage.getItem(k)||'null');}catch{}
    const lines=d&&Array.isArray(d.lines)?d.lines.filter(heldLineOk):[];
    if(!lines.length){if(k!==mine)try{localStorage.removeItem(k);}catch{}continue;}   // empty or unreadable: nothing to keep
    if(k===mine){
      if(!boot)continue;                                                              // our own live draft
      if(!CART.length&&String(d.by||'').toLowerCase()===me){
        const r=repriceLines(lines);CART=r.lines;out.restored=r.lines.length;out.notes=priceNotes(r,'saved');
        if(d.disc)out.notes.push(DISC_LOST);continue;
      }
      // someone else's cart, or this tab already has items: park it below
    }else{
      const dead=live?!live.has(LOCK_PFX+d.tab):Date.now()-(Number(d.at)||0)>HELD_OLD_MS;
      if(!dead)continue;                                                              // another tab is still using it
    }
    if(d.disc&&!out.notes.includes(DISC_LOST))out.notes.push(DISC_LOST);
    adopt.push({id:'r_'+String(d.tab)+'_'+String(d.at),at:Number(d.at)||Date.now(),by:String(d.by||''),rec:true,
      lines:lines.map(l=>({id:l.id,kind:l.kind||'item',name:l.name,unit:l.unit||'',per:l.per||'',price:Number(l.price),qty:Number(l.qty)})),key:k});
  }
  // Move them into Held. A fixed id (tab + last change) means a pass that is interrupted before the draft is deleted
  // cannot create the basket twice. If Held is full the draft simply stays where it is and is tried again next time.
  let changed=false;
  for(const a of adopt){
    const {key,...h}=a;
    if(have.has(h.id)){spent.push(key);continue;}
    if(held.length>=HELD_MAX)break;
    held.push(h);have.add(h.id);spent.push(key);out.adopted++;changed=true;
  }
  if(changed&&!writeHeld(held)){out.adopted=0;return out;}   // could not save the list: keep every draft
  spent.forEach(k=>{try{localStorage.removeItem(k);}catch{}});
  return out;
}
function draftNotice(r){
  const m=[];
  if(r.restored)m.push('Your open sale was restored');
  if(r.adopted)m.push(r.adopted+(r.adopted===1?' unsaved sale was':' unsaved sales were')+' recovered into Held');
  m.push(...r.notes);
  return m;
}

// ── CAMERA SCANNER (roadmap step 12) ─────────────────────────────────────────
// The phone camera plus the browser's own BarcodeDetector (Chrome and Samsung Internet on Android, installed PWA included).
// No library, nothing to download, works offline. Safari and desktop Chrome on Windows/Linux do not have it: the camera button
// is not shown there, and the scan box (USB/Bluetooth scanner, or typing) works as before.
// The camera stays open so a whole basket is scanned in one go. Every read goes through resolveCode(), the same exact
// barcode/SKU rule as the scan box, so a camera read can never add an item the scan box would refuse. Only a barcode near the
// middle of the picture counts, and if two different ones are there nothing is added. A code that stays in view is added once;
// take it out of view to add it again. The camera is switched off on Done, Escape, when the app goes to the background and
// when the page closes.
const CAM_FORMATS=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code'];
const CAM_CHECKED=['ean_13','ean_8','upc_a','upc_e','code_128'];   // have a check digit: one frame is enough. The rest must be read twice in a row.
let CAMOVL=null,CAM=null;
const camOk=()=>!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&'BarcodeDetector' in window);
function camStatus(me,text,cls){if(CAM!==me)return;me.st.textContent=text;me.st.className='sst'+(cls?' '+cls:'');}
function camSum(me){if(CAM!==me)return;me.sum.textContent=CART.length?CART.length+(CART.length===1?' item':' items')+' \u00B7 '+money(cartTotal()):'Cart is empty';}
function camFlash(me,cls){if(CAM!==me)return;me.aim.className='aim '+cls;clearTimeout(me.flashT);me.flashT=setTimeout(()=>{if(CAM===me)me.aim.className='aim';},700);}
function camBeep(me,ok){
  try{navigator.vibrate&&navigator.vibrate(ok?40:[80,60,80]);}catch{}
  const c=me.ac;if(!c)return;
  try{
    if(c.state==='suspended')c.resume();
    const o=c.createOscillator(),g=c.createGain(),t=c.currentTime;
    o.frequency.value=ok?1100:220;g.gain.value=.12;o.connect(g);g.connect(c.destination);
    o.start(t);o.stop(t+(ok?.09:.22));
  }catch{}
}
function camFail(me,text){camStatus(me,text,'bad');camFlash(me,'bad');}
async function startCam(){
  if(CAMOVL)return;
  if(!camOk()){say('Camera scanning is not available on this browser. Use a scanner or type the code.','bad',5000);return;}
  const ovl=el('div','sovl','',{role:'dialog','aria-modal':'true','aria-label':'Camera barcode scanner'});
  const video=el('video','','',{playsinline:'',autoplay:'','aria-hidden':'true'});video.muted=true;
  const head=el('div','sh');head.append(el('b','','Scan barcodes'));
  const aim=el('div','aim');
  const st=el('div','sst','Starting camera\u2026',{role:'status','aria-live':'polite'});
  const sum=el('div','ssum');
  const torch=el('button','','Torch',{type:'button'});torch.hidden=true;
  const done=el('button','pri','Done',{type:'button'});
  const row=el('div','sbtn');row.append(torch,done);
  const foot=el('div','sf');foot.append(st,sum,row);
  ovl.append(video,head,aim,foot);document.body.append(ovl);
  const me=CAM={video,aim,st,sum,stream:null,det:null,timer:0,flashT:0,ac:null,lastCode:'',seenAt:0,pend:'',pendN:0,multi:false,errs:0};
  CAMOVL=ovl;done.onclick=stopCam;camSum(me);
  try{const AC=window.AudioContext||window.webkitAudioContext;if(AC)me.ac=new AC();}catch{}   // made inside the tap, so the beep is allowed
  let det;
  try{
    const sup=await BarcodeDetector.getSupportedFormats();
    const f=CAM_FORMATS.filter(x=>sup.includes(x));
    if(!f.length)throw new Error('no formats');
    det=new BarcodeDetector({formats:f});
  }catch{if(CAM===me)camFail(me,'Camera scanning is not supported on this device. Use a scanner or type the code.');return;}
  if(CAM!==me)return;
  let stream;
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});
  }catch(e){
    const n=e&&e.name;
    camFail(me,n==='NotAllowedError'||n==='SecurityError'?'The camera is blocked. Allow the camera for this app in the phone\u2019s site settings, then try again.'
      :n==='NotFoundError'||n==='OverconstrainedError'?'No camera found on this device.'
      :n==='NotReadableError'?'The camera is being used by another app. Close it and try again.':'Could not start the camera.');
    return;
  }
  if(CAM!==me){stream.getTracks().forEach(t=>{try{t.stop();}catch{}});return;}   // Done was tapped while the camera was starting
  me.stream=stream;me.det=det;
  const track=stream.getVideoTracks()[0],caps=(track&&track.getCapabilities&&track.getCapabilities())||{};
  if(caps.focusMode&&caps.focusMode.includes('continuous'))track.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{});
  if(caps.torch){
    let on=false;torch.hidden=false;
    torch.onclick=async()=>{try{await track.applyConstraints({advanced:[{torch:!on}]});on=!on;torch.classList.toggle('on',on);}catch{}};
  }
  video.srcObject=stream;
  try{await video.play();}catch{}
  camStatus(me,'Aim at one barcode. Keep scanning, tap Done when finished.','');
  camTick(me);
}
async function camTick(me){
  if(CAM!==me)return;
  let found=[];
  try{
    if(me.video.readyState>=2&&me.video.videoWidth)found=await me.det.detect(me.video);
    me.errs=0;
  }catch{
    if(++me.errs>=25){camFail(me,'The scanner stopped working. Tap Done and try again.');return;}
  }
  if(CAM!==me)return;
  camRead(me,found);
  me.timer=setTimeout(()=>camTick(me),120);
}
function camRead(me,found){
  const v=me.video,W=v.videoWidth,H=v.videoHeight,now=Date.now();
  const seen=new Map();                                  // code -> format, only barcodes near the middle of the picture
  found.forEach(r=>{
    const val=String(r.rawValue||'').trim();if(!val)return;
    const b=r.boundingBox;
    if(b&&W&&H){const cx=b.x+b.width/2,cy=b.y+b.height/2;if(cx<W*.1||cx>W*.9||cy<H*.25||cy>H*.75)return;}
    seen.set(val,r.format);
  });
  if(!seen.size){
    me.pend='';me.pendN=0;
    if(me.multi){me.multi=false;camStatus(me,'Aim at one barcode.','');}
    if(me.lastCode&&now-me.seenAt>700)me.lastCode='';     // the code left the picture: it can be added again
    return;
  }
  if(seen.size>1){me.multi=true;me.pend='';me.pendN=0;camStatus(me,'Several barcodes in view. Aim at one.','warn');return;}
  me.multi=false;
  const [val,fmt]=[...seen][0];
  if(val===me.lastCode){me.seenAt=now;return;}           // still holding the same item up: added once
  if(!CAM_CHECKED.includes(fmt)){
    if(me.pend!==val){me.pend=val;me.pendN=1;return;}
    if(++me.pendN<2)return;
  }
  me.pend='';me.pendN=0;me.lastCode=val;me.seenAt=now;
  camAccept(me,val);
}
function camAccept(me,val){
  idleReset();                                           // scanning counts as activity: no idle logout in the middle of a basket
  const r=resolveCode(val,{camera:true});
  if(r.err){camBeep(me,false);camStatus(me,r.err,'bad');camFlash(me,'bad');return;}
  const it=r.hit;addItem(it,1);camBeep(me,true);
  const l=CART.find(x=>x.id===it.id),over=!!l&&l.qty>it.avail;
  camStatus(me,'\u2713 '+it.name+(l&&l.qty>1?' \u00D7'+fq(l.qty):'')+(over?(it.avail>0?' \u00B7 only '+fq(it.avail)+' in stock':' \u00B7 none in stock'):''),over?'warn':'ok');
  camFlash(me,over?'warn':'ok');camSum(me);
}
function stopCam(){
  const me=CAM;CAM=null;
  if(me){
    clearTimeout(me.timer);clearTimeout(me.flashT);
    try{me.video.pause();me.video.srcObject=null;}catch{}
    if(me.stream)me.stream.getTracks().forEach(t=>{try{t.stop();}catch{}});
    if(me.ac){try{me.ac.close();}catch{}}
  }
  if(CAMOVL){CAMOVL.remove();CAMOVL=null;if(!COARSE)focusSearch();}
}

  if(sessionStorage.getItem('_play')==='1')return card('🔒','Not available','The till is not available in this version of the app.',[['Back to app',toApp,true]]);
  DATA=await loadData();
  if(!DATA)return card('📭','No data on this device','Open the main app and sign in first.',[['Open main app',toApp,true]]);
  USER=sessionUser();
  if(!USER)return card('🔑','Please sign in','Sign in on the main app, then open the Till from there.',[['Open main app',toApp,true]]);
  LICENSE=await loadLicense();
  if(!hasFeature('pos_till'))return card('🔒','Till not available','The Till is not available on this account. Check the main app.',[['Back to app',toApp,true]]);
  if(isReadOnly())return card('⏸','Till unavailable','This account is read-only right now (suspended, pending or in grace period). Check the main app.',[['Back to app',toApp,true]]);
  try{sessionStorage.setItem(SESSION_KEY,JSON.stringify({u:String(USER.username).toLowerCase(),t:Date.now()}));}catch{}
  const di=DATA.depotInfo||{};
  $('depot').textContent=di.name||'';
  setPill('p-user',USER.username+(USER.role?' · '+USER.role:''));
  $('hdr').hidden=false;netPill();cloudPill();
  addEventListener('online',()=>{netPill();cloudPill();setupTill();syncAll();paintSales();});addEventListener('offline',()=>{netPill();paintSales();});
  setInterval(syncAll,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncAll();});
  ['pointerdown','keydown','touchstart','scroll'].forEach(e=>document.addEventListener(e,idleReset,{passive:true,capture:true}));
  idleReset();
  try{new BroadcastChannel('mdm_session').onmessage=e=>{if(e.data&&e.data.type==='logout'){parkOnExit();try{sessionStorage.removeItem(SESSION_KEY);}catch{}toApp();}};}catch{}
  addEventListener('storage',e=>{if(e.key==='mdm_session_event'&&e.newValue&&e.newValue.startsWith('logout:')){parkOnExit();try{sessionStorage.removeItem(SESSION_KEY);}catch{}toApp();}});
  $('b-app').onclick=()=>exitGuard(toApp);$('b-out').onclick=()=>exitGuard(logout);   // the two exits the cashier chooses; idle logout calls logout() directly
  if(isCashier()){$('b-app').hidden=true;$('b-mine').hidden=false;$('b-mine').onclick=openMine;}   // no main app for a cashier; its own report instead
  await loadSold();                                    // stock = received - issued - sold: the ledger must be read BEFORE the catalog is built
  await loadShift();
  try{SHBC=new BroadcastChannel('mdm_shift');SHBC.onmessage=async()=>{await loadShift();paintShift();if(SHOVL&&!SHBUSY)renderShift();if(PAYOVL&&PAYFOOT&&PAY)renderPayFoot(settle(toC(cartTotal()),PAY.tenders));};}catch{}
  $('b-shift').onclick=openShiftSheet;
  $('b-print').onclick=openPrinter;
  $('b-ret').onclick=openReturns;
  loadCatalog();
  paintTill();setupTill();paintSales();syncAll();                              // claim this till's code (needs the network once)
  TAB=await claimTab();
  const rc=await recoverDrafts(true);                   // BEFORE buildSell: its first renderCart would delete our draft
  buildSell();
  paintShift();
  if(rc.restored||rc.adopted){const n=draftNotice(rc);say(n.join('. ')+'.',rc.notes.length?'warn':'ok',7000);if(rc.restored)openCart();}
  maybePromptShift();                                   // no shift yet (or someone else's): open straight onto the shift sheet
}
boot();
</script>
</body>
</html>
