<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18251f">
<meta name="robots" content="noindex">
<title>Offline | Food Connect</title>
<link rel="icon" href="icons/favicon.ico">
<style>
:root{--ink:#18251f;--bone:#f7f3e8;--dim:#c4cdc6;--amber:#f0a43a;--line:rgba(247,243,232,.16)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--ink);color:var(--bone);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.box{max-width:420px;text-align:center}
.logo{display:block;width:68px;height:68px;margin:0 auto 20px;border-radius:20px}
h1{font-size:1.5rem;line-height:1.2;margin-bottom:10px}
p{color:var(--dim);margin-bottom:22px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{display:inline-block;padding:12px 20px;border-radius:999px;font:inherit;font-weight:600;text-decoration:none;cursor:pointer;border:1px solid var(--line);background:none;color:var(--bone)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.small{margin-top:22px;font-size:.85rem;color:var(--dim)}
</style>
</head>
<body>
<main class="box">
  <img class="logo" src="icons/icon-192.png" alt="" width="68" height="68">
  <h1>You are offline</h1>
  <p>Food Connect needs the internet to show restaurants and send your order. Check your data or Wi-Fi and try again.</p>
  <div class="row">
    <button class="btn primary" id="retry" type="button">Try again</button>
    <a class="btn" href="tel:+260977638790">Call us</a>
  </div>
  <p class="small" id="msg" role="status"></p>
</main>
<script>
(function(){
  var msg=document.getElementById("msg");
  function go(){location.href="shop.html"}
  document.getElementById("retry").onclick=function(){
    if(navigator.onLine){go()}else{msg.textContent="Still offline. We will reload as soon as you reconnect."}
  };
  window.addEventListener("online",go);
})();
</script>
</body>
</html>
